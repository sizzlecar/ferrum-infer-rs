<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Ferrum — Rust-native local LLM runtime</title>
  <desc id="desc">Ferrum supports local LLM inference on Apple Silicon Metal and NVIDIA CUDA.</desc>
  <rect width="1280" height="640" fill="#f4f5f2"/>
  <circle cx="1130" cy="88" r="270" fill="#81d8a7" opacity=".12"/>
