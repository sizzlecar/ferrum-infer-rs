[workspace]
members = [
    # New refactored crates
    "crates/ferrum-types",
    "crates/ferrum-interfaces",
    
    # Implementation crates
    "crates/ferrum-scheduler",
    "crates/ferrum-tokenizer",
    "crates/ferrum-sampler",
    "crates/ferrum-kv",

    # Native operator ABI + artifact resolver (no third-party kernel sources)
    "crates/ferrum-native-ops",
    "crates/ferrum-native-ops-builder",
    
    # Unified compute kernels (CUDA/Metal/CPU) — Backend<B> trait stack
    # plus the fused-transformer module (formerly ferrum-attention).
    "crates/ferrum-kernels",

    # Weight-format abstraction (Dense / GPTQ / AWQ / GGUF)
    "crates/ferrum-quantization",

    # Product crates
    "crates/ferrum-engine",
    "crates/ferrum-models",
    "crates/ferrum-server",
    "crates/ferrum-cli",
    "crates/ferrum-testkit",

    # Bench schema + variance aggregation (Phase 0 of testing system)
    "crates/ferrum-bench-core",

    # Internal CI/release tooling; not published.
    "crates/ferrum-devtools",
]
resolver = "2"


[workspace.package]
version = "0.12.1"
edition = "2021"
authors = ["Ferrum Team"]
license = "MIT"
repository = "https://github.com/sizzlecar/ferrum-infer-rs"
homepage = "https://github.com/sizzlecar/ferrum-infer-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
llguidance = { version = "1.7.6", default-features = false, features = ["ahash", "referencing", "lark"] }
jsonschema = { version = "0.48.1", default-features = false }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Configuration
config = "0.14"
toml = "0.8"

# CLI utilities
clap = "4.4"

# HTTP client (using rustls to avoid macOS system-configuration issues)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream", "json"] }

# System utilities
num_cpus = "1.16"
dirs = "5.0"

# Stream processing
futures = "0.3"

hf-hub = "0.4.1"
# Keep inference features; the optional C++ vocabulary trainer forces a static
# MSVC CRT that conflicts with the native CUDA operators' dynamic CRT.
tokenizers = { version = "0.21", default-features = false, features = ["onig", "progressbar"] }
safetensors = "0.4"

# Random - 使用与candle-vllm相同的版本
rand = "0.9.0"
rand_chacha = "=0.9.0"
rand_distr = "0.4.3"

# Numeric types and parallelism
half = { version = "2.5.0", features = ["num-traits", "use-intrinsics", "rand_distr"] }
float8 = "0.7.0"
rayon = "1.11"

# ML Framework - official candle from crates.io
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
candle-flash-attn = "0.9.2"
candle-metal-kernels = "0.9.2"

# Internal crates - New refactored crates
ferrum-types = { path = "crates/ferrum-types", version = "0.12.1" }
ferrum-interfaces = { path = "crates/ferrum-interfaces", version = "0.12.1" }

# Internal crates - Implementation crates
ferrum-scheduler = { path = "crates/ferrum-scheduler", version = "0.12.1" }
ferrum-tokenizer = { path = "crates/ferrum-tokenizer", version = "0.12.1" }
ferrum-sampler = { path = "crates/ferrum-sampler", version = "0.12.1" }
ferrum-kv = { path = "crates/ferrum-kv", version = "0.12.1" }
ferrum-native-ops = { path = "crates/ferrum-native-ops", version = "0.12.1" }

# Unified compute kernels (CUDA/Metal/CPU)
ferrum-kernels = { path = "crates/ferrum-kernels", version = "0.12.1" }

# Weight-format abstraction (Dense / GPTQ / AWQ / GGUF)
ferrum-quantization = { path = "crates/ferrum-quantization", version = "0.12.1" }

# Internal product crates
ferrum-engine = { path = "crates/ferrum-engine", version = "0.12.1" }
ferrum-models = { path = "crates/ferrum-models", version = "0.12.1" }
ferrum-server = { path = "crates/ferrum-server", version = "0.12.1" }
ferrum-cli = { path = "crates/ferrum-cli", version = "0.12.1" }
ferrum-testkit = { path = "crates/ferrum-testkit", version = "0.12.1" }
ferrum-bench-core = { path = "crates/ferrum-bench-core", version = "0.12.1" }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Windows CUDA staging builds dependency libraries within its memory budget,
# then uses parallel ThinLTO for the final executable.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

# Hashing and compressing release assets must not run in an unoptimized build.
# These internal tools do not need whole-program LTO.
[profile.release-tools]
inherits = "release"
lto = false
codegen-units = 16

[profile.cuda-correctness]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.bench]
inherits = "release"
