name: Resume verified release publication

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed Deliver formal release run whose candidate and frozen evidence will be reused"
        required: true
        type: string
      manual_sm120_evidence_asset_id:
        description: "Optional same-repository release asset containing original manually executed SM120 evidence; requires its SHA-256"
        required: false
        default: ''
        type: string
      manual_sm120_evidence_sha256:
        description: "SHA-256 of the manual SM120 evidence tar.gz; does not replace any model, device or package validation"
        required: false
        default: ''
        type: string
      preupload_asset:
        description: "Optional diagnostic: upload exactly one accepted missing draft asset using gh api before normal publication"
        required: false
        default: ''
        type: string
      preupload_timeout_minutes:
        description: "Deadline for the optional single-asset upload, in whole minutes (1-60)"
        required: false
        default: 10
        type: number

permissions:
  contents: read
  actions: read

concurrency:
  group: formal-release-delivery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  publish:
    if: github.repository == 'sizzlecar/ferrum-infer-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Validate optional manual SM120 evidence inputs
        env:
          MANUAL_SM120_ASSET_ID: ${{ inputs.manual_sm120_evidence_asset_id }}
          MANUAL_SM120_SHA256: ${{ inputs.manual_sm120_evidence_sha256 }}
        run: |
          if [ -n "$MANUAL_SM120_ASSET_ID" ] || [ -n "$MANUAL_SM120_SHA256" ]; then
            [[ "$MANUAL_SM120_ASSET_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$MANUAL_SM120_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
      - uses: actions/checkout@v4
        with:
          path: tools
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the original candidate and unique source artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e --argjson id "$SOURCE_RUN" --argjson repo "$GITHUB_REPOSITORY_ID" '
            .id == $id and .repository.id == $repo and .head_repository.id == $repo and
            .head_branch == "main" and .status == "completed" and .run_attempt > 0 and
            (.event == "push" or .event == "workflow_dispatch") and
            (.path | split("@")[0]) == ".github/workflows/release-delivery.yml" and
            (.head_sha | test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/source-run.json"
          candidate=$(jq -er .head_sha "$RUNNER_TEMP/source-run.json")
          git -C tools merge-base --is-ancestor "$candidate" HEAD
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/source-artifact-pages.json"
          jq -e --argjson run "$SOURCE_RUN" --arg candidate "$candidate" '
            [.[].artifacts[] | select(.expired == false)] |
            if all(.workflow_run.id == $run and .workflow_run.head_sha == $candidate)
            then . else error("source artifact provenance differs from candidate") end' \
            "$RUNNER_TEMP/source-artifact-pages.json" > "$RUNNER_TEMP/source-artifacts.json"
          artifact_id() {
            jq -er --arg name "$1" '[.[] | select(.name == $name)] |
              if length == 1 then .[0].id
              elif $name == "publication-state" and length == 0 then ""
              else error("missing or ambiguous named source artifact: " + $name) end' \
              "$RUNNER_TEMP/source-artifacts.json"
          }
          for name in release-plan release-tasks contract-checks installation-linux installation-macos-cpu publication-state; do
            id=$(artifact_id "$name")
            printf '%s=%s\n' "${name//-/_}" "$id" >> "$GITHUB_OUTPUT"
          done
          jq -e --arg run "$SOURCE_RUN" --arg candidate "$candidate" '
            [.[] | select(.name | test("^ferrum-(linux|macos|windows)-.*-run-" + $run + "-[1-9][0-9]*-" + $candidate + "$"))] |
            group_by(.name | sub("-run-[0-9]+-[0-9]+-[0-9a-f]+$"; "")) |
            if length > 0 and all(length == 1) then flatten
            else error("missing or ambiguous staged distributions; do not guess an execution attempt") end' \
            "$RUNNER_TEMP/source-artifacts.json" > "$RUNNER_TEMP/staged-artifacts.json"
          unix_ids=$(jq -er '[.[] | select(.name | test("^ferrum-(linux|macos)-")) | .id | tostring] |
            if length > 0 then join(",") else error("missing Unix distributions") end' "$RUNNER_TEMP/staged-artifacts.json")
          for backend in cpu cuda; do
            id=$(jq -er --arg prefix "ferrum-windows-x86_64-$backend-run-" '[.[] | select(.name | startswith($prefix))] |
              if length == 1 then .[0].id else error("missing or ambiguous Windows distribution") end' "$RUNNER_TEMP/staged-artifacts.json")
            printf 'windows_%s=%s\n' "$backend" "$id" >> "$GITHUB_OUTPUT"
          done
          evidence_ids=$(jq -er '[.[] | select(.name | test("^release-.*-evidence$"))] | group_by(.name) |
            if length > 0 and all(length == 1) then flatten | map(.id | tostring) | join(",")
            else error("missing or ambiguous release evidence") end' "$RUNNER_TEMP/source-artifacts.json")
          printf 'candidate=%s\nunix_ids=%s\nevidence_ids=%s\n' "$candidate" "$unix_ids" "$evidence_ids" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.candidate }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Read SM120 requirement from the checked-out resume candidate
        id: cuda-capability
        run: |
          # Parse the original candidate's declaration, not the current tools
          # checkout or whichever public/staged assets happen to be present.
          ruby -rpsych - "$GITHUB_WORKSPACE/candidate/.github/workflows/release-cuda.yml" resume >> "$GITHUB_OUTPUT" <<'RUBY_YAML'
          def mapping(node, location)
            raise "#{location} must be a YAML mapping" unless node.is_a?(Psych::Nodes::Mapping)
            node.children.each_slice(2).each_with_object({}) do |(key, value), entries|
              raise "#{location} needs scalar keys" unless key.is_a?(Psych::Nodes::Scalar)
              raise "#{location} has duplicate #{key.value}" if entries.key?(key.value)
              entries[key.value] = value
            end
          end
          def scalar(entry, name)
            value = mapping(entry, name)['value']
            raise "#{name} needs a nonempty string value" unless value.is_a?(Psych::Nodes::Scalar) && !value.value.strip.empty?
            if value.tag && value.tag != 'tag:yaml.org,2002:str'
              raise "#{name} needs a string value"
            end
            if value.plain && !value.tag
              scanner = Psych::ScalarScanner.new(Psych::ClassLoader::Restricted.new([], []))
              raise "#{name} needs a string value" unless scanner.tokenize(value.value).is_a?(String)
            end
            value.value
          end
          path, mode = ARGV
          outputs = {}
          if File.exist?(path)
            workflow = mapping(Psych.parse_file(path)&.root, 'workflow')
            triggers = mapping(workflow.fetch('on'), 'on')
            call = triggers['workflow_call']
            declared = call && mapping(call, 'workflow_call')['outputs']
            outputs = mapping(declared, 'outputs') if declared
          end
          asset = outputs['cuda_sm120_asset_id']
          scalar(asset, 'cuda_sm120_asset_id') if asset
          policy_entry = outputs['cuda_sm120_runtime_policy']
          reason_entry = outputs['cuda_sm120_runtime_reason']
          raise 'SM120 runtime policy requires an SM120 asset declaration' if !asset && (policy_entry || reason_entry)
          policy = policy_entry ? scalar(policy_entry, 'cuda_sm120_runtime_policy') : 'required'
          reason = ''
          case policy
          when 'required'
            raise 'Required SM120 validation must not declare an unavailable reason' if reason_entry
          when 'not_run_hardware_unavailable'
            raise 'Unavailable SM120 hardware needs a reason' unless reason_entry
            reason = scalar(reason_entry, 'cuda_sm120_runtime_reason')
            raise 'SM120 reason must be a literal, trimmed single line' if reason.match?(/\A[[:space:]]|[[:space:]]\z/u) || reason.include?('$' + '{{') || reason.match?(/[\x00-\x1f\x7f]/)
          else
            raise 'Unknown or nonliteral SM120 runtime policy'
          end
          runtime_required = !!asset && policy == 'required'
          if mode == 'delivery'
            raise 'This candidate requires real SM120 validation, but no approved SM120 runner is available; historical evidence is not a new verification run' if runtime_required
            raise 'Active release must declare its SM120 asset' if ENV.fetch('VERIFY_PUBLISHED_VERSION', '').empty? && !asset
          end
          puts "sm120_required=#{!!asset}"
          puts "sm120_runtime_required=#{runtime_required}"
          puts "sm120_runtime_policy=#{policy}"
          puts "sm120_runtime_reason=#{reason}"
          RUBY_YAML
      - name: Download and verify original manual SM120 evidence
        if: inputs.manual_sm120_evidence_asset_id != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          MANUAL_SM120_ASSET_ID: ${{ inputs.manual_sm120_evidence_asset_id }}
          MANUAL_SM120_SHA256: ${{ inputs.manual_sm120_evidence_sha256 }}
          SM120_RUNTIME_REQUIRED: ${{ steps.cuda-capability.outputs.sm120_runtime_required }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          SOURCE_CANDIDATE: ${{ steps.source.outputs.candidate }}
        run: |
          test "$SM120_RUNTIME_REQUIRED" = true
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$MANUAL_SM120_ASSET_ID" > "$RUNNER_TEMP/manual-sm120-asset.json"
          jq -e --argjson id "$MANUAL_SM120_ASSET_ID" --arg repo "$GITHUB_REPOSITORY" --arg sha "$MANUAL_SM120_SHA256" '
            .id == $id and .state == "uploaded" and .size > 0 and
            .url == ("https://api.github.com/repos/" + $repo + "/releases/assets/" + ($id | tostring)) and
            (.digest == null or .digest == ("sha256:" + $sha))' "$RUNNER_TEMP/manual-sm120-asset.json"
          gh api --header 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$MANUAL_SM120_ASSET_ID" > "$RUNNER_TEMP/manual-sm120-evidence.tar.gz"
          ruby -rdigest -rzlib -rrubygems/package -rfileutils - \
            "$RUNNER_TEMP/manual-sm120-evidence.tar.gz" "$RUNNER_TEMP/manual-sm120-evidence" "$MANUAL_SM120_SHA256" <<'RUBY_EVIDENCE'
          archive, destination, expected = ARGV
          raise 'manual evidence SHA-256 mismatch' unless Digest::SHA256.file(archive).hexdigest == expected
          raise 'manual evidence destination already exists' if File.exist?(destination)
          Dir.mkdir(destination)
          seen = {}
          Zlib::GzipReader.open(archive) do |gzip|
            Gem::Package::TarReader.new(gzip) do |tar|
              tar.each do |entry|
                name = entry.full_name
                parts = name.split('/')
                raise 'unsafe manual evidence member' if name.empty? || name.start_with?('/') || name.include?('\\') || name.match?(/[\x00-\x1f\x7f]/) || parts.any? { |part| part.empty? || part == '.' || part == '..' }
                raise 'unsupported manual evidence root' unless %w[tasks model-cuda-sm120 installation-cuda-sm120.json sm120-staged-origin.json].include?(parts.first)
                raise 'manual evidence permits only regular files and directories' unless entry.file? || entry.directory?
                raise 'duplicate manual evidence member' if seen[parts.join('/')]
                seen[parts.join('/')] = true
                target = File.join(destination, *parts)
                if entry.directory?
                  FileUtils.mkdir_p(target)
                else
                  FileUtils.mkdir_p(File.dirname(target))
                  File.open(target, File::WRONLY | File::CREAT | File::EXCL, 0600) do |output|
                    while (chunk = entry.read(65536)) && !chunk.empty?
                      output.write(chunk)
                    end
                  end
                end
              end
            end
          end
          %w[tasks/tasks.json installation-cuda-sm120.json].each do |name|
            raise "missing manual evidence #{name}" unless File.file?(File.join(destination, name))
          end
          raise 'missing original manual model reports' if Dir.glob(File.join(destination, 'model-cuda-sm120/**/report.json')).empty?
          RUBY_EVIDENCE
          jq -n --arg run "$SOURCE_RUN" --arg candidate "$SOURCE_CANDIDATE" --arg sha "$MANUAL_SM120_SHA256" \
            --slurpfile asset "$RUNNER_TEMP/manual-sm120-asset.json" \
            '{source_run_id:$run,candidate_sha:$candidate,archive_sha256:$sha,asset:$asset[0],evidence_source:"manual",scope:"transport identity only; required model, device and package checks remain in release_delivery"}' \
            > "$RUNNER_TEMP/manual-sm120-transport.json"
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> target
          shared-key: release-delivery-controller-rust-1.91
      - name: Build the reviewed publication controller only
        run: cargo build --locked --manifest-path tools/Cargo.toml -p ferrum-devtools --bin release_delivery
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.unix_ids }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.windows_cuda }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-windows
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.windows_cpu }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-windows/cpu
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.evidence_ids }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.release_plan }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.release_tasks }}
          merge-multiple: true
          path: ${{ runner.temp }}/tasks
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.contract_checks }}
          merge-multiple: true
          path: ${{ runner.temp }}/contracts
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.installation_linux }},${{ steps.source.outputs.installation_macos_cpu }}
          merge-multiple: true
          path: ${{ runner.temp }}/installation
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.publication_state != ''
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          artifact-ids: ${{ steps.source.outputs.publication_state }}
          merge-multiple: true
          path: ${{ runner.temp }}/publication
      - name: Recheck the original candidate and resume its publication
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          GH_DEBUG: ''
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          PREUPLOAD_ASSET: ${{ inputs.preupload_asset }}
          PREUPLOAD_TIMEOUT_MINUTES: ${{ inputs.preupload_timeout_minutes }}
          SM120_RUNTIME_REQUIRED: ${{ steps.cuda-capability.outputs.sm120_runtime_required }}
          MANUAL_SM120_ASSET_ID: ${{ inputs.manual_sm120_evidence_asset_id }}
        run: |
          version=$(cargo metadata --manifest-path candidate/Cargo.toml --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ferrum-cli") | .version')
          gate_args=(--plan "$RUNNER_TEMP/plan/release-plan.json" --tasks "$RUNNER_TEMP/tasks/tasks.json"
            --contracts "$RUNNER_TEMP/contracts/contract-checks.json" --version "$version"
            --workspace "$GITHUB_WORKSPACE/candidate" --notes "$RUNNER_TEMP/plan/release-notes.md"
            --windows-staged "$RUNNER_TEMP/staged-windows" --repo "$GITHUB_REPOSITORY" --ci-run-id "$SOURCE_RUN")
          for abi in "$RUNNER_TEMP/staged/"*.abi.json; do gate_args+=(--abi "$abi"); done
          for install in "$RUNNER_TEMP/installation/"*.json; do
            if [ "$install" != "$RUNNER_TEMP/installation/cuda.json" ]; then gate_args+=(--installation "$install"); fi
          done
          gate_args+=(--installation "$RUNNER_TEMP/evidence/release-cuda-evidence/installation-cuda.json"
            --installation "$RUNNER_TEMP/evidence/release-metal-evidence/installation-metal.json")
          sm120_evidence="$RUNNER_TEMP/evidence/release-cuda-sm120-evidence"
          if [ -n "$MANUAL_SM120_ASSET_ID" ]; then
            test "$SM120_RUNTIME_REQUIRED" = true
            sm120_evidence="$RUNNER_TEMP/manual-sm120-evidence"
            gate_args+=(--sm120-runtime-source manual)
          fi
          case "$SM120_RUNTIME_REQUIRED" in
            true)
              gate_args+=(--tasks "$sm120_evidence/tasks/tasks.json"
                --installation "$sm120_evidence/installation-cuda-sm120.json")
              ;;
            false) ;;
            *) echo 'Missing candidate SM120 runtime policy result' >&2; exit 1 ;;
          esac
          if [ -n "$MANUAL_SM120_ASSET_ID" ]; then
            while IFS= read -r -d '' report; do gate_args+=(--report "$report"); done \
              < <(find "$RUNNER_TEMP/evidence" -path "$RUNNER_TEMP/evidence/release-cuda-sm120-evidence" -prune -o -name report.json -type f -print0)
            while IFS= read -r -d '' report; do gate_args+=(--report "$report"); done \
              < <(find "$sm120_evidence/model-cuda-sm120" -name report.json -type f -print0)
          else
            while IFS= read -r -d '' report; do gate_args+=(--report "$report"); done \
              < <(find "$RUNNER_TEMP/evidence" -name report.json -type f -print0)
          fi
          if [ -n "$PREUPLOAD_ASSET" ]; then
            [[ "$PREUPLOAD_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            [[ "$PREUPLOAD_TIMEOUT_MINUTES" =~ ^([1-9]|[1-5][0-9]|60)$ ]]
            "$GITHUB_WORKSPACE/tools/target/debug/release_delivery" gate "${gate_args[@]}" \
              --output "$RUNNER_TEMP/accepted-preupload.json"
            jq -e --arg name "$PREUPLOAD_ASSET" '[.assets[] | select(.name == $name)] |
              if length == 1 then .[0] else error("preupload asset must match exactly one accepted file") end' \
              "$RUNNER_TEMP/accepted-preupload.json" > "$RUNNER_TEMP/preupload-asset.json"
            asset_path=$(jq -er .path "$RUNNER_TEMP/preupload-asset.json")
            asset_sha=$(jq -er .sha256 "$RUNNER_TEMP/preupload-asset.json")
            [[ "$asset_sha" =~ ^[0-9a-f]{64}$ ]]
            asset_path=$(realpath -e -- "$asset_path")
            unix_stage=$(realpath -e -- "$RUNNER_TEMP/staged")
            windows_stage=$(realpath -e -- "$RUNNER_TEMP/staged-windows")
            [[ "${asset_path##*/}" == "$PREUPLOAD_ASSET" ]]
            [[ "$asset_path" == "$unix_stage/"* || "$asset_path" == "$windows_stage/"* ]]
            printf '%s  %s\n' "$asset_sha" "$asset_path" | sha256sum --check --status
            asset_size=$(stat --format='%s' -- "$asset_path")
            tag="v$version"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/preupload-releases.json"
            jq -e --arg tag "$tag" --slurpfile accepted "$RUNNER_TEMP/accepted-preupload.json" '
              add | if (map(.id) | unique | length) != length then error("release list repeats an ID") else . end |
              [.[] | select(.tag_name == $tag)] |
              if length != 1 then error("preupload requires a unique existing release") else .[0] end |
              select(.draft == true and .prerelease == false and .published_at == null and
                .target_commitish == $accepted[0].candidate_sha and .body == $accepted[0].notes and
                (.id | type == "number" and . > 0 and . == floor))' \
              "$RUNNER_TEMP/preupload-releases.json" > "$RUNNER_TEMP/preupload-draft.json"
            release_id=$(jq -er .id "$RUNNER_TEMP/preupload-draft.json")
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/preupload-tag.json"
            jq -e --slurpfile accepted "$RUNNER_TEMP/accepted-preupload.json" '
              .object.type == "commit" and .object.sha == $accepted[0].candidate_sha' \
              "$RUNNER_TEMP/preupload-tag.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/preupload-inventory.json"
            jq -e --arg name "$PREUPLOAD_ASSET" --slurpfile accepted "$RUNNER_TEMP/accepted-preupload.json" '
              add as $assets |
              ($assets | map(.id) | unique | length) == ($assets | length) and
              ($assets | map(.name) | unique | length) == ($assets | length) and
              all($assets[]; .name != $name) and
              all($assets[]; . as $remote |
                [$accepted[0].assets[] | select(.name == $remote.name)] as $matches |
                ($matches | length) == 1 and $remote.state == "uploaded" and
                ($remote.id | type == "number" and . > 0 and . == floor) and
                ($remote.size | type == "number" and . >= 0 and . == floor) and
                $remote.digest == ("sha256:" + $matches[0].sha256))' \
              "$RUNNER_TEMP/preupload-inventory.json"
            # Refresh the original draft after inventory reads. This diagnostic
            # never creates a release, replaces an asset, or removes a starter.
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/preupload-draft-fresh.json"
            jq -e --arg tag "$tag" --argjson id "$release_id" --slurpfile accepted "$RUNNER_TEMP/accepted-preupload.json" '
              .id == $id and .tag_name == $tag and .draft == true and .prerelease == false and
              .published_at == null and .target_commitish == $accepted[0].candidate_sha and .body == $accepted[0].notes' \
              "$RUNNER_TEMP/preupload-draft-fresh.json"
            gh --version
            printf 'Preupload one accepted asset: name=%s size=%s sha256=%s source_run=%s release_id=%s timeout_minutes=%s\n' \
              "$PREUPLOAD_ASSET" "$asset_size" "$asset_sha" "$SOURCE_RUN" "$release_id" "$PREUPLOAD_TIMEOUT_MINUTES"
            if timeout --signal=TERM --kill-after=15s "${PREUPLOAD_TIMEOUT_MINUTES}m" gh api --hostname github.com --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --input "$asset_path" --raw-field "name=$PREUPLOAD_ASSET" \
              --header 'Content-Type: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' \
              --jq '{id,name,size,state,digest}' > "$RUNNER_TEMP/preupload-response.json" 2>/dev/null; then
              jq -e --arg name "$PREUPLOAD_ASSET" --arg sha "$asset_sha" --argjson size "$asset_size" '
                .name == $name and .state == "uploaded" and .size == $size and .digest == ("sha256:" + $sha) and
                (.id | type == "number" and . > 0 and . == floor)' "$RUNNER_TEMP/preupload-response.json"
              uploaded_id=$(jq -er .id "$RUNNER_TEMP/preupload-response.json")
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$uploaded_id" \
                --jq '{id,name,size,state,digest}' > "$RUNNER_TEMP/preupload-readback.json"
              jq -e --slurpfile expected "$RUNNER_TEMP/preupload-response.json" \
                '. == $expected[0]' "$RUNNER_TEMP/preupload-readback.json"
            else
              status=$?
              printf 'Preupload failed with exit status %s; inspect remote state before another attempt.\n' "$status" >&2
              exit "$status"
            fi
          fi
          "$GITHUB_WORKSPACE/tools/target/debug/release_delivery" publish "${gate_args[@]}" \
            --state-dir "$RUNNER_TEMP/publication" --tap-repo sizzlecar/homebrew-ferrum
          if [ -n "$MANUAL_SM120_ASSET_ID" ]; then
            printf 'Candidate publication resumed from run %s with original manually executed SM120 evidence. Public installation/startup verification remains pending; retain manual SM120 results and verify the remaining approved-fleet channels.\n' "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Candidate publication resumed from run %s. Public installations remain pending; run Deliver formal release with verify_published_version=%s.\n' \
              "$SOURCE_RUN" "$version" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.manual_sm120_evidence_asset_id != ''
        with:
          name: manual-sm120-publication-input
          path: |
            ${{ runner.temp }}/manual-sm120-evidence.tar.gz
            ${{ runner.temp }}/manual-sm120-asset.json
            ${{ runner.temp }}/manual-sm120-transport.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && inputs.preupload_asset != ''
        with:
          name: preupload-diagnostic
          path: ${{ runner.temp }}/preupload-*.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-state
          path: ${{ runner.temp }}/publication/
          if-no-files-found: warn
          retention-days: 30
