name: CI

on:
  # main requires PRs and the CI required check on an up-to-date branch.
  # Validate the proposed merge once; do not repeat the same build on push.
  # workflow_dispatch remains available for explicit backend/cache validation.
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release candidate used by every quality job
        type: string
        required: true
  pull_request:
  workflow_dispatch:
    inputs:
      build_ptx:
        description: 'Also compile CUDA kernels to PTX (~40min)'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Treat every rustc warning as an error. Keeps the tree clean — dev
  # opts into warnings locally for iteration and silences them via
  # `#[allow(...)]` on the specific item, never at the CI level.
  RUSTFLAGS: "-D warnings"

jobs:
  prepare:
    name: Plan and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt

      - name: Check CI policy
        run: |
          rustfmt --edition 2021 --check .github/ci/policy.rs
          rustc --edition=2021 --deny warnings --test .github/ci/policy.rs -o "$RUNNER_TEMP/policy-tests"
          "$RUNNER_TEMP/policy-tests"
          rustc --edition=2021 --deny warnings .github/ci/policy.rs -o "$RUNNER_TEMP/policy"

      - name: Classify changes and check diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -n "$RELEASE_CANDIDATE" ]; then
            echo 'scope=code' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = pull_request ]; then
            test -n "$BASE_SHA"
            if ! git cat-file -e "$BASE_SHA^{commit}"; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            git diff --check "$BASE_SHA" HEAD --
            # Keep both paths of renames and preserve NUL separators in a file.
            # A code file renamed into docs must still run code checks.
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- > "$RUNNER_TEMP/changed-paths.z"
            scope=$("$RUNNER_TEMP/policy" classify < "$RUNNER_TEMP/changed-paths.z")
            echo "scope=$scope" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

      - name: Check local documentation links and anchors
        run: |
          mkdir -p "$RUNNER_TEMP/lychee"
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 \
            --output "$RUNNER_TEMP/lychee.tar.gz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a' \
            "$RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee" \
            lychee-x86_64-unknown-linux-gnu/lychee
          "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu/lychee" \
            --offline --include-fragments --no-progress --format json \
            --output "$RUNNER_TEMP/docs-links.json" \
            README.md README_zh.md CHANGELOG.md 'docs/**/*.md'

      - name: Save documentation link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: docs-links
          path: ${{ runner.temp }}/docs-links.json
          retention-days: 7

  # ── CPU (Linux) ──────────────────────────────────────────────────────
  # Core quality gate: format, lint, unit tests, integration tests
  cpu:
    name: CPU (Linux)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      # ubuntu-latest ships with ~30 GB of preinstalled SDKs (.NET, Android,
      # Haskell, etc.) that we don't need. Cargo registry + target dir +
      # Rust toolchain easily blow past the remaining ~14 GB on big builds —
      # observed: jobs dying mid-cache-restore with "No space left on device".
      # Reclaim ~25 GB before any cache step touches the disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential ffmpeg

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy, rust-src

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cpu-nodebug-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cpu-nodebug-v2-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile (workspace, all targets)
        run: cargo check --locked --workspace --all-targets

      - name: Generate regression scope and cost plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            test -n "$BASE_SHA"
            if ! git cat-file -e "$BASE_SHA^{commit}"; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            plan_base="$BASE_SHA"
            plan_stage=pull_request
          else
            # A manual CI run inventories periodic coverage. It is not a
            # release diff; formal release planning requires an explicit base.
            plan_base=HEAD
            plan_stage=nightly
          fi
          cargo run --locked -p ferrum-bench-core --example regression_plan -- \
            --catalog docs/release-regression-catalog.json \
            --base "$plan_base" --candidate HEAD --stage "$plan_stage" \
            --output "$RUNNER_TEMP/regression-plan.json" \
            --summary "$RUNNER_TEMP/regression-plan.md"
          cat "$RUNNER_TEMP/regression-plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Save regression planning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: regression-plan
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/regression-plan.json
            ${{ runner.temp }}/regression-plan.md
          retention-days: 14

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -A warnings

      - name: Workspace tests (all targets)
        run: cargo test --locked --workspace --all-targets

      - name: Execute registered correctness boundaries
        run: |
          # Reuse the just-built workspace feature graph; this does not rebuild
          # each package with a different feature selection.
          cargo test --locked --workspace --all-targets --no-run --message-format=json \
            > "$RUNNER_TEMP/contract-artifacts.jsonl"
          cargo run --locked -p ferrum-devtools --bin contract_checks -- \
            --artifacts "$RUNNER_TEMP/contract-artifacts.jsonl" \
            --output "$RUNNER_TEMP/contract-checks.json"

      - name: Save executed contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: contract-checks
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/contract-checks.json
            ${{ runner.temp }}/contract-checks.logs/
          retention-days: 14

      # --all-targets does not include doctests.
      - name: Documentation tests
        run: cargo test --locked --workspace --doc

      # ── CLI E2E ───────────────────────────────────────
      # Integration tests already build the real CLI with workspace test features.
      # Release staging separately builds and checks the product feature set.
      - name: "Test: CLI help (CPU build)"
        run: |
          # Verify help works
          ./target/debug/ferrum --help
          ./target/debug/ferrum tts --help
          ./target/debug/ferrum transcribe --help
          ./target/debug/ferrum serve --help

  # ── Metal (macOS) ────────────────────────────────────────────────────
  # Verifies Metal shader compilation + Metal-gated code paths
  metal:
    name: Metal (macOS)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-nodebug-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-metal-nodebug-v2-

      - name: Compile with Metal (all targets)
        run: cargo check --locked --workspace --all-targets --features metal

      - name: Workspace tests (all targets, Metal feature)
        run: cargo test --locked --workspace --all-targets --features metal

      - name: Documentation tests (Metal feature)
        run: cargo test --locked --workspace --doc --features metal

      # Reuse the real CLI built for integration tests, as in the CPU job.
      - name: "Test: CLI help (Metal build)"
        run: |
          ./target/debug/ferrum --help
          ./target/debug/ferrum tts --help

  # ── CUDA (Linux + CUDA toolkit) ─────────────────────────────────────
  # Type-checks CUDA code paths. PTX build optional (slow).
  cuda:
    name: CUDA (Linux)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CUDA_HOME: /usr/local/cuda
      CUDA_ROOT: /usr/local/cuda
      CUDA_COMPUTE_CAP: "89"
      # Build-time, content-addressed component. The resulting ferrum binary
      # links these operators statically and performs no runtime download.
      NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst
      NATIVE_OPERATOR_SET_ARCHIVE_SHA256: d4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages \
            ca-certificates curl build-essential pkg-config libssl-dev git \
            python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v6.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - name: Type check release CLI (full CUDA features)
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo check --locked -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Build CUDA kernels (PTX)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_ptx == 'true'
        env:
          CUDA_COMPUTE_CAP: "89"
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --locked -p ferrum-kernels --features cuda

  # Small real-device numerical checks; no model download. Keep the hosted
  # workspace jobs above: this lane proves only the operations invoked below.
  gpu:
    name: GPU runtime (${{ matrix.backend }})
    needs: prepare
    # Personal workers only execute repository-controlled branches. A fork's
    # skip remains a missing required result; run reviewed code from a local
    # repository branch before merging it.
    if: >-
      needs.prepare.outputs.scope == 'code' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: metal
            runner: [self-hosted, macOS, ARM64, ferrum-metal]
          - backend: cuda
            runner: [self-hosted, Linux, X64, ferrum-cuda, cuda-sm89]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.91.0

      - name: Configure CUDA build inputs
        if: matrix.backend == 'cuda'
        timeout-minutes: 15
        env:
          NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst
          NATIVE_OPERATOR_SET_ARCHIVE_SHA256: d4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e
        run: |
          # Persist verified bytes outside checkout and the per-job temp directory.
          cache_root="${RUNNER_TOOL_CACHE:?}/ferrum-native-operator-set"
          mkdir -p "$cache_root"
          archive="$cache_root/$NATIVE_OPERATOR_SET_ARCHIVE_SHA256.tar.zst"
          if [[ -f "$archive" ]] && printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict; then
            echo "Using verified native operator archive cache"
          else
            pending_archive=$(mktemp "$cache_root/.$NATIVE_OPERATOR_SET_ARCHIVE_SHA256.XXXXXX")
            trap 'rm -f -- "$pending_archive"' EXIT
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 600 \
              --connect-timeout 15 --max-time 300 \
              --output "$pending_archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
            printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$pending_archive" \
              | sha256sum --check --strict
            # Only a complete, verified download becomes a reusable cache entry.
            mv -- "$pending_archive" "$archive"
            trap - EXIT
          fi
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"
          echo "CUDA_HOME=/usr/local/cuda" >> "$GITHUB_ENV"
          echo "CUDA_ROOT=/usr/local/cuda" >> "$GITHUB_ENV"
          echo "CUDA_COMPUTE_CAP=89" >> "$GITHUB_ENV"
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version --format=csv
          /usr/local/cuda/bin/nvcc --version

      - name: Build required-backend numerical checker
        env:
          BACKEND: ${{ matrix.backend }}
        run: cargo build --locked -p ferrum-testkit --example backend_numerics --features "$BACKEND"

      - name: Require real GPU outputs for aligned and tail dimensions
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p "$RUNNER_TEMP/backend-numerics"
          ./target/debug/examples/backend_numerics --require-backend "$BACKEND" \
            --op rms-norm --tokens 4 --dim 128 --seed 42 \
            --report "$RUNNER_TEMP/backend-numerics/aligned.json"
          ./target/debug/examples/backend_numerics --require-backend "$BACKEND" \
            --op rms-norm --tokens 3 --dim 33 --seed 7 \
            --report "$RUNNER_TEMP/backend-numerics/tail.json"
          ./target/debug/examples/backend_numerics --require-backend "$BACKEND" \
            --op gemm --m 64 --n 32 --k 32 --seed 42 \
            --report "$RUNNER_TEMP/backend-numerics/gemm-aligned.json"
          ./target/debug/examples/backend_numerics --require-backend "$BACKEND" \
            --op gemm --m 64 --n 33 --k 35 --seed 7 \
            --report "$RUNNER_TEMP/backend-numerics/gemm-tail.json"
          ./target/debug/examples/backend_numerics --require-backend "$BACKEND" \
            --op silu-mul --tokens 4 --intermediate 256 --seed 42 \
            --report "$RUNNER_TEMP/backend-numerics/silu-aligned.json"
          ./target/debug/examples/backend_numerics --require-backend "$BACKEND" \
            --op silu-mul --tokens 3 --intermediate 257 --seed 7 \
            --report "$RUNNER_TEMP/backend-numerics/silu-tail.json"

      - name: Require MetalContext submission and completion outputs
        if: matrix.backend == 'metal'
        run: |
          ./target/debug/examples/backend_numerics --require-backend metal \
            --op metal-context --tokens 3 --intermediate 33 --k 35 --seed 7 \
            --report "$RUNNER_TEMP/backend-numerics/submission.json"

      - name: Record numerical evidence producer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ matrix.backend }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")
          job_id=$(jq -er --arg suffix "GPU runtime ($BACKEND)" \
            '[.jobs[] | select(.name | endswith($suffix)) | select(.status == "in_progress")] | if length == 1 then .[0].id else error("ambiguous producer job") end' <<< "$jobs")
          mkdir -p "$RUNNER_TEMP/backend-numerics"
          jq -n --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_sha "$GITHUB_SHA" --argjson job_id "$job_id" \
            '{schema_version:1,run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,job_id:$job_id}' \
            > "$RUNNER_TEMP/backend-numerics/ci-origin.json"

      - name: Save raw numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: backend-numerics-${{ matrix.backend }}
          if-no-files-found: error
          path: ${{ runner.temp }}/backend-numerics/*.json
          retention-days: 14

  windows:
    name: Windows (MSVC and CUDA compile)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CUDA_COMPUTE_CAP: '89'
      CUDA_WINDOWS_VERSION: '12.4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Select a supported MSVC toolset and Windows SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio installation was not found' }
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -Like '14.38.*'
          if (-not $tools) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', ('"{0}"' -f $vs),
              '--add', 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64',
              '--quiet', '--norestart')
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSVC installation failed: $($process.ExitCode)" }
          }
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -Like '14.38.*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $tools) { throw 'CUDA 12.4 requires the selected MSVC 19.38 compiler' }
          $vcvars = "$vs\VC\Auxiliary\Build\vcvarsall.bat"
          $selected = & cmd.exe /d /s /c "call `"$vcvars`" amd64 10.0.22621.0 -vcvars_ver=14.38 >nul && set"
          foreach ($line in $selected) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSdkVerBinPath|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $compilerBin = Join-Path $tools.FullName 'bin\Hostx64\x64'
          "CC=$compilerBin\cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=$compilerBin\cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NVCC_CCBIN=$compilerBin\cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FERRUM_MSVC_LIB=$compilerBin\lib.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$compilerBin\link.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FERRUM_VS_ROOT=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install CUDA compilation and runtime components
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Join-Path $env:RUNNER_TEMP 'cuda_12.4.1_windows.exe'
          curl.exe --fail --location --retry 3 --output $installer 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'NVIDIA') {
            throw 'CUDA installer does not have a valid NVIDIA signature'
          }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          $process = Start-Process $installer -Wait -PassThru -ArgumentList @(
            '-s', '-n', 'nvcc_12.4', 'cudart_12.4', 'cublas_12.4', 'cublas_dev_12.4',
            'nvrtc_12.4', 'nvrtc_dev_12.4', 'cuobjdump_12.4')
          if ($process.ExitCode -notin @(0, 3010)) { throw "CUDA installation failed: $($process.ExitCode)" }
          Remove-Item $installer
          $toolkit = "$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          & "$toolkit\bin\nvcc.exe" --version
          "CUDA_PATH=$toolkit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CUDA_HOME=$toolkit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$toolkit\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache/restore@v4
        id: windows_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/ferrum-native-object-cache
          key: windows-msvc1938-cuda1241-${{ hashFiles('Cargo.lock', 'crates/ferrum-native-ops-builder/**', 'crates/ferrum-native-ops/**', 'native-operators/cuda/**') }}
          restore-keys: |
            windows-msvc1938-cuda1241-
      - name: Verify selected Windows tool version probes
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p ferrum-native-ops-builder --lib source_build::platform::msvc::tests::configured_ -- --ignored --nocapture
      - name: Check and test the native Windows workspace
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo build --locked -p ferrum-native-ops-builder -p ferrum-devtools --bin ferrum-native-ops-builder --bin model_regression
      - name: Build the four native CUDA operators with MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'ferrum-windows-native'
          $source = Join-Path $work 'source'
          $reference = Join-Path $work 'reference'
          $set = Join-Path $work 'operator-set'
          New-Item -ItemType Directory -Force $source, $reference, $set | Out-Null
          $distribution = Get-Content 'native-operators/cuda/source-bundles/ferrum-native-cuda-v1.json' -Raw | ConvertFrom-Json
          $sourceArchive = Join-Path $work $distribution.archive.file_name
          $sourceUrl = 'https://github.com/{0}/releases/download/{1}/{2}' -f $distribution.distribution.repository, $distribution.distribution.tag, $distribution.distribution.asset_name
          curl.exe --fail --location --retry 3 --output $sourceArchive $sourceUrl
          if ((Get-FileHash $sourceArchive -Algorithm SHA256).Hash -ne $distribution.archive.sha256) { throw 'Native source archive hash mismatch' }
          tar.exe -xf $sourceArchive -C $source
          # Preserve this historical provider catalog as versioned binding provenance.
          # Windows packages separately pin their actual source plan and MSVC tools;
          # runtime compatibility checks the live provider contracts. No Linux code is linked.
          $referenceArchive = Join-Path $work 'reference.tar.zst'
          curl.exe --fail --location --retry 3 --output $referenceArchive 'https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst'
          if ((Get-FileHash $referenceArchive -Algorithm SHA256).Hash -ne 'd4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e') { throw 'Reference archive hash mismatch' }
          tar.exe -xf $referenceArchive -C $reference
          $referenceLockPath = Join-Path $reference 'inputs/native-operator-set.lock.json'
          $referenceLock = Get-Content $referenceLockPath -Raw | ConvertFrom-Json
          $catalog = Join-Path (Split-Path $referenceLockPath) $referenceLock.artifacts[0].g03_catalog.path
          if ((Get-FileHash $catalog -Algorithm SHA256).Hash -ne $referenceLock.g03_catalog_sha256) { throw 'Canonical provider catalog hash mismatch' }
          $builder = Join-Path $env:GITHUB_WORKSPACE 'target/debug/ferrum-native-ops-builder.exe'
          $builderSha = git rev-parse HEAD
          $receiptArgs = @()
          foreach ($operator in @('marlin', 'vllm-marlin', 'vllm-moe-marlin', 'vllm-paged-attention-v2')) {
            $build = Join-Path $work "build/$operator"
            $package = Join-Path $set "packages/$operator"
            $plan = Join-Path $work "$operator.plan.json"
            $spec = Join-Path $work "$operator.package.json"
            & $builder lock-source --definition "native-operators/cuda/source-definitions/$operator.json" --source-root $source --out $plan
            & $builder source-build --plan $plan --source-root $source --out $build --compute-capability sm_89 --builder-sha $builderSha --nvcc "$env:CUDA_PATH/bin/nvcc.exe" --cuda-toolkit-root $env:CUDA_PATH --ccbin $env:NVCC_CCBIN --ar $env:FERRUM_MSVC_LIB --nvcc-threads 4 --object-cache "$env:USERPROFILE/ferrum-native-object-cache"
            & $builder materialize-package-spec --definition "native-operators/cuda/package-definitions/$operator.json" --g03-catalog $catalog --out $spec
            & $builder package --spec $spec --source-root $source --license-root $env:GITHUB_WORKSPACE --source-build-receipt "$build/source-build.receipt.json" --source-build-plan $plan --g03-catalog $catalog --abi-contract 'native-operators/abi/ferrum-native-abi-v2.json' --cc $env:CC --ar $env:FERRUM_MSVC_LIB --out $package
            $receipt = Join-Path $package 'package.receipt.json'
            $receiptArgs += @('--receipt', $receipt, '--receipt-sha256', (Get-FileHash $receipt -Algorithm SHA256).Hash.ToLowerInvariant())
          }
          $lock = Join-Path $set 'native-operator-set.lock.json'
          & $builder assemble-set @receiptArgs --g03-catalog-sha256 $referenceLock.g03_catalog_sha256 --compute-capability sm_89 --out $lock
          "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile and link the full Windows CUDA CLI
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo check --locked -p ferrum-cli --bin ferrum --features cuda,vllm-moe-marlin,vllm-paged-attn-v2
          cargo build --locked -p ferrum-cli --bin ferrum --features cuda,vllm-moe-marlin,vllm-paged-attn-v2
          & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-elf 'target/debug/ferrum.exe'
          & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-ptx 'target/debug/ferrum.exe'
      - name: Save Windows build caches
        if: ${{ always() && steps.windows_cache.outputs.cache-primary-key != '' && steps.windows_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/ferrum-native-object-cache
          key: ${{ steps.windows_cache.outputs.cache-primary-key }}
      - name: Preserve native build evidence and candidate executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-msvc-sm89
          path: |
            ${{ runner.temp }}/ferrum-windows-native/build
            ${{ runner.temp }}/ferrum-windows-native/operator-set
            target/debug/ferrum.exe
            target/debug/model_regression.exe
          if-no-files-found: warn
          retention-days: 7

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, cpu, metal, cuda, gpu, windows]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Require successful checks for the selected scope
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHANGE_SCOPE: ${{ needs.prepare.outputs.scope }}
          CPU_RESULT: ${{ needs.cpu.result }}
          METAL_RESULT: ${{ needs.metal.result }}
          CUDA_RESULT: ${{ needs.cuda.result }}
          GPU_RESULT: ${{ needs.gpu.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          rustc --edition=2021 --deny warnings .github/ci/policy.rs -o "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy" aggregate "$PREPARE_RESULT" "$CHANGE_SCOPE" \
            "$CPU_RESULT" "$METAL_RESULT" "$CUDA_RESULT" "$GPU_RESULT" "$WINDOWS_RESULT"
