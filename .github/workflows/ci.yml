name: CI

on:
  # Only run on direct pushes to main (release commits, hotfixes).
  # PR branches already get covered by the pull_request trigger — running
  # both here doubles CI minutes for every PR commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ptx:
        description: 'Also compile CUDA kernels to PTX (~40min)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Treat every rustc warning as an error. Keeps the tree clean — dev
  # opts into warnings locally for iteration and silences them via
  # `#[allow(...)]` on the specific item, never at the CI level.
  RUSTFLAGS: "-D warnings"

jobs:
  # ── CPU (Linux) ──────────────────────────────────────────────────────
  # Core quality gate: format, lint, unit tests, integration tests
  cpu:
    name: CPU (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships with ~30 GB of preinstalled SDKs (.NET, Android,
      # Haskell, etc.) that we don't need. Cargo registry + target dir +
      # Rust toolchain easily blow past the remaining ~14 GB on big builds —
      # observed: jobs dying mid-cache-restore with "No space left on device".
      # Reclaim ~25 GB before any cache step touches the disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential ffmpeg

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy, rust-src

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cpu-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -A warnings
        continue-on-error: true

      # ── Unit Tests ────────────────────────────────────
      - name: Unit tests (all crates)
        run: cargo test --workspace

      # ── CLI E2E ───────────────────────────────────────
      - name: "Test: CLI build + smoke test"
        run: |
          cargo build -p ferrum-cli --bin ferrum
          # Verify help works
          ./target/debug/ferrum --help
          ./target/debug/ferrum tts --help
          ./target/debug/ferrum transcribe --help
          ./target/debug/ferrum serve --help

  # ── Metal (macOS) ────────────────────────────────────────────────────
  # Verifies Metal shader compilation + Metal-gated code paths
  metal:
    name: Metal (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-metal-

      - name: Compile with Metal (all targets)
        run: cargo check --workspace --all-targets --features metal

      - name: Build CLI (Metal, release)
        run: cargo build --release -p ferrum-cli --features metal

      - name: Unit tests (with Metal feature)
        run: cargo test --workspace --features metal

      - name: "Test: CLI help (Metal build)"
        run: |
          ./target/release/ferrum --help
          ./target/release/ferrum tts --help

  # ── CUDA (Linux + CUDA toolkit) ─────────────────────────────────────
  # Type-checks CUDA code paths. PTX build optional (slow).
  cuda:
    name: CUDA (Linux)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CUDA_HOME: /usr/local/cuda
      CUDA_ROOT: /usr/local/cuda
      CUDA_COMPUTE_CAP: "89"
      # Build-time, content-addressed component. The resulting ferrum binary
      # links these operators statically and performs no runtime download.
      NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst
      NATIVE_OPERATOR_SET_ARCHIVE_SHA256: d4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages \
            ca-certificates curl build-essential pkg-config libssl-dev git \
            python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v6.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - name: Type check release CLI (full CUDA features)
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo check -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Build CUDA kernels (PTX)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_ptx == 'true'
        env:
          CUDA_COMPUTE_CAP: "89"
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build -p ferrum-kernels --features cuda
