name: CI

on:
  # Only run on direct pushes to main (release commits, hotfixes).
  # PR branches already get covered by the pull_request trigger — running
  # both here doubles CI minutes for every PR commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_ptx:
        description: 'Also compile CUDA kernels to PTX (~40min)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── CPU (Linux) ──────────────────────────────────────────────────────
  # Core quality gate: format, lint, unit tests, integration tests
  cpu:
    name: CPU (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships with ~30 GB of preinstalled SDKs (.NET, Android,
      # Haskell, etc.) that we don't need. Cargo registry + target dir +
      # Rust toolchain easily blow past the remaining ~14 GB on big builds —
      # observed: jobs dying mid-cache-restore with "No space left on device".
      # Reclaim ~25 GB before any cache step touches the disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential ffmpeg

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy, rust-src

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cpu-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Runtime env registry check
        run: |
          python3 -m py_compile scripts/check_ferrum_env_registry.py
          python3 scripts/check_ferrum_env_registry.py --self-test
          python3 scripts/check_ferrum_env_registry.py \
            --fail-on-new-missing \
            --fail-on-baseline-drift \
            --max-direct-env-reads 99 \
            --max-process-env-writes 29 \
            --max-non-test-process-env-writes 2 \
            --max-hot-direct-env-reads 5

      - name: CUDA build summary parser check
        run: |
          python3 -m py_compile scripts/validate_cuda_build_summary.py scripts/validate_cuda_build_boundary_manifest.py
          python3 scripts/validate_cuda_build_summary.py --self-test
          python3 scripts/validate_cuda_build_boundary_manifest.py --self-test
          python3 -m py_compile scripts/m3_cuda_build_boundary_probe.py
          python3 scripts/m3_cuda_build_boundary_probe.py --self-test

      - name: Codebase shape check
        run: cargo test -q -p ferrum-types --test codebase_shape_test -- --nocapture

      - name: M3 runner artifact checks
        run: |
          python3 -m py_compile scripts/m3_ab_runner.py scripts/m3_validate_runner_artifact.py scripts/check_m3_runner_wrappers.py scripts/m3_collect_allcell_runner_artifacts.py
          python3 scripts/m3_ab_runner.py --self-test
          python3 scripts/m3_validate_runner_artifact.py --self-test
          python3 scripts/check_m3_runner_wrappers.py --self-test
          python3 scripts/m3_collect_allcell_runner_artifacts.py --self-test
          python3 scripts/check_m3_runner_wrappers.py
          bash -n scripts/m3_fa2_direct_ffi_ab.sh
          bash -n scripts/m3_fa2_source_allcells_ab.sh
          bash -n scripts/m3_fa_layout_varlen_ab.sh
          bash -n scripts/m3_attn_v1_ab.sh
          bash -n scripts/m3_route_unified_profile.sh
          bash -n scripts/m3_graph_runtime_profile.sh
          bash -n scripts/m3_prefill_first_ab.sh
          bash -n scripts/m3_active_prefill_chunk_ab.sh
          bash -n scripts/m3_profile_sink_overhead_ab.sh
          MODEL_DIR="$(mktemp -d)"
          OUT_ROOT="$(mktemp -d)"
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/fa-layout" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_fa_layout_varlen_ab.sh
          if MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/native-op-obsolete-source" BIN=/bin/echo \
            FA2_SOURCE=1 VALIDATE_ONLY=1 bash scripts/m3_fa2_direct_ffi_ab.sh; then
            echo "removed source-linked FA2 path unexpectedly passed" >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 2
          fi
          if MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/native-op-obsolete-allcells" BIN=/bin/echo \
            FA2_SOURCE=1 VALIDATE_ONLY=1 bash scripts/m3_fa2_source_allcells_ab.sh; then
            echo "removed source-linked FA2 all-cells path unexpectedly passed" >&2
            exit 1
          else
            rc=$?
            test "$rc" -eq 2
          fi
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/attn-v1" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_attn_v1_ab.sh
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/prefill-first" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_prefill_first_ab.sh
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/active-prefill" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_active_prefill_chunk_ab.sh
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/route-profile" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_route_unified_profile.sh
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/graph-runtime" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_graph_runtime_profile.sh
          MODEL_DIR="$MODEL_DIR" OUT_ROOT="$OUT_ROOT/profile-sink" BIN=/bin/echo \
            VALIDATE_ONLY=1 bash scripts/m3_profile_sink_overhead_ab.sh

      - name: Compile (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -A warnings
        continue-on-error: true

      # ── Unit Tests ────────────────────────────────────
      - name: Unit tests (all crates)
        run: cargo test --workspace

      # ── CLI E2E ───────────────────────────────────────
      - name: "Test: CLI build + smoke test"
        run: |
          cargo build -p ferrum-cli --bin ferrum
          # Verify help works
          ./target/debug/ferrum --help
          ./target/debug/ferrum tts --help
          ./target/debug/ferrum transcribe --help
          ./target/debug/ferrum serve --help

  # ── Metal (macOS) ────────────────────────────────────────────────────
  # Verifies Metal shader compilation + Metal-gated code paths
  metal:
    name: Metal (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-metal-

      - name: Compile with Metal (all targets)
        run: cargo check --workspace --all-targets --features metal

      - name: Build CLI (Metal, release)
        run: cargo build --release -p ferrum-cli --features metal

      - name: Unit tests (with Metal feature)
        run: cargo test --workspace --features metal

      - name: "Test: CLI help (Metal build)"
        run: |
          ./target/release/ferrum --help
          ./target/release/ferrum tts --help

  # ── CUDA (Linux + CUDA toolkit) ─────────────────────────────────────
  # Type-checks CUDA code paths. PTX build optional (slow).
  cuda:
    name: CUDA (Linux)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CUDA_HOME: /usr/local/cuda
      CUDA_ROOT: /usr/local/cuda
      CUDA_COMPUTE_CAP: "89"
      # Build-time, content-addressed component. The resulting ferrum binary
      # links these operators statically and performs no runtime download.
      NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v1/native-operator-set-cuda12.4-sm89-v1.tar.zst
      NATIVE_OPERATOR_SET_ARCHIVE_SHA256: b450d93182112a57cb96e9a1dd14ec147c7fd549dc4bd3ed9648bfc67e17eb37
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages \
            ca-certificates curl build-essential pkg-config libssl-dev git \
            python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v1.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          PYTHONPATH=scripts/release python3 - "$lock" <<'PY'
          import sys
          from pathlib import Path

          from runtime_vnext_native_operator_set import validate_native_operator_set
          from runtime_vnext_plan_reference import REQUIRED_CUDA_NATIVE_OPERATORS

          validate_native_operator_set(
              Path(sys.argv[1]), REQUIRED_CUDA_NATIVE_OPERATORS
          )
          PY
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - name: Type check (--features cuda)
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo check --workspace --all-targets --features cuda

      - name: Build CUDA kernels (PTX)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_ptx == 'true'
        env:
          CUDA_COMPUTE_CAP: "89"
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build -p ferrum-kernels --features cuda
