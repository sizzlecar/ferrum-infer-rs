name: CI runner network recovery
run-name: Restore Windows and WSL GitHub checkout connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-network:
    runs-on: [self-hosted, Windows, X64, ferrum-windows-native]
    timeout-minutes: 10
    env:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: '*'
    concurrency:
      group: ferrum-panda-hardware
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: 'C:\FerrumActions\tools\powershell-7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -File {0}'
        working-directory: C:\FerrumActions\runner
    steps:
      - name: Report the available shell and SSH listener
        shell: cmd
        run: |
          echo ::notice title=Recovery shell::Windows cmd is running
          "C:\FerrumActions\tools\git-2.55.0.5\bin\git.exe" --version
          "C:\FerrumActions\tools\powershell-7.6.6\pwsh.exe" -NoProfile -Command "Write-Output ('::notice title=PowerShell version::' + $PSVersionTable.PSVersion)"
      - name: Check direct transport and restore repository Git routes
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $git = 'C:\FerrumActions\tools\git-2.55.0.5\bin\git.exe'
          $env:HTTP_PROXY = ''
          $env:HTTPS_PROXY = ''
          $env:ALL_PROXY = ''
          $env:NO_PROXY = 'localhost,127.0.0.1,::1,github.com,api.github.com'
          $ErrorActionPreference = 'Continue'
          $diagnostic = (& $git -c http.proxy= -c http.https://github.com/.proxy= -c http.lowSpeedTime=10 -c http.lowSpeedLimit=1 ls-remote https://github.com/sizzlecar/ferrum-infer-rs.git refs/heads/main 2>&1 | Out-String).Trim()
          $directCode = $LASTEXITCODE
          Write-Output ('::notice title=Direct Git result::exit=' + $directCode + '; ' + $diagnostic.Replace("`r", '').Replace("`n", '%0A'))
          $ErrorActionPreference = 'Stop'
          if ($directCode -ne 0) { throw 'Direct Windows GitHub transport failed; no configuration changed' }
          $config = Join-Path $env:USERPROFILE '.gitconfig'
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMddTHHmmssZ')
          if (Test-Path $config) { Copy-Item -LiteralPath $config -Destination ($config + '.before-release-route-' + $stamp) }
          [IO.File]::AppendAllText($config, "`n[http `"https://github.com/`"]`n`tproxy =`n", (New-Object Text.UTF8Encoding($false)))
          Write-Output 'Windows GitHub repository route restored; prior configuration backed up'
          Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Name,Status
          Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort
          $script = @'
          set -eu
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy git -c http.proxy= -c http.https://github.com/.proxy= -c http.lowSpeedTime=10 -c http.lowSpeedLimit=1 ls-remote https://github.com/sizzlecar/ferrum-infer-rs.git refs/heads/main
          config=/home/ferrum/.gitconfig
          if [ -f "$config" ]; then cp "$config" "$config.before-release-route-$(date -u +%Y%m%dT%H%M%SZ)"; fi
          git config --global --replace-all http.https://github.com/.proxy ''
          printf 'WSL GitHub repository route restored; prior configuration backed up\n'
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($script.Replace("`r", "")))
          & wsl.exe -u ferrum -- bash -lc "echo $encoded | base64 -d | bash -e"
          if ($LASTEXITCODE -ne 0) { throw 'WSL route restoration failed' }
