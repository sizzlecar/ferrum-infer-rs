name: CI

on:
  # main requires PRs and the CI required check on an up-to-date branch.
  # Validate the proposed merge once; do not repeat the same build on push.
  # workflow_dispatch remains available for explicit backend/cache validation.
  pull_request:
  workflow_dispatch:
    inputs:
      build_ptx:
        description: 'Also compile CUDA kernels to PTX (~40min)'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Treat every rustc warning as an error. Keeps the tree clean — dev
  # opts into warnings locally for iteration and silences them via
  # `#[allow(...)]` on the specific item, never at the CI level.
  RUSTFLAGS: "-D warnings"

jobs:
  prepare:
    name: Plan and validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt

      - name: Check CI policy
        run: |
          rustfmt --edition 2021 --check .github/ci/policy.rs
          rustc --edition=2021 --deny warnings --test .github/ci/policy.rs -o "$RUNNER_TEMP/policy-tests"
          "$RUNNER_TEMP/policy-tests"
          rustc --edition=2021 --deny warnings .github/ci/policy.rs -o "$RUNNER_TEMP/policy"

      - name: Classify changes and check diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'scope=code' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = pull_request ]; then
            test -n "$BASE_SHA"
            if ! git cat-file -e "$BASE_SHA^{commit}"; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            git diff --check "$BASE_SHA" HEAD --
            # Keep both paths of renames and preserve NUL separators in a file.
            # A code file renamed into docs must still run code checks.
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD -- > "$RUNNER_TEMP/changed-paths.z"
            scope=$("$RUNNER_TEMP/policy" classify < "$RUNNER_TEMP/changed-paths.z")
            echo "scope=$scope" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

      - name: Check local documentation links and anchors
        run: |
          mkdir -p "$RUNNER_TEMP/lychee"
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 \
            --output "$RUNNER_TEMP/lychee.tar.gz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            '1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a' \
            "$RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee" \
            lychee-x86_64-unknown-linux-gnu/lychee
          "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu/lychee" \
            --offline --include-fragments --no-progress --format json \
            --output "$RUNNER_TEMP/docs-links.json" \
            README.md README_zh.md CHANGELOG.md 'docs/**/*.md'

      - name: Save documentation link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-links
          path: ${{ runner.temp }}/docs-links.json
          retention-days: 7

  # ── CPU (Linux) ──────────────────────────────────────────────────────
  # Core quality gate: format, lint, unit tests, integration tests
  cpu:
    name: CPU (Linux)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships with ~30 GB of preinstalled SDKs (.NET, Android,
      # Haskell, etc.) that we don't need. Cargo registry + target dir +
      # Rust toolchain easily blow past the remaining ~14 GB on big builds —
      # observed: jobs dying mid-cache-restore with "No space left on device".
      # Reclaim ~25 GB before any cache step touches the disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential ffmpeg

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy, rust-src

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cpu-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile (workspace, all targets)
        run: cargo check --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -A warnings

      - name: Workspace tests (all targets)
        run: cargo test --locked --workspace --all-targets

      # --all-targets does not include doctests.
      - name: Documentation tests
        run: cargo test --locked --workspace --doc

      # ── CLI E2E ───────────────────────────────────────
      - name: "Test: CLI build + smoke test"
        run: |
          cargo build --locked -p ferrum-cli --bin ferrum
          # Verify help works
          ./target/debug/ferrum --help
          ./target/debug/ferrum tts --help
          ./target/debug/ferrum transcribe --help
          ./target/debug/ferrum serve --help

  # ── Metal (macOS) ────────────────────────────────────────────────────
  # Verifies Metal shader compilation + Metal-gated code paths
  metal:
    name: Metal (macOS)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-metal-

      - name: Compile with Metal (all targets)
        run: cargo check --locked --workspace --all-targets --features metal

      # Reuse the dev profile built by tests. Release assets are built by the
      # release workflows and undergo their own installation/runtime checks.
      - name: Build CLI (Metal, dev)
        run: cargo build --locked -p ferrum-cli --bin ferrum --features metal

      - name: Workspace tests (all targets, Metal feature)
        run: cargo test --locked --workspace --all-targets --features metal

      - name: Documentation tests (Metal feature)
        run: cargo test --locked --workspace --doc --features metal

      - name: "Test: CLI help (Metal build)"
        run: |
          ./target/debug/ferrum --help
          ./target/debug/ferrum tts --help

  # ── CUDA (Linux + CUDA toolkit) ─────────────────────────────────────
  # Type-checks CUDA code paths. PTX build optional (slow).
  cuda:
    name: CUDA (Linux)
    needs: prepare
    if: needs.prepare.outputs.scope == 'code'
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CUDA_HOME: /usr/local/cuda
      CUDA_ROOT: /usr/local/cuda
      CUDA_COMPUTE_CAP: "89"
      # Build-time, content-addressed component. The resulting ferrum binary
      # links these operators statically and performs no runtime download.
      NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst
      NATIVE_OPERATOR_SET_ARCHIVE_SHA256: d4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages \
            ca-certificates curl build-essential pkg-config libssl-dev git \
            python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v6.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - name: Type check release CLI (full CUDA features)
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo check --locked -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Build CUDA kernels (PTX)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_ptx == 'true'
        env:
          CUDA_COMPUTE_CAP: "89"
        run: |
          export PATH="/root/.cargo/bin:/usr/local/cuda/bin:$PATH"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --locked -p ferrum-kernels --features cuda

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare, cpu, metal, cuda]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Require successful checks for the selected scope
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CHANGE_SCOPE: ${{ needs.prepare.outputs.scope }}
          CPU_RESULT: ${{ needs.cpu.result }}
          METAL_RESULT: ${{ needs.metal.result }}
          CUDA_RESULT: ${{ needs.cuda.result }}
        run: |
          rustc --edition=2021 --deny warnings .github/ci/policy.rs -o "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy" aggregate "$PREPARE_RESULT" "$CHANGE_SCOPE" \
            "$CPU_RESULT" "$METAL_RESULT" "$CUDA_RESULT"
