name: CI runner network recovery
run-name: Restore WSL GitHub checkout connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-wsl-network:
    runs-on: [self-hosted, Linux, X64, ferrum-cuda, cuda-sm89]
    timeout-minutes: 3
    concurrency:
      group: ferrum-panda-hardware
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
        working-directory: /home/ferrum
    steps:
      - name: Verify direct GitHub transport and restore the Git route
        run: |
          set -euo pipefail
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          export NO_PROXY='*'
          result=$(timeout 30s git -c http.proxy= -c http.https://github.com/.proxy= -c http.lowSpeedTime=10 -c http.lowSpeedLimit=1 ls-remote https://github.com/sizzlecar/ferrum-infer-rs.git refs/heads/main 2>&1) || { printf '::error::Direct GitHub transport failed: %s\n' "$result"; exit 1; }
          printf '::notice title=Direct WSL Git::%s\n' "$result"
          config=/home/ferrum/.gitconfig
          if [ -f "$config" ]; then cp "$config" "$config.before-release-route-$(date -u +%Y%m%dT%H%M%SZ)"; fi
          git config --global --replace-all http.https://github.com/.proxy ''
          printf '::notice::Restored the verified direct GitHub route; original Git configuration backed up\n'
