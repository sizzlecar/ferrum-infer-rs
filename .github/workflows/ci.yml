name: Audit Cargo credential delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read-only authentication and opaque credential identity
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          AUDIT_CHALLENGE: 870be33a5390853ff20cb6bbaf5af1bd1560eeaa15798a14
        run: |
          node <<'AUDIT'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const token = process.env.CARGO_REGISTRY_TOKEN || '';
            const result = {
              present: token.length > 0,
              outerWhitespace: token !== token.trim(),
              identity: crypto.createHmac('sha256', token).update(process.env.AUDIT_CHALLENGE).digest('hex'),
              endpoint: 'GET /api/v1/trusted_publishing/github_configs?crate=ferrum-cli',
            };
            try {
              const response = await fetch('https://crates.io/api/v1/trusted_publishing/github_configs?crate=ferrum-cli', {
                headers: { Authorization: token, 'User-Agent': 'sizzlecar-release-credential-audit (https://github.com/sizzlecar/ferrum-infer-rs)' },
                signal: AbortSignal.timeout(30000),
              });
              result.httpStatus = response.status;
              const body = await response.json();
              const details = (body.errors || []).map(error => error.detail);
              result.classification = response.status === 200 ? 'authenticated'
                : details.includes('authentication failed') ? 'authentication_rejected'
                : details.includes('this token does not have the required permissions to perform this action') ? 'authenticated_scope_limited'
                : details.includes('You are not an owner of this crate') ? 'authenticated_not_owner'
                : 'unclassified_response';
            } catch { result.classification = 'transport_or_response_error'; }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/cargo-credential-audit.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify({present:result.present,outerWhitespace:result.outerWhitespace,httpStatus:result.httpStatus,classification:result.classification}));
          })().catch(() => { console.error('Credential audit failed; credential output suppressed.'); process.exitCode = 1; });
          AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-credential-audit
          path: ${{ runner.temp }}/cargo-credential-audit.json
          if-no-files-found: error
          retention-days: 3
