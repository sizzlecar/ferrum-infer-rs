name: Deliver formal release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      run_cloud_cuda:
        description: "Opt in to rented CUDA hardware for extended large-model regression (local CUDA remains required)"
        required: false
        default: false
        type: boolean
      reuse_cuda_run_id:
        description: "Optional cloud evidence source; requires run_cloud_cuda=true"
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: formal-release-delivery
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  prepare:
    if: github.repository == 'sizzlecar/ferrum-infer-rs'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      active: ${{ steps.plan.outputs.active }}
      version: ${{ steps.plan.outputs.version }}
      rc_tag: ${{ steps.plan.outputs.rc_tag }}
      baseline_tag: ${{ steps.plan.outputs.baseline_tag }}
      cloud_cuda: ${{ steps.plan.outputs.cloud_cuda }}
      windows_launcher_url: ${{ steps.launcher.outputs.url }}
      windows_launcher_sha256: ${{ steps.launcher.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-delivery-controller-rust-1.91
      - name: Freeze required local Metal/CUDA and optional cloud validation before building
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_CLOUD_CUDA: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cloud_cuda }}
          REUSE_CUDA_RUN_ID: ${{ inputs.reuse_cuda_run_id }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          if [ "$RUN_CLOUD_CUDA" != true ] && [ -n "$REUSE_CUDA_RUN_ID" ]; then
            echo '::error::reuse_cuda_run_id requires explicit run_cloud_cuda=true'
            exit 1
          fi
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ferrum-cli") | .version')
          if [ "$EVENT" = push ] && git show-ref --verify --quiet "refs/tags/v$version"; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'No new coordinated version; release delivery was not started.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=''
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && \
               git merge-base --is-ancestor "$tag" HEAD && \
               [ "$(git rev-parse "$tag^{}")" != "$GITHUB_SHA" ]; then
              base="$tag"
              break
            fi
          done < <(git tag --sort=-version:refname)
          test -n "$base"
          cargo run --locked -p ferrum-bench-core --example regression_plan -- \
            --catalog docs/release-regression-catalog.json --base "$base" --candidate HEAD \
            --run-cloud-cuda "$RUN_CLOUD_CUDA" \
            --stage release --output "$RUNNER_TEMP/release-plan.json" \
            --summary "$RUNNER_TEMP/release-plan.md"
          cat "$RUNNER_TEMP/release-plan.md" >> "$GITHUB_STEP_SUMMARY"
          # A missing executable binding is an implementation gap, not a reason
          # to rent a GPU and hope a broad smoke test covers it.
          jq -e '.plan.gaps == [] and .model_tasks.unsupported_obligations == [] and .performance_tasks.unsupported_obligations == []' "$RUNNER_TEMP/release-plan.json"
          cloud_cuda=$(jq -er '.plan.release_cuda.cloud | if . == "required" then "true" elif . == "disabled" then "false" else error("missing frozen CUDA policy") end' "$RUNNER_TEMP/release-plan.json")
          test "$cloud_cuda" = "$RUN_CLOUD_CUDA"
          jq -e '.plan.release_metal | (.mandatory_local_profile_ids | length > 0) and (.extended_profile_ids | length > 0) and (.reason | length > 0)' "$RUNNER_TEMP/release-plan.json"
          # Freeze source selectors and latency policy before staging or rental.
          # Every newly selected performance target needs an explicit source;
          # a missing mapping cannot silently reuse a different model.
          jq -e --slurpfile config .github/release-performance.json \
            '[.performance_tasks.runs[].profile.model as $model | [$config[0].sources[] | select(.model == $model)] | length == 1] | all' \
            "$RUNNER_TEMP/release-plan.json"
          cp .github/release-performance.json "$RUNNER_TEMP/release-performance.json"
          rc_tag="v${version}-rc.${GITHUB_RUN_NUMBER}"
          cargo run --locked -p ferrum-bench-core --example release_candidate -- verify \
            --workspace . --version "$version" --previous-version "${base#v}" \
            --candidate-sha "$GITHUB_SHA" --candidate-tag "$rc_tag" --staging-label "run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name ferrum-release
          git config user.email ferrum-release@users.noreply.github.com
          if git show-ref --verify --quiet "refs/tags/$rc_tag"; then
            test "$(git cat-file -t "refs/tags/$rc_tag")" = tag
            test "$(git rev-parse "$rc_tag^{}")" = "$GITHUB_SHA"
          else
            git tag -a "$rc_tag" "$GITHUB_SHA" -m "Ferrum $version release candidate"
            git push origin "refs/tags/$rc_tag"
          fi
          # Freeze generated notes with the plan; a publication-only retry
          # must not change an existing draft's accepted text.
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=v$version" -f "target_commitish=$GITHUB_SHA" -f "previous_tag_name=$base" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"
          printf '\n## CPU compatibility scope\n\nRequired load and basic run/serve representatives:\n' >> "$RUNNER_TEMP/release-notes.md"
          jq -r '.model_tasks.runs[] | select(.profile.target.backend == "cpu") | "- " + .profile.id + ": " + .profile.model' "$RUNNER_TEMP/release-plan.json" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nCPU is a compatibility backend, not the primary model-regression target. Per-format load/basic inference, protocol, numerical, safety and installation checks remain required. Extended CPU model semantics are not run and are not certified.\n' >> "$RUNNER_TEMP/release-notes.md"
          jq -r '.plan.cpu_compatibility_not_run[]? | "- CPU behavior not run: " + .behavior + "; scope: " + (.scope | tojson)' "$RUNNER_TEMP/release-plan.json" >> "$RUNNER_TEMP/release-notes.md"
          printf '\n## CUDA validation scope\n\nRequired: local small-model and device correctness regression.\n' >> "$RUNNER_TEMP/release-notes.md"
          if [ "$cloud_cuda" = true ]; then
            printf 'Extended cloud model regression: explicitly enabled and required.\n' >> "$RUNNER_TEMP/release-notes.md"
          else
            printf 'Extended cloud model regression: not run (disabled by default); local representative results do not certify the untested large-model profiles.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if jq -e '([.plan.release_cuda.model_limitations[]?, .plan.release_metal.model_limitations[]?] | length) > 0' "$RUNNER_TEMP/release-plan.json" >/dev/null; then
            printf '\n## Known model capability limits\n\nThe following model-dependent coverage is explicitly not certified, not passed. Product protocol, device/numerical and installation checks remain required.\n' >> "$RUNNER_TEMP/release-notes.md"
            jq -r '.plan | [(.release_cuda.model_limitations[]? | . + {backend: "cuda"}), (.release_metal.model_limitations[]? | . + {backend: "metal"})][] | "- " + .backend + "/" + .profile_id + " (" + .model_source + "): " + .reason + " Evidence: " + .evidence' "$RUNNER_TEMP/release-plan.json" >> "$RUNNER_TEMP/release-notes.md"
            jq -r '.plan.model_limitations_not_run[] | "- Uncovered behavior: " + .behavior + "; scope: " + (.scope | tojson)' "$RUNNER_TEMP/release-plan.json" >> "$RUNNER_TEMP/release-notes.md"
          fi
          printf '\n## Metal validation scope\n\nRequired: serial representative-model regression on the local Apple Silicon release runner, plus real-device correctness checks.\n' >> "$RUNNER_TEMP/release-notes.md"
          jq -r '"Required profiles: " + (.plan.release_metal.mandatory_local_profile_ids | join(", ")) + ".", "Not run: " + (.plan.release_metal.extended_profile_ids | join(", ")) + ".", .plan.release_metal.reason' "$RUNNER_TEMP/release-plan.json" >> "$RUNNER_TEMP/release-notes.md"
          printf 'Local dense-model results do not certify the untested MoE, larger-model or mixed-precision profiles.\n' >> "$RUNNER_TEMP/release-notes.md"
          printf 'active=true\nversion=%s\nrc_tag=%s\nbaseline_tag=%s\ncloud_cuda=%s\n' "$version" "$rc_tag" "$base" "$cloud_cuda" >> "$GITHUB_OUTPUT"
      - name: Reuse the immutable stable launcher from the formal baseline
        if: steps.plan.outputs.active == 'true'
        id: launcher
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          BASELINE_TAG: ${{ steps.plan.outputs.baseline_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASELINE_TAG" > "$RUNNER_TEMP/baseline-release.json"
          jq -e --arg tag "$BASELINE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$RUNNER_TEMP/baseline-release.json"
          release_id=$(jq -er '.id' "$RUNNER_TEMP/baseline-release.json")
          # The embedded assets array can be truncated; inspect every public asset.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq 'add' > "$RUNNER_TEMP/baseline-assets.json"
          count=$(jq '[.[] | select(.name == "ferrum-windows-launcher-v1.exe")] | length' "$RUNNER_TEMP/baseline-assets.json")
          if [ "$count" = 0 ]; then
            # A formal baseline without Windows assets is the first issuance only.
            jq -e '[.[] | select(.name | test("windows"; "i"))] | length == 0' "$RUNNER_TEMP/baseline-assets.json"
            printf 'url=\nsha256=\n' >> "$GITHUB_OUTPUT"
          else
            test "$count" = 1
            expected="https://github.com/$GITHUB_REPOSITORY/releases/download/$BASELINE_TAG/ferrum-windows-launcher-v1.exe"
            jq -e --arg url "$expected" '.[] | select(.name == "ferrum-windows-launcher-v1.exe") | .browser_download_url == $url and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/baseline-assets.json"
            sha=$(jq -er '.[] | select(.name == "ferrum-windows-launcher-v1.exe") | .digest | sub("^sha256:"; "")' "$RUNNER_TEMP/baseline-assets.json")
            printf 'url=%s\nsha256=%s\n' "$expected" "$sha" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-plan
          overwrite: true
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/release-plan.md
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/release-performance.json
          retention-days: 30

  tools:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.tools.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-delivery-controller-rust-1.91
      - name: Build release tools once for Linux consumers
        run: |
          cargo build --locked -p ferrum-devtools -p ferrum-bench-core --bin release_delivery --example model_gate
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp target/debug/release_delivery target/debug/examples/model_gate "$RUNNER_TEMP/release-tools/"
          cd "$RUNNER_TEMP/release-tools"
          sha256sum release_delivery model_gate > binaries.sha256
          tar -czf tools.tar.gz release_delivery model_gate binaries.sha256
      - uses: actions/upload-artifact@v4
        id: tools
        with:
          name: release-tools-linux
          path: ${{ runner.temp }}/release-tools/tools.tar.gz
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Quality
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ github.sha }}

  stage:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/release.yml
    with:
      platform: linux
      version: ${{ needs.prepare.outputs.version }}
      release_candidate_sha: ${{ github.sha }}
      release_candidate_tag: ${{ needs.prepare.outputs.rc_tag }}
      staging_label: run-${{ github.run_id }}-${{ github.run_attempt }}
      publish_release: false

  stage-metal:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/release.yml
    with:
      platform: macos
      version: ${{ needs.prepare.outputs.version }}
      release_candidate_sha: ${{ github.sha }}
      release_candidate_tag: ${{ needs.prepare.outputs.rc_tag }}
      staging_label: run-${{ github.run_id }}-${{ github.run_attempt }}
      publish_release: false

  stage-cuda-linux:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/release-cuda.yml
    with:
      platform: linux
      version: ${{ needs.prepare.outputs.version }}
      release_candidate_sha: ${{ github.sha }}
      release_candidate_tag: ${{ needs.prepare.outputs.rc_tag }}
      staging_label: run-${{ github.run_id }}-${{ github.run_attempt }}
      publish_release: false

  stage-cuda:
    # Qualify the existing model probes before the expensive native Windows
    # package. CPU compatibility runs first on the same Panda hardware as well;
    # these are the ordinary required jobs, not an extra preflight model matrix.
    needs: [prepare, metal-models, cuda-models, cpu-models]
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/release-windows.yml
    with:
      backend: cuda
      version: ${{ needs.prepare.outputs.version }}
      release_candidate_sha: ${{ github.sha }}
      release_candidate_tag: ${{ needs.prepare.outputs.rc_tag }}
      staging_label: run-${{ github.run_id }}-${{ github.run_attempt }}
      publish_release: false
      windows_launcher_url: ${{ needs.prepare.outputs.windows_launcher_url }}
      windows_launcher_sha256: ${{ needs.prepare.outputs.windows_launcher_sha256 }}

  stage-cpu-windows:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    uses: ./.github/workflows/release-windows.yml
    with:
      backend: cpu
      version: ${{ needs.prepare.outputs.version }}
      release_candidate_sha: ${{ github.sha }}
      release_candidate_tag: ${{ needs.prepare.outputs.rc_tag }}
      staging_label: run-${{ github.run_id }}-${{ github.run_attempt }}
      publish_release: false
      windows_launcher_url: ${{ needs.prepare.outputs.windows_launcher_url }}
      windows_launcher_sha256: ${{ needs.prepare.outputs.windows_launcher_sha256 }}

  tasks:
    needs: [prepare, tools, stage, stage-metal, stage-cuda-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-tools
      - name: Verify prepared release tools
        run: |
          cd "$RUNNER_TEMP/release-tools"
          tar -xzf tools.tar.gz
          sha256sum --check binaries.sha256
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage.outputs.linux_asset_id }},${{ needs.stage-metal.outputs.metal_asset_id }},${{ needs.stage-cuda-linux.outputs.cuda_asset_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged
      - name: Bind selected tasks and inspect CPU and CUDA archive bytes
        run: |
          mkdir -p "$RUNNER_TEMP/installation"
          for backend in cpu cuda; do
            asset=ferrum-linux-x86_64.tar.gz
            extra=()
            if [ "$backend" = cuda ]; then
              asset=ferrum-linux-x86_64-cuda-sm89.tar.gz
              extra=(--extract-only)
            fi
            release_delivery inspect \
              --abi "$RUNNER_TEMP/staged/$asset.abi.json" --version "$VERSION" \
              --candidate-sha "$GITHUB_SHA" --extract-dir "$RUNNER_TEMP/extracted-$backend" \
              --output "$RUNNER_TEMP/installation/$backend.json" "${extra[@]}"
          done
          # Model runners execute Linux CPU/CUDA and macOS Metal. The separate
          # macOS CPU artifact has its own native installation report.
          model_gate prepare --plan "$RUNNER_TEMP/plan/release-plan.json" \
            --version "$VERSION" \
            --abi "$RUNNER_TEMP/staged/ferrum-linux-x86_64.tar.gz.abi.json" \
            --abi "$RUNNER_TEMP/staged/ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json" \
            --abi "$RUNNER_TEMP/staged/ferrum-macos-aarch64.tar.gz.abi.json" \
            --output-dir "$RUNNER_TEMP/tasks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tasks
          overwrite: true
          path: ${{ runner.temp }}/tasks/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-linux
          overwrite: true
          path: ${{ runner.temp }}/installation/
          retention-days: 30

  cpu-models:
    name: CPU release models
    needs: [prepare, tools, stage, cuda-models]
    runs-on: [self-hosted, Linux, X64, ferrum-cuda, cuda-sm89]
    concurrency:
      group: ferrum-panda-hardware
      cancel-in-progress: false
      queue: max
    # Compatibility only: pinned small-model loading and basic run/serve for
    # each CPU format. Full CPU semantic coverage is disclosed as not run.
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-tools
      - name: Verify prepared release tools
        run: |
          cd "$RUNNER_TEMP/release-tools"
          tar -xzf tools.tar.gz
          sha256sum --check binaries.sha256
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage.outputs.linux_asset_id }},${{ needs.stage.outputs.linux_runner_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-cpu
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - name: Check CPU load and basic run/serve compatibility
        run: |
          model_gate prepare --backend cpu --plan "$RUNNER_TEMP/plan/release-plan.json" \
            --version "$VERSION" --abi "$RUNNER_TEMP/staged-cpu/ferrum-linux-x86_64.tar.gz.abi.json" \
            --output-dir "$RUNNER_TEMP/tasks"
          release_delivery inspect \
            --abi "$RUNNER_TEMP/staged-cpu/ferrum-linux-x86_64.tar.gz.abi.json" \
            --version "$VERSION" --candidate-sha "$GITHUB_SHA" \
            --extract-dir "$RUNNER_TEMP/extracted-cpu" --output "$RUNNER_TEMP/installation-cpu.json"
          cd "$RUNNER_TEMP/staged-cpu"
          sha256sum --check model-regression-linux-x86_64.tar.gz.sha256
          tar -xzf model-regression-linux-x86_64.tar.gz model_regression
          runner_sha=$(awk '{print $1}' model-regression-linux-x86_64.binary.sha256)
          release_delivery local --backend cpu \
            --tasks "$RUNNER_TEMP/tasks/tasks.json" --ferrum-bin "$RUNNER_TEMP/extracted-cpu/ferrum" \
            --runner "$RUNNER_TEMP/staged-cpu/model_regression" --runner-sha256 "$runner_sha" \
            --report-dir "$RUNNER_TEMP/model-cpu" --task-timeout-secs 600 \
            --request-timeout-secs 120
      - name: Save CPU release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-cpu-evidence
          overwrite: true
          path: |
            ${{ runner.temp }}/installation-cpu.json
            ${{ runner.temp }}/model-cpu/
          if-no-files-found: error
          retention-days: 30

  metal-models:
    name: Metal release models
    needs: [prepare, stage-metal]
    # One runner service on the release host serializes its own hardware jobs.
    runs-on: [self-hosted, macOS, ARM64, ferrum-metal-release]
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BASELINE_TAG: ${{ needs.prepare.outputs.baseline_tag }}
    steps:
      # Includes the upstream timeout-rejection fix (actions/toolkit#2124).
      # Keep the immutable artifact IDs and subsequent archive/ABI verification.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.stage-metal.outputs.metal_asset_id }},${{ needs.stage-metal.outputs.metal_runner_id }},${{ needs.stage-metal.outputs.metal_controller_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-metal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - name: Execute selected Metal models from the staged archive
        run: |
          cd "$RUNNER_TEMP/staged-metal"
          shasum -a 256 -c release-delivery-macos-aarch64.tar.gz.sha256
          tar -xzf release-delivery-macos-aarch64.tar.gz release_delivery model_gate
          shasum -a 256 -c release-delivery-macos-aarch64.binary.sha256
          ./model_gate prepare --backend metal --plan "$RUNNER_TEMP/plan/release-plan.json" \
            --version "$VERSION" --abi "$RUNNER_TEMP/staged-metal/ferrum-macos-aarch64.tar.gz.abi.json" \
            --output-dir "$RUNNER_TEMP/tasks"
          ./release_delivery inspect \
            --abi "$RUNNER_TEMP/staged-metal/ferrum-macos-aarch64.tar.gz.abi.json" \
            --version "$VERSION" --candidate-sha "$GITHUB_SHA" \
            --extract-dir "$RUNNER_TEMP/extracted-metal" --output "$RUNNER_TEMP/installation-metal.json"
          shasum -a 256 -c model-regression-macos-aarch64.tar.gz.sha256
          tar -xzf model-regression-macos-aarch64.tar.gz model_regression
          runner_sha=$(awk '{print $1}' model-regression-macos-aarch64.binary.sha256)
          ./release_delivery local --backend metal \
            --tasks "$RUNNER_TEMP/tasks/tasks.json" --ferrum-bin "$RUNNER_TEMP/extracted-metal/ferrum" \
            --runner "$RUNNER_TEMP/staged-metal/model_regression" --runner-sha256 "$runner_sha" \
            --report-dir "$RUNNER_TEMP/model-metal" --task-timeout-secs 3600
      - name: Prepare registered performance tasks
        id: performance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")
          job_id=$(jq -er '[.jobs[] | select(.name == "Metal release models" and .status == "in_progress")] | if length == 1 then .[0].id else error("ambiguous producer job") end' <<< "$jobs")
          mkdir -p "$RUNNER_TEMP/performance-tasks" "$RUNNER_TEMP/performance"
          jq -n --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head_sha "$GITHUB_SHA" --argjson job_id "$job_id" \
            '{schema_version:1,run_id:$run_id,run_attempt:$run_attempt,head_sha:$head_sha,job_id:$job_id}' \
            > "$RUNNER_TEMP/ci-origin.json"
          cp "$RUNNER_TEMP/ci-origin.json" "$RUNNER_TEMP/performance-tasks/ci-origin.json"
          if [ "$(jq '.performance_tasks.runs | length' "$RUNNER_TEMP/plan/release-plan.json")" = 0 ]; then
            jq '{status: (if .plan.deferred_performance == null then "not_required" else "deferred" end), deferred_performance: .plan.deferred_performance}' \
              "$RUNNER_TEMP/plan/release-plan.json" > "$RUNNER_TEMP/performance-tasks/scheduling.json"
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/baseline-metal"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASELINE_TAG" > "$RUNNER_TEMP/baseline-metal/release.json"
          for suffix in '' .abi.json .version.json .binary.sha256 .sha256 .dependency.json; do
            asset="ferrum-macos-aarch64.tar.gz$suffix"
            url=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/baseline-metal/release.json")
            digest=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | select(startswith("sha256:")) | ltrimstr("sha256:")' "$RUNNER_TEMP/baseline-metal/release.json")
            curl --fail --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 180 \
              --output "$RUNNER_TEMP/baseline-metal/$asset" "$url"
            printf '%s  %s\n' "$digest" "$RUNNER_TEMP/baseline-metal/$asset" | shasum -a 256 -c -
          done
          controller="$RUNNER_TEMP/staged-metal/release_delivery"
          baseline_sha=$(jq -er '.provenance.base' "$RUNNER_TEMP/plan/release-plan.json")
          "$controller" inspect --abi "$RUNNER_TEMP/baseline-metal/ferrum-macos-aarch64.tar.gz.abi.json" \
            --version "${BASELINE_TAG#v}" --candidate-sha "$baseline_sha" \
            --extract-dir "$RUNNER_TEMP/extracted-baseline-metal" --output "$RUNNER_TEMP/baseline-installation.json"
          jq '.policy' "$RUNNER_TEMP/plan/release-performance.json" > "$RUNNER_TEMP/performance-policy.json"
          while IFS= read -r profile; do
            model=$(jq -er --arg profile "$profile" '.performance_tasks.runs[] | select(.profile.id == $profile) | .profile.model' "$RUNNER_TEMP/plan/release-plan.json")
            jq -e --arg model "$model" '.sources[] | select(.model == $model)' \
              "$RUNNER_TEMP/plan/release-performance.json" > "$RUNNER_TEMP/performance-source.json"
            "$controller" performance-prepare --plan "$RUNNER_TEMP/plan/release-plan.json" --profile-id "$profile" \
              --candidate-abi "$RUNNER_TEMP/staged-metal/ferrum-macos-aarch64.tar.gz.abi.json" \
              --baseline-abi "$RUNNER_TEMP/baseline-metal/ferrum-macos-aarch64.tar.gz.abi.json" \
              --policy "$RUNNER_TEMP/performance-policy.json" --hf-cache "$HOME/.cache/huggingface/hub" \
              --source-selector "$RUNNER_TEMP/performance-source.json" --output-dir "$RUNNER_TEMP/performance-tasks"
          done < <(jq -er '.performance_tasks.runs[].profile.id' "$RUNNER_TEMP/plan/release-plan.json")
          echo 'active=true' >> "$GITHUB_OUTPUT"
      - name: Save registered performance tasks
        uses: actions/upload-artifact@v4
        with:
          name: release-performance-tasks
          overwrite: true
          path: ${{ runner.temp }}/performance-tasks/
          if-no-files-found: error
          retention-days: 30
      - name: Execute registered performance comparison
        if: steps.performance.outputs.active == 'true'
        run: |
          while IFS= read -r profile; do
            task="$RUNNER_TEMP/performance-tasks/$profile/expected-task.json"
            args=(--expected-task "$task" --source-manifest "$RUNNER_TEMP/performance-tasks/$profile/source-manifest.json"
              --baseline-bin "$RUNNER_TEMP/extracted-baseline-metal/ferrum"
              --candidate-bin "$RUNNER_TEMP/extracted-metal/ferrum" --client-bin "$RUNNER_TEMP/extracted-metal/ferrum"
              --report-dir "$RUNNER_TEMP/performance/$profile")
            for role in baseline candidate client; do
              args+=("--$role-version" "$(jq -er --arg role "$role" '.[$role + "_version"]' "$task")"
                "--$role-sha256" "$(jq -er --arg role "$role" '.[$role + "_sha256"]' "$task")")
            done
            for field in input_tokens output_tokens measured_requests warmup_requests repeats seed max_model_len concurrency; do
              args+=("--${field//_/-}" "$(jq -er --arg field "$field" '.policy.workload[$field]' "$task")")
            done
            if jq -e '.policy.workload.max_num_batched_tokens != null' "$task" >/dev/null; then
              args+=(--max-num-batched-tokens "$(jq -er '.policy.workload.max_num_batched_tokens' "$task")")
            fi
            for field in runtime_memory_budget_bytes startup_timeout_secs request_timeout_secs task_timeout_secs; do
              args+=("--${field//_/-}" "$(jq -er --arg field "$field" '.policy[$field]' "$task")")
            done
            for field in ttft_max_relative_increase tpot_max_relative_increase; do
              args+=("--${field//_/-}" "$(jq -er --arg field "$field" '.policy.limits[$field]' "$task")")
            done
            "$RUNNER_TEMP/staged-metal/release_delivery" performance "${args[@]}"
          done < <(jq -er '.performance_tasks.runs[].profile.id' "$RUNNER_TEMP/plan/release-plan.json")
      - name: Save Metal release evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-metal-evidence
          overwrite: true
          path: |
            ${{ runner.temp }}/installation-metal.json
            ${{ runner.temp }}/model-metal/
            ${{ runner.temp }}/performance/
            ${{ runner.temp }}/ci-origin.json
          if-no-files-found: error
          retention-days: 30

  cuda-models:
    # Consume Linux artifacts directly; Windows staging runs after these model
    # checks. The shared hardware lock still excludes other Panda GPU/CPU jobs.
    needs: [prepare, quality, tools, stage, stage-cuda-linux]
    runs-on: [self-hosted, Linux, X64, ferrum-cuda, cuda-sm89]
    concurrency:
      group: ferrum-panda-hardware
      cancel-in-progress: false
      queue: max
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-tools
      - name: Verify prepared release tools
        run: |
          cd "$RUNNER_TEMP/release-tools"
          tar -xzf tools.tar.gz
          sha256sum --check binaries.sha256
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage.outputs.linux_runner_id }},${{ needs.stage-cuda-linux.outputs.cuda_asset_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-cuda
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - name: Execute required local CUDA models from the staged archive
        run: |
          nvidia-smi --query-gpu=name,compute_cap,memory.total,memory.free,driver_version --format=csv
          model_gate prepare --backend cuda --cuda-lane local --plan "$RUNNER_TEMP/plan/release-plan.json" \
            --version "$VERSION" --abi "$RUNNER_TEMP/staged-cuda/ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json" \
            --output-dir "$RUNNER_TEMP/tasks"
          release_delivery inspect \
            --abi "$RUNNER_TEMP/staged-cuda/ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json" \
            --version "$VERSION" --candidate-sha "$GITHUB_SHA" \
            --extract-dir "$RUNNER_TEMP/extracted-cuda" --output "$RUNNER_TEMP/installation-cuda.json"
          cd "$RUNNER_TEMP/staged-cuda"
          sha256sum --check model-regression-linux-x86_64.tar.gz.sha256
          tar -xzf model-regression-linux-x86_64.tar.gz model_regression
          runner_sha=$(awk '{print $1}' model-regression-linux-x86_64.binary.sha256)
          release_delivery local --backend cuda \
            --tasks "$RUNNER_TEMP/tasks/tasks.json" --ferrum-bin "$RUNNER_TEMP/extracted-cuda/ferrum" \
            --runner "$RUNNER_TEMP/staged-cuda/model_regression" --runner-sha256 "$runner_sha" \
            --report-dir "$RUNNER_TEMP/model-cuda" --task-timeout-secs 1500 --request-timeout-secs 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-cuda-evidence
          overwrite: true
          path: |
            ${{ runner.temp }}/installation-cuda.json
            ${{ runner.temp }}/model-cuda/
          if-no-files-found: error
          retention-days: 30

  cuda-models-cloud:
    needs: [prepare, tools, stage, stage-cuda-linux]
    if: needs.prepare.outputs.active == 'true' && needs.prepare.outputs.cloud_cuda == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-tools
      - name: Verify prepared release tools
        run: |
          cd "$RUNNER_TEMP/release-tools"
          tar -xzf tools.tar.gz
          sha256sum --check binaries.sha256
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage.outputs.linux_runner_id }},${{ needs.stage-cuda-linux.outputs.cuda_asset_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-cuda
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - name: Prepare controller and verified CUDA bytes before the lease clock
        run: |
          model_gate prepare --backend cuda --cuda-lane cloud --plan "$RUNNER_TEMP/plan/release-plan.json" \
            --version "$VERSION" --abi "$RUNNER_TEMP/staged-cuda/ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json" \
            --output-dir "$RUNNER_TEMP/tasks"
          release_delivery inspect \
            --abi "$RUNNER_TEMP/staged-cuda/ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json" \
            --version "$VERSION" --candidate-sha "$GITHUB_SHA" --extract-only \
            --extract-dir "$RUNNER_TEMP/extracted-cuda" --output "$RUNNER_TEMP/cuda-extraction.json"
          cd "$RUNNER_TEMP/staged-cuda"
          sha256sum --check model-regression-linux-x86_64.tar.gz.sha256
          tar -xzf model-regression-linux-x86_64.tar.gz model_regression
      - name: Reverify optional CUDA evidence against current tasks and binaries
        id: reuse-cuda
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_cuda_run_id != ''
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.reuse_cuda_run_id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          reuse="$RUNNER_TEMP/cuda-reuse"
          mkdir "$reuse"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$reuse/run.json"
          jq -e --argjson id "$SOURCE_RUN" --argjson repo "$GITHUB_REPOSITORY_ID" '
            .id == $id and .repository.id == $repo and .head_repository.id == $repo and
            .head_branch == "main" and .status == "completed" and .run_attempt > 0 and
            (.event == "push" or .event == "workflow_dispatch") and
            (.path | split("@")[0]) == ".github/workflows/release-delivery.yml" and
            (.head_sha | test("^[0-9a-f]{40}$"))' "$reuse/run.json"
          source_sha=$(jq -r .head_sha "$reuse/run.json")
          gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...main" | \
            jq -e '.status == "ahead" or .status == "identical"'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?filter=all&per_page=100" > "$reuse/jobs.json"
          jq -e --slurpfile run "$reuse/run.json" '
            [.[].jobs[] | select(.name == "cuda-models-cloud")] | group_by(.run_attempt) |
            if any(.[]; length != 1) then error("ambiguous CUDA job") else flatten end |
            last as $job | select($job != null) | $job |
            select(.run_id == $run[0].id and .head_sha == $run[0].head_sha and
              .run_attempt > 0 and .run_attempt <= $run[0].run_attempt and
              .status == "completed" and .conclusion == "success")' "$reuse/jobs.json" > "$reuse/job.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" | \
            jq -e '[.[].artifacts[] | select(.name == "release-cuda-cloud-evidence")] | if length == 1 then .[0] else error("ambiguous CUDA artifact") end' > "$reuse/artifact.json"
          jq -e --slurpfile job "$reuse/job.json" --slurpfile run "$reuse/run.json" '
            def time: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            def successful($name): [$job[0].steps[] | select(.name == $name)] |
              if length == 1 and .[0].status == "completed" and .[0].conclusion == "success"
              then .[0] else error("CUDA execution/upload did not succeed") end;
            successful("Rent one bounded GPU, execute the selected tasks, and destroy it") as $execute |
            successful("Run actions/upload-artifact@v4") as $upload |
            .expired == false and .id > 0 and .size_in_bytes > 0 and .size_in_bytes <= 268435456 and
            .workflow_run.id == $run[0].id and .workflow_run.head_sha == $run[0].head_sha and
            .workflow_run.repository_id == $run[0].repository.id and
            .workflow_run.head_repository_id == $run[0].head_repository.id and
            (.digest | test("^sha256:[0-9a-f]{64}$")) and
            $execute.number < $upload.number and
            ($execute.started_at | time) >= ($job[0].started_at | time) and
            ($execute.completed_at | time) <= ($upload.started_at | time) and
            (.created_at | time) >= ($upload.started_at | time) and
            (.updated_at | time) >= (.created_at | time) and
            (.updated_at | time) <= ($upload.completed_at | time) and
            ($upload.completed_at | time) <= ($job[0].completed_at | time)' "$reuse/artifact.json"
          artifact_id=$(jq -r .id "$reuse/artifact.json")
          digest=$(jq -r '.digest | ltrimstr("sha256:")' "$reuse/artifact.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$reuse/evidence.zip"
          printf '%s  %s\n' "$digest" "$reuse/evidence.zip" | sha256sum --check -
          unzip -Z1 "$reuse/evidence.zip" | awk '
            /(^\/|(^|\/)\.\.(\/|$))/ || /[^A-Za-z0-9._\/-]/ {bad=1} END {exit bad}'
          zipinfo -l "$reuse/evidence.zip" | awk '$1 ~ /^l/ {bad=1} END {exit bad}'
          zipinfo -t "$reuse/evidence.zip" | awk '
            $3 ~ /^[0-9]+$/ && $4 == "bytes" && $5 == "uncompressed," && $3 > 0 && $3 <= 536870912 {valid=1}
            END {exit !valid}'
          unzip -q "$reuse/evidence.zip" -d "$reuse/raw"
          binary_sha=$(sha256sum "$RUNNER_TEMP/extracted-cuda/ferrum" | awk '{print $1}')
          runner_sha=$(sha256sum "$RUNNER_TEMP/staged-cuda/model_regression" | awk '{print $1}')
          jq -e --arg binary "$binary_sha" --arg runner "$runner_sha" --slurpfile job "$reuse/job.json" '
            def time: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            .schema_version == 1 and .status == "passed" and .error == null and .cleanup_errors == [] and
            .binary_sha256 == $binary and .runner_sha256 == $runner and
            .started_at >= ($job[0].started_at | time) and .finished_at >= .started_at and
            .finished_at <= ($job[0].completed_at | time)' "$reuse/raw/execution.json"
          jq '.expectations |= map(select(.profile.target.backend == "cuda"))' \
            "$RUNNER_TEMP/tasks/tasks.json" > "$reuse/current-tasks.json"
          jq -s 'sort_by(.profile.id)' "$reuse/raw"/task-*.json > "$reuse/source-tasks.json"
          jq -e --slurpfile source "$reuse/source-tasks.json" \
            '(.expectations | length) > 0 and (.expectations | sort_by(.profile.id)) == $source[0]' "$reuse/current-tasks.json"
          reports=()
          while IFS= read -r -d '' report; do reports+=(--report "$report"); done \
            < <(find "$reuse/raw" -name report.json -type f -print0)
          model_gate verify --tasks "$reuse/current-tasks.json" \
            "${reports[@]}" --output "$reuse/model-verification.json"
          # Reject a rerun or artifact replacement while download/reverification was in progress.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" | \
            jq -e --slurpfile before "$reuse/run.json" \
              '[.id,.run_attempt,.status,.head_sha] == [$before[0].id,$before[0].run_attempt,$before[0].status,$before[0].head_sha]'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" | \
            jq -e --slurpfile before "$reuse/artifact.json" '
              def identity: [.id,.name,.digest,.created_at,.updated_at,.expired,.size_in_bytes,.workflow_run];
              identity == ($before[0] | identity)'
          jq -n --slurpfile run "$reuse/run.json" --slurpfile job "$reuse/job.json" \
            --slurpfile artifact "$reuse/artifact.json" --arg candidate "$GITHUB_SHA" \
            '{schema_version:1,source_run:$run[0],source_cuda_job:$job[0],source_artifact:$artifact[0],verified_for_candidate:$candidate}' > "$reuse/raw/reuse-origin.json"
          cp "$reuse/model-verification.json" "$reuse/raw/reuse-verification.json"
          mv "$reuse/raw" "$RUNNER_TEMP/model-cuda"
          echo 'reused=true' >> "$GITHUB_OUTPUT"
          echo "Reverified original CUDA evidence from run $SOURCE_RUN, artifact $artifact_id, digest $digest; no GPU lease needed." >> "$GITHUB_STEP_SUMMARY"
      - name: Explain CUDA evidence reuse fallback
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_cuda_run_id != '' && steps.reuse-cuda.outcome != 'success'
        run: echo '::notice::CUDA evidence reuse was not verified. The original cloud execution will run; see the reuse step for the failed source, digest, binary, runner or task check.'
      - name: Rent one bounded GPU, execute the selected tasks, and destroy it
        if: steps.reuse-cuda.outputs.reused != 'true'
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          archive="$RUNNER_TEMP/staged-cuda/ferrum-linux-x86_64-cuda-sm89.tar.gz"
          archive_sha=$(jq -er .asset_sha256 "$archive.abi.json")
          runner_sha=$(awk '{print $1}' "$RUNNER_TEMP/staged-cuda/model-regression-linux-x86_64.binary.sha256")
          exec release_delivery cloud \
            --tasks "$RUNNER_TEMP/tasks/tasks.json" --archive "$archive" --archive-sha256 "$archive_sha" \
            --ferrum-bin "$RUNNER_TEMP/extracted-cuda/ferrum" \
            --runner "$RUNNER_TEMP/staged-cuda/model_regression" --runner-sha256 "$runner_sha" \
            --report-dir "$RUNNER_TEMP/model-cuda" --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --disk-gib 300 --min-free-disk-gib 180 --min-cpu-ram-mb 64000 \
            --max-hourly-usd 0.75 --max-network-usd-per-gb 0.004 \
            --lease-secs 10800 --bootstrap-secs 900 --task-timeout-secs 3600 --max-create-attempts 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-cuda-cloud-evidence
          overwrite: true
          path: |
            ${{ runner.temp }}/model-cuda/
            !${{ runner.temp }}/model-cuda/**/private/**
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, quality, tools, stage, stage-metal, stage-cuda-linux, stage-cuda, stage-cpu-windows, tasks, metal-models, cuda-models, cuda-models-cloud, cpu-models]
    if: >-
      always() && !cancelled() &&
      needs.prepare.outputs.active == 'true' &&
      needs.prepare.result == 'success' && needs.quality.result == 'success' &&
      needs.tools.result == 'success' && needs.stage.result == 'success' &&
      needs.stage-metal.result == 'success' && needs.stage-cuda-linux.result == 'success' &&
      needs.stage-cuda.result == 'success' && needs.stage-cpu-windows.result == 'success' &&
      needs.tasks.result == 'success' && needs.metal-models.result == 'success' &&
      needs.cuda-models.result == 'success' && needs.cpu-models.result == 'success' &&
      ((needs.prepare.outputs.cloud_cuda == 'true' && needs.cuda-models-cloud.result == 'success') ||
       (needs.prepare.outputs.cloud_cuda == 'false' && needs.cuda-models-cloud.result == 'skipped'))
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-delivery-publisher-rust-1.91
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage.outputs.linux_asset_id }},${{ needs.stage-metal.outputs.metal_asset_id }},${{ needs.stage-cuda-linux.outputs.cuda_asset_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage-cuda.outputs.asset_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-windows
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.stage-cpu-windows.outputs.asset_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/staged-windows/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-evidence
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        with:
          name: release-tasks
          path: ${{ runner.temp }}/tasks
      - uses: actions/download-artifact@v4
        with:
          name: installation-linux
          path: ${{ runner.temp }}/installation
      - uses: actions/download-artifact@v4
        with:
          name: installation-macos-cpu
          path: ${{ runner.temp }}/installation
      - uses: actions/download-artifact@v4
        with:
          name: contract-checks
          run-id: ${{ needs.quality.outputs.cpu_source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/contracts
      # Optional cached package checkpoints only save work. The publisher still
      # verifies candidate inputs, archived bytes, and every public channel.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/publication
          key: publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: publication-${{ github.sha }}-
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-tools
      - name: Verify prepared release tools
        run: |
          cd "$RUNNER_TEMP/release-tools"
          tar -xzf tools.tar.gz
          sha256sum --check binaries.sha256
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Recheck all required evidence and publish missing channel outputs
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          gate_args=(--plan "$RUNNER_TEMP/plan/release-plan.json" --tasks "$RUNNER_TEMP/tasks/tasks.json"
            --contracts "$RUNNER_TEMP/contracts/contract-checks.json" --version "$VERSION"
            --workspace "$GITHUB_WORKSPACE" --notes "$RUNNER_TEMP/plan/release-notes.md"
            --windows-staged "$RUNNER_TEMP/staged-windows"
            --repo "$GITHUB_REPOSITORY" --ci-run-id "$GITHUB_RUN_ID")
          for abi in "$RUNNER_TEMP/staged/"*.abi.json; do gate_args+=(--abi "$abi"); done
          # The planning host's CUDA receipt is extract-only. Use the local GPU
          # host's same-artifact runtime receipt as the authoritative install check.
          for install in "$RUNNER_TEMP/installation/"*.json; do
            if [ "$install" != "$RUNNER_TEMP/installation/cuda.json" ]; then gate_args+=(--installation "$install"); fi
          done
          gate_args+=(--installation "$RUNNER_TEMP/evidence/release-cuda-evidence/installation-cuda.json")
          gate_args+=(--installation "$RUNNER_TEMP/evidence/release-metal-evidence/installation-metal.json")
          while IFS= read -r -d '' report; do gate_args+=(--report "$report"); done \
            < <(find "$RUNNER_TEMP/evidence" -name report.json -type f -print0)
          release_delivery publish "${gate_args[@]}" \
            --state-dir "$RUNNER_TEMP/publication" --tap-repo sizzlecar/homebrew-ferrum
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/publication
          key: publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-state
          overwrite: true
          path: ${{ runner.temp }}/publication/
          if-no-files-found: warn
          retention-days: 30

  install-cargo:
    needs: [prepare, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-delivery-public-cargo-rust-1.91
      - name: Install the published crate and verify its actual program
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo build --locked -p ferrum-devtools --bin release_delivery
          cargo install ferrum-cli --version "=$VERSION" --locked --root "$RUNNER_TEMP/public-cargo"
          target/debug/release_delivery installed --channel cargo --version "$VERSION" \
            --binary "$RUNNER_TEMP/public-cargo/bin/ferrum" --output "$RUNNER_TEMP/public-cargo.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-cargo-installation
          overwrite: true
          path: ${{ runner.temp }}/public-cargo.json
          if-no-files-found: error
          retention-days: 30

  install-homebrew:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: metal
            runner: [self-hosted, macOS, ARM64, ferrum-metal-release]
            brew: /opt/homebrew/bin/brew
            formula: ferrum
          - backend: cuda
            runner: [self-hosted, Linux, X64, ferrum-cuda, cuda-sm89]
            brew: /home/linuxbrew/.linuxbrew/bin/brew
            formula: ferrum-cuda
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ matrix.backend == 'cuda' && 'ferrum-panda-hardware' || format('ferrum-metal-brew-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install or upgrade from the public tap and execute it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BREW: ${{ matrix.brew }}
          FORMULA: ${{ matrix.formula }}
        run: |
          cargo build --locked -p ferrum-devtools --bin release_delivery
          "$BREW" tap sizzlecar/ferrum
          "$BREW" update
          "$BREW" trust --formula sizzlecar/ferrum/ferrum
          "$BREW" trust --formula sizzlecar/ferrum/ferrum-cuda
          if "$BREW" list --versions "$FORMULA"; then
            "$BREW" upgrade "sizzlecar/ferrum/$FORMULA"
          else
            "$BREW" install "sizzlecar/ferrum/$FORMULA"
          fi
          binary="$("$BREW" --prefix "$FORMULA")/bin/ferrum"
          target/debug/release_delivery installed --channel homebrew --version "$VERSION" \
            --binary "$binary" --output "$RUNNER_TEMP/public-homebrew.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-homebrew-${{ matrix.backend }}-installation
          overwrite: true
          path: ${{ runner.temp }}/public-homebrew.json
          if-no-files-found: error
          retention-days: 30

  install-bootstrap-unix:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
          - runner: macos-14
            platform: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLIC_SMOKE_MODEL: Qwen/Qwen3.5-0.8B@2fc06364715b967f1860aea9cf38778875588b17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Build only acceptance helpers before invoking the public installer
        timeout-minutes: 30
        run: cargo build --locked -p ferrum-devtools --bin release_delivery --bin model_regression
      - name: Verify deployed script and execute the README download pipeline
        run: |
          target/debug/release_delivery entry \
            --url https://ferrum.pandaailabs.com/install.sh --expected-script scripts/install.sh \
            --output "$RUNNER_TEMP/public-entry.json"
          curl -fsSL https://ferrum.pandaailabs.com/install.sh | sh
          target/debug/release_delivery installed --channel bootstrap --version "$VERSION" \
            --binary "$HOME/.local/bin/ferrum" --output "$RUNNER_TEMP/public-bootstrap-auto.json"
          curl -fsSL https://ferrum.pandaailabs.com/install.sh | sh -s -- --backend cpu
          target/debug/release_delivery installed --channel bootstrap --version "$VERSION" \
            --binary "$HOME/.local/bin/ferrum" --output "$RUNNER_TEMP/public-bootstrap-cpu.json"
          target/debug/release_delivery entry \
            --url https://ferrum.pandaailabs.com/install.sh --expected-script scripts/install.sh \
            --output "$RUNNER_TEMP/public-entry-after.json"
      # This bounded CPU sample tests the public installation, not default GPU
      # selection, Quick Start capacity, or another full release model matrix.
      - name: Run the publicly installed CPU binary through real run and HTTP serve
        timeout-minutes: 30
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/public-bootstrap-runtime"
          mkdir "$receipt"
          target/debug/model_regression \
            --ferrum-bin "$HOME/.local/bin/ferrum" --backend cpu \
            --model "$PUBLIC_SMOKE_MODEL" --checks basic --profile-id public-install-cpu-basic \
            --source-label "$PUBLIC_SMOKE_MODEL" --precision-label safetensors-bf16-f32 \
            --context-tokens 2048 --max-num-seqs 1 --max-tokens 512 \
            --run-timeout-secs 600 --startup-timeout-secs 600 --request-timeout-secs 300 \
            --report-dir "$receipt/model" 2>&1 | tee "$receipt/model-runner.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-bootstrap-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/public-*.json
            ${{ runner.temp }}/public-bootstrap-runtime/
          if-no-files-found: error
          retention-days: 30

  install-bootstrap-windows:
    needs: [prepare, publish]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLIC_SMOKE_MODEL: Qwen/Qwen3.5-0.8B@2fc06364715b967f1860aea9cf38778875588b17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - name: Build only CPU acceptance helpers before invoking the public installer
        timeout-minutes: 30
        run: cargo build --locked -p ferrum-devtools --bin release_delivery --bin model_regression
      - name: Execute the README pipeline in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $controller = Join-Path $env:GITHUB_WORKSPACE 'target/debug/release_delivery.exe'
          & $controller entry --url https://ferrum.pandaailabs.com/install.ps1 --expected-script scripts/install.ps1 --output "$env:RUNNER_TEMP/public-entry.json"
          if ($LASTEXITCODE -ne 0) { throw 'The public PowerShell script differs from the release candidate' }
          irm https://ferrum.pandaailabs.com/install.ps1 | iex
          $binary = (Get-Command ferrum -CommandType Application -ErrorAction Stop).Path
          & $controller installed --channel bootstrap --version $env:VERSION --binary $binary --output "$env:RUNNER_TEMP/public-bootstrap-auto.json"
          if ($LASTEXITCODE -ne 0) { throw 'The publicly installed Windows program failed startup checks' }
          & $controller entry --url https://ferrum.pandaailabs.com/install.ps1 --expected-script scripts/install.ps1 --output "$env:RUNNER_TEMP/public-entry-after.json"
          if ($LASTEXITCODE -ne 0) { throw 'The public PowerShell script changed during installation' }
      # The hosted Windows image selects CPU through the unchanged README
      # installer. Keep native stderr logging out of PowerShell 5.1 error records.
      - name: Run the publicly installed Windows launcher through real run and HTTP serve
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($PSVersionTable.PSVersion -lt [version]'7.2') { throw 'Runtime log capture requires PowerShell 7.2 or later' }
          $receipt = Join-Path $env:RUNNER_TEMP 'public-bootstrap-runtime'
          $null = New-Item -ItemType Directory -Path $receipt -ErrorAction Stop
          # Reuse the exact installed entrypoint verified in the previous PS 5.1
          # process; a new step need not inherit its process-local PATH update.
          $installed = Get-Content -Raw -LiteralPath "$env:RUNNER_TEMP/public-bootstrap-auto.json" | ConvertFrom-Json
          $binary = $installed.requested_binary
          & target/debug/model_regression.exe `
            --ferrum-bin $binary --backend cpu `
            --model $env:PUBLIC_SMOKE_MODEL --checks basic --profile-id public-install-cpu-basic `
            --source-label $env:PUBLIC_SMOKE_MODEL --precision-label safetensors-bf16-f32 `
            --context-tokens 2048 --max-num-seqs 1 --max-tokens 512 `
            --run-timeout-secs 600 --startup-timeout-secs 600 --request-timeout-secs 300 `
            --report-dir "$receipt/model" 2>&1 | Tee-Object -FilePath "$receipt/model-runner.log"
          $runtimeExit = $LASTEXITCODE
          $runtimeExit | Set-Content -LiteralPath "$receipt/model-runner.exit-code.txt"
          if ($runtimeExit -ne 0) { throw "The installed Windows program failed real model regression (exit $runtimeExit)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-bootstrap-windows
          path: |
            ${{ runner.temp }}/public-*.json
            ${{ runner.temp }}/public-bootstrap-runtime/
          if-no-files-found: error
          retention-days: 30

  complete:
    needs: [prepare, publish, install-cargo, install-homebrew, install-bootstrap-unix, install-bootstrap-windows]
    if: always() && needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require publication and actual public installations
        env:
          PUBLISH: ${{ needs.publish.result }}
          CARGO_INSTALL: ${{ needs.install-cargo.result }}
          BREW_INSTALL: ${{ needs.install-homebrew.result }}
          UNIX_BOOTSTRAP: ${{ needs.install-bootstrap-unix.result }}
          WINDOWS_BOOTSTRAP: ${{ needs.install-bootstrap-windows.result }}
        run: |
          test "$PUBLISH" = success
          test "$CARGO_INSTALL" = success
          test "$BREW_INSTALL" = success
          test "$UNIX_BOOTSTRAP" = success
          test "$WINDOWS_BOOTSTRAP" = success
          echo 'Formal release delivered; Cargo, Homebrew and the public Windows/Linux/macOS installer entrypoints passed installation/startup checks.' >> "$GITHUB_STEP_SUMMARY"
