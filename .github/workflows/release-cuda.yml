name: Stage CUDA sm89 release asset

on:
  workflow_call:
    inputs:
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        type: boolean
    outputs:
      cuda_asset_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.linux-x86_64-cuda-sm89.outputs.asset_id }}
  workflow_dispatch:
    inputs:
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version }}
  RC_SHA: ${{ inputs.release_candidate_sha }}
  RC_TAG: ${{ inputs.release_candidate_tag }}
  STAGING_LABEL: ${{ inputs.staging_label }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  CUDA_HOME: /usr/local/cuda
  CUDA_ROOT: /usr/local/cuda
  CUDA_COMPUTE_CAP: 89
  # Build-time, content-addressed component. The staged ferrum binary links
  # these operators statically and performs no runtime download.
  NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst
  NATIVE_OPERATOR_SET_ARCHIVE_SHA256: d4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e

jobs:
  linux-x86_64-cuda-sm89:
    outputs:
      asset_id: ${{ steps.asset_id.outputs.artifact-id }}
    name: Stage Linux x86_64 CUDA sm89
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    steps:
      - name: Validate immutable staging inputs
        run: |
          if [[ "$PUBLISH_RELEASE" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "$RC_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "release_candidate_sha must be a full lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a formal MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          tag_prefix="v${VERSION}-rc."
          rc_number="${RC_TAG#"$tag_prefix"}"
          if [[ "$RC_TAG" != "$tag_prefix"* ]] || ! [[ "$rc_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v${VERSION}-rc.N" >&2
            exit 1
          fi
          if ! [[ "$STAGING_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - name: Install system dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages ca-certificates curl build-essential pkg-config libssl-dev git file python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.91.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify release candidate provenance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          tag_ref="refs/tags/$RC_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{}")" = "$RC_SHA"

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v6.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stage-rust1.91.0-linux-x86_64-cuda-sm89-cuda12.4-native-d4cdfe88-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stage-rust1.91.0-linux-x86_64-cuda-sm89-cuda12.4-native-d4cdfe88-cargo-

      - name: Build release metadata tool once
        run: cargo build --release --locked -p ferrum-bench-core --example release_candidate

      - name: Verify all workspace release versions
        run: |
          ./target/release/examples/release_candidate verify \
            --workspace . --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build release CUDA sm89 binary exactly once
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --release --locked -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Strip and audit CUDA binary
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-linux-x86_64-cuda-sm89.dependencies.txt
          ldd target/release/ferrum | tee -a ferrum-linux-x86_64-cuda-sm89.dependencies.txt

      - name: Package staged CUDA asset and adjacent manifests
        run: |
          asset="ferrum-linux-x86_64-cuda-sm89.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          cat > dist/CUDA-BUILD.txt <<EOF
          Ferrum v${VERSION} CUDA release binary
          CUDA toolkit image: nvidia/cuda:12.4.0-devel-ubuntu22.04
          CUDA_COMPUTE_CAP: 89
          Cargo features: cuda,vllm-moe-marlin,vllm-paged-attn-v2
          NVIDIA driver, compatible CUDA runtime, and NCCL runtime are required.
          EOF
          tar -C dist -czf "$asset" ferrum LICENSE README.md CUDA-BUILD.txt
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend cuda --target-triple x86_64-unknown-linux-gnu \
            --asset "$asset" --binary target/release/ferrum \
            --dependencies ferrum-linux-x86_64-cuda-sm89.dependencies.txt \
            --cargo-features cuda,vllm-moe-marlin,vllm-paged-attn-v2 \
            --cuda-compute-capability "$CUDA_COMPUTE_CAP" \
            --cuda-toolkit-image nvidia/cuda:12.4.0-devel-ubuntu22.04

      - name: Deferred CUDA smoke contract
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-linux-x86_64-cuda-sm89.tar.gz
          if ldconfig -p 2>/dev/null | grep -q 'libcuda.so.1'; then
            version_output="$(LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --version)"
            printf '%s\n' "$version_output"
            test "$version_output" = "ferrum $VERSION"
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --help >/dev/null
          else
            echo "Executable smoke is deferred to the exact staged-byte GPU gate."
            ldd ./smoke/ferrum
          fi

      - name: Upload staged CUDA asset
        id: asset_id
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64-cuda-sm89-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-linux-x86_64-cuda-sm89.tar.gz
            ferrum-linux-x86_64-cuda-sm89.tar.gz.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.binary.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.version.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.dependency.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json
            ferrum-linux-x86_64-cuda-sm89.dependencies.txt
