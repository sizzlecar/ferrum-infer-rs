name: Stage CUDA sm89 release asset

on:
  workflow_dispatch:
    inputs:
      release_candidate_sha:
        description: Exact clean G10A release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        default: v0.8.3-rc.1
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        default: v0.8.3-rc
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CUDA_HOME: /usr/local/cuda
  CUDA_ROOT: /usr/local/cuda
  CUDA_COMPUTE_CAP: 89
  # Build-time, content-addressed component. The staged ferrum binary links
  # these operators statically and performs no runtime download.
  NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v2/native-operator-set-cuda12.4-sm89-v2.tar.zst
  NATIVE_OPERATOR_SET_ARCHIVE_SHA256: 765f845ae20c305edc10b31650339f8a2782e9e56687c8bda3f8e843a50c636b

jobs:
  linux-x86_64-cuda-sm89:
    name: Stage Linux x86_64 CUDA sm89
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    steps:
      - name: Validate immutable staging inputs
        run: |
          if [[ "${{ inputs.publish_release }}" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "${{ inputs.release_candidate_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_candidate_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if ! [[ "${{ inputs.release_candidate_tag }}" =~ ^v0\.8\.3-rc\.[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v0.8.3-rc.N" >&2
            exit 1
          fi
          if ! [[ "${{ inputs.staging_label }}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - name: Install system dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages ca-certificates curl build-essential pkg-config libssl-dev git file python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.91.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify exact clean release candidate
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          expected_sha="${{ inputs.release_candidate_sha }}"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$expected_sha"
          test -z "$(git status --porcelain)"
          expected_tag="${{ inputs.release_candidate_tag }}"
          test "$(git cat-file -t "$expected_tag")" = tag
          test "$(git rev-parse "$expected_tag^{}")" = "$expected_sha"

      - name: Verify native operator source boundary
        run: python3 scripts/release/native_operator_artifact_gate.py --self-test

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v2.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          PYTHONPATH=scripts/release python3 - "$lock" <<'PY'
          import json
          import sys
          from pathlib import Path

          from runtime_vnext_native_operator_set import (
              public_identity,
              validate_native_operator_set,
          )
          from runtime_vnext_plan_reference import REQUIRED_CUDA_NATIVE_OPERATORS

          lock = Path(sys.argv[1])
          identity = public_identity(
              validate_native_operator_set(lock, REQUIRED_CUDA_NATIVE_OPERATORS)
          )
          print(json.dumps(identity, sort_keys=True))
          PY
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - name: Verify workspace release version
        id: metadata
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "ferrum-cli"))')"
          test "$version" = "0.8.3"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stage-v0.8.3-linux-x86_64-cuda-sm89-cuda12.4-native-765f845a-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: stage-v0.8.3-linux-x86_64-cuda-sm89-cuda12.4-native-765f845a-cargo-

      - name: Build release CUDA sm89 binary exactly once
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --release --locked -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Strip and audit CUDA binary
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-linux-x86_64-cuda-sm89.dependencies.txt
          ldd target/release/ferrum | tee -a ferrum-linux-x86_64-cuda-sm89.dependencies.txt
          if grep -Eiq 'python|torch|vllm' ferrum-linux-x86_64-cuda-sm89.dependencies.txt; then
            echo "CUDA release binary must not link Python, Torch, or vLLM" >&2
            exit 1
          fi

      - name: Package staged CUDA asset and adjacent manifests
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RC_SHA: ${{ inputs.release_candidate_sha }}
          RC_TAG: ${{ inputs.release_candidate_tag }}
          STAGING_LABEL: ${{ inputs.staging_label }}
        run: |
          asset="ferrum-linux-x86_64-cuda-sm89.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cp LICENSE dist/LICENSE
          cp README.md dist/README.md
          cat > dist/CUDA-BUILD.txt <<'EOF'
          Ferrum v0.8.3 CUDA release binary
          CUDA toolkit image: nvidia/cuda:12.4.0-devel-ubuntu22.04
          CUDA_COMPUTE_CAP: 89
          Cargo features: cuda,vllm-moe-marlin,vllm-paged-attn-v2
          NVIDIA driver, compatible CUDA runtime, and NCCL runtime are required.
          EOF
          tar -C dist -czf "$asset" ferrum LICENSE README.md CUDA-BUILD.txt
          ASSET="$asset" BINARY="target/release/ferrum" DEPENDENCIES="ferrum-linux-x86_64-cuda-sm89.dependencies.txt" \
            TARGET_TRIPLE="x86_64-unknown-linux-gnu" BACKEND="cuda" \
            python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          asset = Path(os.environ["ASSET"])
          binary = Path(os.environ["BINARY"])
          dependencies = Path(os.environ["DEPENDENCIES"])

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          asset_sha = digest(asset)
          binary_sha = digest(binary)
          dependency_sha = digest(dependencies)
          forbidden_runtime_linkage_found = bool(
              re.search(r"python|torch|vllm", dependencies.read_text(encoding="utf-8"), re.IGNORECASE)
          )
          assert not forbidden_runtime_linkage_found
          Path(f"{asset}.sha256").write_text(f"{asset_sha}  {asset.name}\n", encoding="utf-8")
          Path(f"{asset}.binary.sha256").write_text(f"{binary_sha}  ferrum\n", encoding="utf-8")
          common = {
              "schema_version": 1,
              "asset_name": asset.name,
              "asset_sha256": asset_sha,
              "binary_name": "ferrum",
              "binary_sha256": binary_sha,
              "release_candidate_sha": os.environ["RC_SHA"],
              "release_candidate_tag": os.environ["RC_TAG"],
              "staging_label": os.environ["STAGING_LABEL"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          version = dict(common, version=os.environ["VERSION"])
          dependency = dict(
              common,
              audit_file=dependencies.name,
              audit_sha256=dependency_sha,
              forbidden_runtime_linkage=["python", "torch", "vllm"],
              forbidden_runtime_linkage_found=forbidden_runtime_linkage_found,
          )
          abi = dict(
              common,
              target_triple=os.environ["TARGET_TRIPLE"],
              backend=os.environ["BACKEND"],
              cuda_compute_capability="89",
              cuda_toolkit_image="nvidia/cuda:12.4.0-devel-ubuntu22.04",
              cargo_features=["cuda", "vllm-moe-marlin", "vllm-paged-attn-v2"],
              dependency_audit_sha256=dependency_sha,
          )
          for suffix, payload in (
              ("version.json", version),
              ("dependency.json", dependency),
              ("abi.json", abi),
          ):
              Path(f"{asset}.{suffix}").write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
          PY

      - name: Deferred CUDA smoke contract
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-linux-x86_64-cuda-sm89.tar.gz
          if ldconfig -p 2>/dev/null | grep -q 'libcuda.so.1'; then
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --version
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --help >/dev/null
          else
            echo "Executable smoke is deferred to the exact staged-byte GPU gate."
            ldd ./smoke/ferrum
          fi

      - name: Upload staged CUDA asset
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64-cuda-sm89-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-linux-x86_64-cuda-sm89.tar.gz
            ferrum-linux-x86_64-cuda-sm89.tar.gz.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.binary.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.version.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.dependency.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json
            ferrum-linux-x86_64-cuda-sm89.dependencies.txt
