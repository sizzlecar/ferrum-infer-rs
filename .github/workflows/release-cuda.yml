name: Stage CUDA release assets

on:
  workflow_call:
    inputs:
      platform:
        description: Stage all platforms, linux, or windows independently
        type: string
        default: all
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        type: boolean
      windows_launcher_url:
        description: Immutable released launcher URL; empty only for its first issuance
        required: false
        default: ''
        type: string
      windows_launcher_sha256:
        description: SHA256 paired with windows_launcher_url; the launcher is reused unchanged
        required: false
        default: ''
        type: string
    outputs:
      cuda_asset_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.linux-x86_64-cuda-sm89.outputs.asset_id }}
      cuda_sm120_asset_id:
        description: Immutable Linux SM120 production artifact ID
        value: ${{ jobs.linux-x86_64-cuda-sm120.outputs.asset_id }}
      cuda_sm120_runtime_policy:
        description: Candidate-bound SM120 runtime validation scope
        value: required
      windows_asset_id:
        description: Windows ZIP, installer, stable launcher and staging byte receipts
        value: ${{ jobs.windows-x86_64-cuda-sm89.outputs.asset_id }}
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to stage
        type: choice
        default: all
        options: [all, linux, windows]
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        default: false
        type: boolean
      windows_launcher_url:
        description: Immutable released launcher URL; empty only for its first issuance
        required: false
        default: ''
        type: string
      windows_launcher_sha256:
        description: SHA256 paired with windows_launcher_url; the launcher is reused unchanged
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  STAGING_PLATFORM: ${{ inputs.platform }}
  VERSION: ${{ inputs.version }}
  RC_SHA: ${{ inputs.release_candidate_sha }}
  RC_TAG: ${{ inputs.release_candidate_tag }}
  STAGING_LABEL: ${{ inputs.staging_label }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  CUDA_HOME: /usr/local/cuda
  CUDA_ROOT: /usr/local/cuda
  CUDA_COMPUTE_CAP: 89
  # Build-time, content-addressed component. The staged ferrum binary links
  # these operators statically and performs no runtime download.
  NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v8/native-operator-set-cuda12.4-sm89-v8.tar.zst
  NATIVE_OPERATOR_SET_ARCHIVE_SHA256: 977538d1f33e02adfef43e6648cf0749f07b15b238e0b240ad1e3bd338c37d60

jobs:
  linux-x86_64-cuda-sm89:
    if: inputs.platform != 'windows'
    outputs:
      asset_id: ${{ steps.asset_id.outputs.artifact-id }}
    name: Stage Linux x86_64 CUDA sm89
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    steps:
      - name: Validate immutable staging inputs
        run: |
          case "$STAGING_PLATFORM" in all|linux) ;; *) echo 'Invalid staging platform' >&2; exit 1;; esac
          if [[ "$PUBLISH_RELEASE" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "$RC_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "release_candidate_sha must be a full lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a formal MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          tag_prefix="v${VERSION}-rc."
          rc_number="${RC_TAG#"$tag_prefix"}"
          if [[ "$RC_TAG" != "$tag_prefix"* ]] || ! [[ "$rc_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v${VERSION}-rc.N" >&2
            exit 1
          fi
          if ! [[ "$STAGING_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - name: Install system dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages ca-certificates curl build-essential pkg-config libssl-dev git file python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.91.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify release candidate provenance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          tag_ref="refs/tags/$RC_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{}")" = "$RC_SHA"

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v8.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stage-rust1.91.0-linux-x86_64-cuda-sm89-cuda12.4-native-d4cdfe88-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stage-rust1.91.0-linux-x86_64-cuda-sm89-cuda12.4-native-d4cdfe88-cargo-

      - name: Build release metadata tool once
        run: cargo build --release --locked -p ferrum-bench-core --example release_candidate

      - name: Verify all workspace release versions
        run: |
          ./target/release/examples/release_candidate verify \
            --workspace . --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build release CUDA sm89 binary exactly once
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --release --locked -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Strip and audit CUDA binary
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-linux-x86_64-cuda-sm89.dependencies.txt
          ldd target/release/ferrum | tee -a ferrum-linux-x86_64-cuda-sm89.dependencies.txt

      - name: Package staged CUDA asset and adjacent manifests
        run: |
          asset="ferrum-linux-x86_64-cuda-sm89.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cat LICENSE crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml > dist/LICENSE
          cp README.md dist/README.md
          cat > dist/CUDA-BUILD.txt <<EOF
          Ferrum v${VERSION} CUDA release binary
          CUDA toolkit image: nvidia/cuda:12.4.0-devel-ubuntu22.04
          CUDA_COMPUTE_CAP: 89
          Cargo features: cuda,vllm-moe-marlin,vllm-paged-attn-v2
          NVIDIA driver, compatible CUDA runtime, and NCCL runtime are required.
          EOF
          tar -C dist -czf "$asset" ferrum LICENSE README.md CUDA-BUILD.txt
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend cuda --target-triple x86_64-unknown-linux-gnu \
            --asset "$asset" --binary target/release/ferrum \
            --dependencies ferrum-linux-x86_64-cuda-sm89.dependencies.txt \
            --cargo-features cuda,vllm-moe-marlin,vllm-paged-attn-v2 \
            --cuda-compute-capability "$CUDA_COMPUTE_CAP" \
            --cuda-toolkit-image nvidia/cuda:12.4.0-devel-ubuntu22.04

      - name: Deferred CUDA smoke contract
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-linux-x86_64-cuda-sm89.tar.gz
          if ldconfig -p 2>/dev/null | grep -q 'libcuda.so.1'; then
            version_output="$(LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --version)"
            printf '%s\n' "$version_output"
            test "$version_output" = "ferrum $VERSION"
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --help >/dev/null
          else
            echo "Executable smoke is deferred to the exact staged-byte GPU gate."
            ldd ./smoke/ferrum
          fi

      - name: Upload staged CUDA asset
        id: asset_id
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64-cuda-sm89-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-linux-x86_64-cuda-sm89.tar.gz
            ferrum-linux-x86_64-cuda-sm89.tar.gz.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.binary.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.version.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.dependency.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json
            ferrum-linux-x86_64-cuda-sm89.dependencies.txt

  linux-x86_64-cuda-sm120:
    if: inputs.platform != 'windows'
    outputs:
      asset_id: ${{ steps.asset_id.outputs.artifact-id }}
    name: Stage Linux x86_64 CUDA SM120 production
    runs-on: ubuntu-24.04
    env:
      CUDA_COMPUTE_CAP: 120
      # Immutable production source-plan/catalog baseline. The complete set is
      # rebuilt with FP8 below; this older binary set is never the final input.
      NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.8-sm120-v4/native-operator-set-cuda12.8-sm120-v4.tar.zst
      NATIVE_OPERATOR_SET_ARCHIVE_SHA256: 5283c1fcdcabdcd1aab7058f8c1f2676c48d8b99b50f8b116f737816199e88ec
      NATIVE_REFERENCE_REVISION: 37617964f3ed9fd1c191a51a14c94721c7ff4f58
      LLAMA_NATIVE_REVISION: d81235049384534c167caea52b85a694f6103d14
      CUTLASS_REVISION: cb4247394dd82148787aed73e5dc7cef33cbf862
      CUTLASS_ARCHIVE_SHA256: 7a37329b43a47aaf9ef142be99baff3e71dbeea007b975891350cc0e50bc598b
    timeout-minutes: 240
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
    steps:
      - name: Validate immutable staging inputs
        run: |
          case "$STAGING_PLATFORM" in all|linux) ;; *) echo 'Invalid staging platform' >&2; exit 1;; esac
          if [[ "$PUBLISH_RELEASE" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "$RC_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "release_candidate_sha must be a full lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a formal MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          tag_prefix="v${VERSION}-rc."
          rc_number="${RC_TAG#"$tag_prefix"}"
          if [[ "$RC_TAG" != "$tag_prefix"* ]] || ! [[ "$rc_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v${VERSION}-rc.N" >&2
            exit 1
          fi
          if ! [[ "$STAGING_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - name: Validate bound SM120 native archive
        run: |
          if ! [[ "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'SM120 native archive SHA256 has not been bound to verified release bytes' >&2
            exit 1
          fi
          case "$NATIVE_OPERATOR_SET_ARCHIVE_URL" in
            https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.8-sm120-v4/native-operator-set-cuda12.8-sm120-v4.tar.zst) ;;
            *) echo 'Unexpected SM120 native archive source' >&2; exit 1;;
          esac

      - name: Install system dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages ca-certificates curl build-essential gcc-13 g++-13 pkg-config libssl-dev git file python3 jq zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.91.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify release candidate provenance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          tag_ref="refs/tags/$RC_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{}")" = "$RC_SHA"

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.8-sm120-v4.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/native-operator-set.lock.json"
          test -f "$lock"
          echo "SM120_REFERENCE_LOCK=$lock" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stage-rust1.91.0-linux-x86_64-cuda-sm120-cuda12.8-native-sm120-v4-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stage-rust1.91.0-linux-x86_64-cuda-sm120-cuda12.8-native-sm120-v4-cargo-

      - name: Restore locked native object cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sm120-native-object-cache
          key: sm120-native-cuda12.8.1-gcc13-production-fp8-${{ hashFiles('crates/ferrum-native-ops-builder/**', 'crates/ferrum-native-ops/**', 'native-operators/**') }}
          restore-keys: |
            sm120-native-cuda12.8.1-gcc13-production-fp8-

      - name: Prepare pinned native sources and source catalog
        run: |
          work="$RUNNER_TEMP/sm120-native"
          mkdir "$work"
          cargo build --locked --profile release-tools -p ferrum-native-ops-builder --example release_sm120_native --bin ferrum-native-ops-builder
          cargo build --locked --profile release-tools -p ferrum-kernels --example cutlass_fp8_catalog_declaration
          ./target/release-tools/examples/release_sm120_native reference \
            --lock "$SM120_REFERENCE_LOCK" --catalog-output "$work/base-catalog.json"
          # The catalog configuration is explicit source provenance, not a
          # measured native-memory upper bound or a runtime capacity override.
          ./target/release-tools/examples/cutlass_fp8_catalog_declaration \
            134217728 512 experimental-release-source-declaration-v1 \
            "$work/combined-catalog.json" "$work/base-catalog.json"
          mkdir "$work/reference-workspace" "$work/source-bundle" "$work/fp8-source"
          git archive "$NATIVE_REFERENCE_REVISION" | tar -xf - -C "$work/reference-workspace"
          manifest=native-operators/cuda/source-bundles/ferrum-native-cuda-v1.json
          source_url=$(jq -er '"https://github.com/" + .distribution.repository + "/releases/download/" + .distribution.tag + "/" + .distribution.asset_name' "$manifest")
          source_sha=$(jq -er '.archive.sha256' "$manifest")
          curl --fail --location --retry 5 --retry-all-errors --output "$work/native-sources.tar.gz" "$source_url"
          printf '%s  %s\n' "$source_sha" "$work/native-sources.tar.gz" | sha256sum --check --strict
          tar -xzf "$work/native-sources.tar.gz" -C "$work/source-bundle"
          git init "$work/llama"
          git -C "$work/llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$work/llama" fetch --depth 1 origin "$LLAMA_NATIVE_REVISION"
          git -C "$work/llama" checkout --detach FETCH_HEAD
          test "$(git -C "$work/llama" rev-parse HEAD)" = "$LLAMA_NATIVE_REVISION"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$work/cutlass.tar.gz" "https://codeload.github.com/NVIDIA/cutlass/tar.gz/$CUTLASS_REVISION"
          printf '%s  %s\n' "$CUTLASS_ARCHIVE_SHA256" "$work/cutlass.tar.gz" | sha256sum --check --strict
          mkdir "$work/fp8-source/cutlass" "$work/fp8-source/kernels"
          tar -xzf "$work/cutlass.tar.gz" --strip-components=1 -C "$work/fp8-source/cutlass"
          for source in abi.h boundary.cu gemm.cuh quantize.cuh; do
            cp "crates/ferrum-kernels/native/cutlass-fp8/$source" "$work/fp8-source/kernels/$source"
          done
          /usr/local/cuda/bin/nvcc -M -MT boundary.o -MF "$work/fp8.d" \
            -std=c++17 -O3 --expt-relaxed-constexpr --expt-extended-lambda \
            -Xcompiler -fPIC -arch=sm_120a -ccbin /usr/bin/g++-13 \
            -I"$work/fp8-source/cutlass/include" -I"$work/fp8-source/cutlass/tools/util/include" \
            -I"$work/fp8-source/kernels" "$work/fp8-source/kernels/boundary.cu"
          ./target/release-tools/ferrum-native-ops-builder lock-source-dependencies \
            --definition crates/ferrum-kernels/native/cutlass-fp8/cutlass-fp8.seed.json \
            --source-root "$work/fp8-source" --depfile "$work/fp8.d" \
            --out-definition "$work/fp8-observed.json" --out-plan "$work/fp8-plan.json"

      - name: Build and verify complete SM120 production and FP8 native set
        run: |
          work="$RUNNER_TEMP/sm120-native"
          ./target/release-tools/examples/release_sm120_native build \
            --reference-lock "$SM120_REFERENCE_LOCK" --reference-workspace "$work/reference-workspace" \
            --source-bundle "$work/source-bundle" --llama-source "$work/llama" \
            --workspace "$GITHUB_WORKSPACE" --catalog "$work/combined-catalog.json" \
            --fp8-source "$work/fp8-source" --fp8-plan "$work/fp8-plan.json" \
            --work "$work/builds" --output "$work/operator-set" \
            --object-cache "$RUNNER_TEMP/sm120-native-object-cache" --builder-sha "$RC_SHA" \
            --cuda-toolkit-root /usr/local/cuda --nvcc /usr/local/cuda/bin/nvcc \
            --cc /usr/bin/gcc-13 --cxx /usr/bin/g++-13 --ar /usr/bin/ar
          lock="$work/operator-set/native-operator-set.lock.json"
          ./target/release-tools/examples/release_sm120_native verify --lock "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"
          # Preserve the actual new set and all package/build receipts. No
          # public release is created here; the staged CLI links these bytes.
          tar -C "$work/operator-set" -cf - . | zstd -T1 -o "$work/native-operator-set-sm120-production-fp8.tar.zst"
          (cd "$work" && sha256sum native-operator-set-sm120-production-fp8.tar.zst > native-operator-set-sm120-production-fp8.tar.zst.sha256)

      - name: Preserve staged native operator set
        uses: actions/upload-artifact@v4
        with:
          name: native-sm120-production-fp8-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/sm120-native/native-operator-set-sm120-production-fp8.tar.zst
            ${{ runner.temp }}/sm120-native/native-operator-set-sm120-production-fp8.tar.zst.sha256
            ${{ runner.temp }}/sm120-native/fp8-observed.json

      - name: Build release metadata tool once
        run: cargo build --release --locked -p ferrum-bench-core --example release_candidate

      - name: Verify all workspace release versions
        run: |
          ./target/release/examples/release_candidate verify \
            --workspace . --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build release CUDA sm120 binary exactly once
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --release --locked -p ferrum-cli --bin ferrum \
            --features cuda,cuda-production,cuda-cutlass-fp8

      - name: Strip and audit CUDA binary
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-linux-x86_64-cuda-sm120.dependencies.txt
          ldd target/release/ferrum | tee -a ferrum-linux-x86_64-cuda-sm120.dependencies.txt

      - name: Assemble SM120 distribution licenses from the pinned native packages
        run: |
          mkdir -p dist
          cat LICENSE crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml > dist/LICENSE
          native_set_root=$(dirname "$FERRUM_NATIVE_OPERATOR_SET_LOCK")
          for native_license in "$native_set_root"/packages/*/licenses/*.txt; do
            test -f "$native_license"
            printf '\n--- %s ---\n' "${native_license#"$native_set_root/"}" >> dist/LICENSE
            cat "$native_license" >> dist/LICENSE
          done

      - name: Package staged CUDA asset and adjacent manifests
        run: |
          asset="ferrum-linux-x86_64-cuda-sm120.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cp README.md dist/README.md
          cat > dist/CUDA-BUILD.txt <<EOF
          Ferrum v${VERSION} CUDA release binary
          CUDA toolkit image: nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
          CUDA_COMPUTE_CAP: 120
          Cargo features: cuda,cuda-production,cuda-cutlass-fp8
          Native production source baseline: ${NATIVE_OPERATOR_SET_ARCHIVE_URL}
          Native production source baseline SHA256: ${NATIVE_OPERATOR_SET_ARCHIVE_SHA256}
          Native operator set: rebuilt from locked production source plans plus pinned CUTLASS FP8
          Native operator archive SHA256: $(cut -d ' ' -f 1 "$RUNNER_TEMP/sm120-native/native-operator-set-sm120-production-fp8.tar.zst.sha256")
          CUTLASS revision: ${CUTLASS_REVISION}
          CUTLASS source archive SHA256: ${CUTLASS_ARCHIVE_SHA256}
          Native operator lock SHA256: $(sha256sum "$FERRUM_NATIVE_OPERATOR_SET_LOCK" | cut -d ' ' -f 1)
          NVIDIA driver, compatible CUDA 12.8 runtime, and NCCL runtime are required.
          EOF
          tar -C dist -czf "$asset" ferrum LICENSE README.md CUDA-BUILD.txt
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend cuda --target-triple x86_64-unknown-linux-gnu \
            --asset "$asset" --binary target/release/ferrum \
            --dependencies ferrum-linux-x86_64-cuda-sm120.dependencies.txt \
            --cargo-features cuda,cuda-production,cuda-cutlass-fp8 \
            --cuda-compute-capability "$CUDA_COMPUTE_CAP" \
            --cuda-toolkit-image nvidia/cuda:12.8.1-devel-ubuntu24.04@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66

      - name: CUDA package loadability scope
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-linux-x86_64-cuda-sm120.tar.gz
          if ldconfig -p 2>/dev/null | grep -q 'libcuda.so.1'; then
            version_output="$(LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --version)"
            printf '%s\n' "$version_output"
            test "$version_output" = "ferrum $VERSION"
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --help >/dev/null
          else
            echo "SM120 executable smoke: not_run (hardware unavailable in the approved fleet); archive and ABI inspection remain required."
            ldd ./smoke/ferrum
          fi

      - name: Upload staged CUDA asset
        id: asset_id
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64-cuda-sm120-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-linux-x86_64-cuda-sm120.tar.gz
            ferrum-linux-x86_64-cuda-sm120.tar.gz.sha256
            ferrum-linux-x86_64-cuda-sm120.tar.gz.binary.sha256
            ferrum-linux-x86_64-cuda-sm120.tar.gz.version.json
            ferrum-linux-x86_64-cuda-sm120.tar.gz.dependency.json
            ferrum-linux-x86_64-cuda-sm120.tar.gz.abi.json
            ferrum-linux-x86_64-cuda-sm120.dependencies.txt

  windows-x86_64-cuda-sm89:
    if: inputs.platform != 'linux'
    uses: ./.github/workflows/release-windows.yml
    with:
      backend: cuda
      version: ${{ inputs.version }}
      release_candidate_sha: ${{ inputs.release_candidate_sha }}
      release_candidate_tag: ${{ inputs.release_candidate_tag }}
      staging_label: ${{ inputs.staging_label }}
      publish_release: ${{ inputs.publish_release }}
      windows_launcher_url: ${{ inputs.windows_launcher_url }}
      windows_launcher_sha256: ${{ inputs.windows_launcher_sha256 }}
