name: Stage CUDA sm89 release assets

on:
  workflow_call:
    inputs:
      platform:
        description: Stage all platforms, linux, or windows independently
        type: string
        default: all
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        type: boolean
      windows_launcher_url:
        description: Immutable released launcher URL; empty only for its first issuance
        required: false
        default: ''
        type: string
      windows_launcher_sha256:
        description: SHA256 paired with windows_launcher_url; the launcher is reused unchanged
        required: false
        default: ''
        type: string
    outputs:
      cuda_asset_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.linux-x86_64-cuda-sm89.outputs.asset_id }}
      windows_asset_id:
        description: Windows ZIP, installer, stable launcher and staging byte receipts
        value: ${{ jobs.windows-x86_64-cuda-sm89.outputs.asset_id }}
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to stage
        type: choice
        default: all
        options: [all, linux, windows]
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        default: false
        type: boolean
      windows_launcher_url:
        description: Immutable released launcher URL; empty only for its first issuance
        required: false
        default: ''
        type: string
      windows_launcher_sha256:
        description: SHA256 paired with windows_launcher_url; the launcher is reused unchanged
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  STAGING_PLATFORM: ${{ inputs.platform }}
  VERSION: ${{ inputs.version }}
  RC_SHA: ${{ inputs.release_candidate_sha }}
  RC_TAG: ${{ inputs.release_candidate_tag }}
  STAGING_LABEL: ${{ inputs.staging_label }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  CUDA_HOME: /usr/local/cuda
  CUDA_ROOT: /usr/local/cuda
  CUDA_COMPUTE_CAP: 89
  # Build-time, content-addressed component. The staged ferrum binary links
  # these operators statically and performs no runtime download.
  NATIVE_OPERATOR_SET_ARCHIVE_URL: https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst
  NATIVE_OPERATOR_SET_ARCHIVE_SHA256: d4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e

jobs:
  linux-x86_64-cuda-sm89:
    if: inputs.platform != 'windows'
    outputs:
      asset_id: ${{ steps.asset_id.outputs.artifact-id }}
    name: Stage Linux x86_64 CUDA sm89
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    container:
      image: nvidia/cuda:12.4.0-devel-ubuntu22.04
    steps:
      - name: Validate immutable staging inputs
        run: |
          case "$STAGING_PLATFORM" in all|linux) ;; *) echo 'Invalid staging platform' >&2; exit 1;; esac
          if [[ "$PUBLISH_RELEASE" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "$RC_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "release_candidate_sha must be a full lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a formal MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          tag_prefix="v${VERSION}-rc."
          rc_number="${RC_TAG#"$tag_prefix"}"
          if [[ "$RC_TAG" != "$tag_prefix"* ]] || ! [[ "$rc_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v${VERSION}-rc.N" >&2
            exit 1
          fi
          if ! [[ "$STAGING_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - name: Install system dependencies and Rust
        run: |
          apt-get update
          apt-get install -y --allow-change-held-packages ca-certificates curl build-essential pkg-config libssl-dev git file python3 zstd libnccl2 libnccl-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.91.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify release candidate provenance
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          tag_ref="refs/tags/$RC_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{}")" = "$RC_SHA"

      - name: Materialize pinned CUDA native operator set
        run: |
          archive="$RUNNER_TEMP/native-operator-set-cuda12.4-sm89-v6.tar.zst"
          root="$RUNNER_TEMP/ferrum-native-operator-set"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$archive" "$NATIVE_OPERATOR_SET_ARCHIVE_URL"
          printf '%s  %s\n' "$NATIVE_OPERATOR_SET_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$root"
          lock="$root/inputs/native-operator-set.lock.json"
          test -f "$lock"
          echo "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: stage-rust1.91.0-linux-x86_64-cuda-sm89-cuda12.4-native-d4cdfe88-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stage-rust1.91.0-linux-x86_64-cuda-sm89-cuda12.4-native-d4cdfe88-cargo-

      - name: Build release metadata tool once
        run: cargo build --release --locked -p ferrum-bench-core --example release_candidate

      - name: Verify all workspace release versions
        run: |
          ./target/release/examples/release_candidate verify \
            --workspace . --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build release CUDA sm89 binary exactly once
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/cuda/bin:$PATH"
          export LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}"
          test -n "$FERRUM_NATIVE_OPERATOR_SET_LOCK"
          cargo build --release --locked -p ferrum-cli --bin ferrum \
            --features cuda,vllm-moe-marlin,vllm-paged-attn-v2

      - name: Strip and audit CUDA binary
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-linux-x86_64-cuda-sm89.dependencies.txt
          ldd target/release/ferrum | tee -a ferrum-linux-x86_64-cuda-sm89.dependencies.txt

      - name: Package staged CUDA asset and adjacent manifests
        run: |
          asset="ferrum-linux-x86_64-cuda-sm89.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cat LICENSE crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml > dist/LICENSE
          cp README.md dist/README.md
          cat > dist/CUDA-BUILD.txt <<EOF
          Ferrum v${VERSION} CUDA release binary
          CUDA toolkit image: nvidia/cuda:12.4.0-devel-ubuntu22.04
          CUDA_COMPUTE_CAP: 89
          Cargo features: cuda,vllm-moe-marlin,vllm-paged-attn-v2
          NVIDIA driver, compatible CUDA runtime, and NCCL runtime are required.
          EOF
          tar -C dist -czf "$asset" ferrum LICENSE README.md CUDA-BUILD.txt
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend cuda --target-triple x86_64-unknown-linux-gnu \
            --asset "$asset" --binary target/release/ferrum \
            --dependencies ferrum-linux-x86_64-cuda-sm89.dependencies.txt \
            --cargo-features cuda,vllm-moe-marlin,vllm-paged-attn-v2 \
            --cuda-compute-capability "$CUDA_COMPUTE_CAP" \
            --cuda-toolkit-image nvidia/cuda:12.4.0-devel-ubuntu22.04

      - name: Deferred CUDA smoke contract
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-linux-x86_64-cuda-sm89.tar.gz
          if ldconfig -p 2>/dev/null | grep -q 'libcuda.so.1'; then
            version_output="$(LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --version)"
            printf '%s\n' "$version_output"
            test "$version_output" = "ferrum $VERSION"
            LD_LIBRARY_PATH="/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" ./smoke/ferrum --help >/dev/null
          else
            echo "Executable smoke is deferred to the exact staged-byte GPU gate."
            ldd ./smoke/ferrum
          fi

      - name: Upload staged CUDA asset
        id: asset_id
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64-cuda-sm89-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-linux-x86_64-cuda-sm89.tar.gz
            ferrum-linux-x86_64-cuda-sm89.tar.gz.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.binary.sha256
            ferrum-linux-x86_64-cuda-sm89.tar.gz.version.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.dependency.json
            ferrum-linux-x86_64-cuda-sm89.tar.gz.abi.json
            ferrum-linux-x86_64-cuda-sm89.dependencies.txt

  windows-x86_64-cuda-sm89:
    if: inputs.platform != 'linux'
    name: Stage Windows x86_64 CUDA sm89
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      asset_id: ${{ steps.windows_assets.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    env:
      WINDOWS_LAUNCHER_URL: ${{ inputs.windows_launcher_url }}
      WINDOWS_LAUNCHER_SHA256: ${{ inputs.windows_launcher_sha256 }}
      CUDA_COMPUTE_CAP: '89'
      CARGO_BUILD_JOBS: '4'
    steps:
      - name: Validate immutable Windows staging inputs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:STAGING_PLATFORM -notin @('all', 'windows')) { throw 'Invalid staging platform' }
          if ($env:PUBLISH_RELEASE -ne 'false') { throw 'This workflow only stages bytes' }
          if ($env:RC_SHA -cnotmatch '^([0-9a-f]{40}|[0-9a-f]{64})$') { throw 'A full candidate SHA is required' }
          if ($env:VERSION -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'A formal version is required' }
          if ($env:RC_TAG -cnotmatch ('^v' + [regex]::Escape($env:VERSION) + '-rc\.[1-9][0-9]*$')) { throw 'Candidate tag/version mismatch' }
          if ($env:STAGING_LABEL -notmatch '^[A-Za-z0-9._-]+$') { throw 'Invalid staging label' }
          $hasUrl = -not [string]::IsNullOrEmpty($env:WINDOWS_LAUNCHER_URL)
          $hasHash = -not [string]::IsNullOrEmpty($env:WINDOWS_LAUNCHER_SHA256)
          if ($hasUrl -ne $hasHash) { throw 'Launcher URL and SHA256 must be supplied together' }
          if ($hasUrl) {
            $uri = [uri]$env:WINDOWS_LAUNCHER_URL
            if ($uri.Scheme -ne 'https' -or $uri.UserInfo -or $uri.Query -or $uri.Fragment -or
                $uri.Host -ne 'github.com' -or $uri.AbsolutePath -cnotmatch '^/sizzlecar/ferrum-infer-rs/releases/download/[^/]+/[^/]+$') {
              throw 'Use the immutable launcher asset URL from an existing Ferrum release'
            }
            if ($env:WINDOWS_LAUNCHER_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Invalid launcher SHA256' }
          } else {
            Write-Host 'First launcher issuance: build once from this candidate and preserve it as a release auxiliary asset.'
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Windows release candidate provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne $env:RC_SHA) { throw 'Checkout SHA mismatch' }
          $tag = "refs/tags/$env:RC_TAG"
          if ((git cat-file -t $tag) -ne 'tag') { throw 'Candidate tag must be annotated' }
          if ((git rev-parse "$tag^{}") -cne $env:RC_SHA) { throw 'Candidate tag commit mismatch' }
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Select a supported MSVC toolset and Windows SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio installation was not found' }
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -Like '14.38.*'
          if (-not $tools) {
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', ('"{0}"' -f $vs),
              '--add', 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64',
              '--quiet', '--norestart')
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSVC installation failed: $($process.ExitCode)" }
          }
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -Like '14.38.*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $tools) { throw 'CUDA 12.4 requires the selected MSVC 19.38 compiler' }
          $vcvars = "$vs\VC\Auxiliary\Build\vcvarsall.bat"
          $selected = & cmd.exe /d /s /c "call `"$vcvars`" amd64 10.0.22621.0 -vcvars_ver=14.38 >nul && set"
          foreach ($line in $selected) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|WindowsSdkDir|WindowsSdkVerBinPath|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $compilerBin = Join-Path $tools.FullName 'bin\Hostx64\x64'
          "CC=$compilerBin\cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=$compilerBin\cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NVCC_CCBIN=$compilerBin\cl.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FERRUM_MSVC_LIB=$compilerBin\lib.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$compilerBin\link.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FERRUM_VS_ROOT=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install CUDA compilation and runtime components
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Join-Path $env:RUNNER_TEMP 'cuda_12.4.1_windows.exe'
          curl.exe --fail --location --retry 3 --output $installer 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'NVIDIA') {
            throw 'CUDA installer does not have a valid NVIDIA signature'
          }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          $process = Start-Process $installer -Wait -PassThru -ArgumentList @(
            '-s', '-n', 'nvcc_12.4', 'cudart_12.4', 'cublas_12.4', 'cublas_dev_12.4',
            'nvrtc_12.4', 'nvrtc_dev_12.4', 'cuobjdump_12.4')
          if ($process.ExitCode -notin @(0, 3010)) { throw "CUDA installation failed: $($process.ExitCode)" }
          Remove-Item $installer
          $toolkit = "$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v12.4"
          & "$toolkit\bin\nvcc.exe" --version
          "CUDA_PATH=$toolkit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CUDA_HOME=$toolkit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CUDA_ROOT=$toolkit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$toolkit\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/cache/restore@v4
        id: windows_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: stage-windows-rust-msvc1938-cuda1241-${{ hashFiles('Cargo.lock', 'crates/ferrum-native-ops-builder/**', 'crates/ferrum-native-ops/**', 'native-operators/cuda/**') }}
          restore-keys: |
            stage-windows-rust-msvc1938-cuda1241-
            stage-windows-msvc1938-cuda1241-
      - uses: actions/cache/restore@v4
        id: windows_native_cache
        with:
          path: ~/ferrum-native-object-cache
          key: stage-windows-native-msvc1938-cuda1241-sm89-${{ hashFiles('crates/ferrum-native-ops-builder/**', 'native-operators/**') }}
          restore-keys: |
            stage-windows-native-msvc1938-cuda1241-sm89-
      - name: Verify selected Windows toolchain probes
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked -p ferrum-native-ops-builder --lib source_build::platform::msvc::tests::configured_ -- --ignored --nocapture
      - name: Build the Windows native operator builder
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p ferrum-native-ops-builder --bin ferrum-native-ops-builder
      - name: Build the four native CUDA operators with MSVC
        id: native_build
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $work = Join-Path $env:RUNNER_TEMP 'ferrum-windows-native'
          $source = Join-Path $work 'source'
          $reference = Join-Path $work 'reference'
          $set = Join-Path $work 'operator-set'
          New-Item -ItemType Directory -Force $source, $reference, $set | Out-Null
          $distribution = Get-Content 'native-operators/cuda/source-bundles/ferrum-native-cuda-v1.json' -Raw | ConvertFrom-Json
          $sourceArchive = Join-Path $work $distribution.archive.file_name
          $sourceUrl = 'https://github.com/{0}/releases/download/{1}/{2}' -f $distribution.distribution.repository, $distribution.distribution.tag, $distribution.distribution.asset_name
          curl.exe --fail --location --retry 3 --output $sourceArchive $sourceUrl
          if ((Get-FileHash $sourceArchive -Algorithm SHA256).Hash -ne $distribution.archive.sha256) { throw 'Native source archive hash mismatch' }
          tar.exe -xf $sourceArchive -C $source
          # Preserve this historical provider catalog as versioned binding provenance.
          # Windows packages separately pin their actual source plan and MSVC tools;
          # runtime compatibility checks the live provider contracts. No Linux code is linked.
          $referenceArchive = Join-Path $work 'reference.tar.zst'
          curl.exe --fail --location --retry 3 --output $referenceArchive 'https://github.com/sizzlecar/ferrum-infer-rs/releases/download/ferrum-native-cuda12.4-sm89-v6/native-operator-set-cuda12.4-sm89-v6.tar.zst'
          if ((Get-FileHash $referenceArchive -Algorithm SHA256).Hash -ne 'd4cdfe8818ed2071dbf8e2fcd3f12263a96f1cb32b542a2b161c99c9fc81584e') { throw 'Reference archive hash mismatch' }
          tar.exe -xf $referenceArchive -C $reference
          $referenceLockPath = Join-Path $reference 'inputs/native-operator-set.lock.json'
          $referenceLock = Get-Content $referenceLockPath -Raw | ConvertFrom-Json
          $catalog = Join-Path (Split-Path $referenceLockPath) $referenceLock.artifacts[0].g03_catalog.path
          if ((Get-FileHash $catalog -Algorithm SHA256).Hash -ne $referenceLock.g03_catalog_sha256) { throw 'Canonical provider catalog hash mismatch' }
          $builder = Join-Path $env:GITHUB_WORKSPACE 'target/debug/ferrum-native-ops-builder.exe'
          $builderSha = git rev-parse HEAD
          $receiptArgs = @()
          $failedOperators = @()
          '| Native operator | Cache hits | Compiled units | Build seconds |' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '| --- | ---: | ---: | ---: |' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($operator in @('marlin', 'vllm-marlin', 'vllm-moe-marlin', 'vllm-paged-attention-v2')) {
            Write-Host "Starting native operator: $operator"
            $build = Join-Path $work "build/$operator"
            $package = Join-Path $set "packages/$operator"
            $plan = Join-Path $work "$operator.plan.json"
            $spec = Join-Path $work "$operator.package.json"
            $stage = 'lock-source'
            try {
              & $builder lock-source --definition "native-operators/cuda/source-definitions/$operator.json" --source-root $source --out $plan
              $stage = 'source-build'
              & $builder source-build --plan $plan --source-root $source --out $build --compute-capability sm_89 --builder-sha $builderSha --nvcc "$env:CUDA_PATH/bin/nvcc.exe" --cuda-toolkit-root $env:CUDA_PATH --ccbin $env:NVCC_CCBIN --ar $env:FERRUM_MSVC_LIB --nvcc-threads 4 --object-cache "$env:USERPROFILE/ferrum-native-object-cache"
              $buildReceipt = Get-Content "$build/source-build.receipt.json" -Raw | ConvertFrom-Json
              $hits = @($buildReceipt.cache_hit_translation_units).Count
              $compiled = @($buildReceipt.compiled_translation_units).Count
              $seconds = [math]::Round($buildReceipt.elapsed_ms / 1000, 1)
              Write-Host "$operator completed: $hits object cache hits, $compiled compiled units, $seconds seconds"
              "| $operator | $hits | $compiled | $seconds |" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $stage = 'materialize-package-spec'
              & $builder materialize-package-spec --definition "native-operators/cuda/package-definitions/$operator.json" --g03-catalog $catalog --out $spec
              $stage = 'package'
              & $builder package --spec $spec --source-root $source --license-root $env:GITHUB_WORKSPACE --source-build-receipt "$build/source-build.receipt.json" --source-build-plan $plan --g03-catalog $catalog --abi-contract 'native-operators/abi/ferrum-native-abi-v2.json' --cc $env:CC --ar $env:FERRUM_MSVC_LIB --out $package
              $stage = 'package receipt'
              $receipt = Join-Path $package 'package.receipt.json'
              $receiptArgs += @('--receipt', $receipt, '--receipt-sha256', (Get-FileHash $receipt -Algorithm SHA256).Hash.ToLowerInvariant())
            } catch {
              $failedOperators += "$operator ($stage)"
              Write-Warning ("Native operator {0} failed during {1}: {2}" -f $operator, $stage, $_.Exception.Message)
              Write-Host $_.InvocationInfo.PositionMessage
            }
          }
          if ($failedOperators.Count -gt 0) {
            throw ("Native CUDA operator builds failed: {0}" -f ($failedOperators -join ', '))
          }
          $lock = Join-Path $set 'native-operator-set.lock.json'
          & $builder assemble-set @receiptArgs --g03-catalog-sha256 $referenceLock.g03_catalog_sha256 --compute-capability sm_89 --out $lock
          "FERRUM_NATIVE_OPERATOR_SET_LOCK=$lock" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Save native objects before Rust compilation and packaging
        if: ${{ always() && steps.native_build.outcome == 'success' && steps.windows_native_cache.outputs.cache-primary-key != '' && steps.windows_native_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/ferrum-native-object-cache
          key: ${{ steps.windows_native_cache.outputs.cache-primary-key }}
      - name: Build and preserve the CPU-only Windows executable
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:FERRUM_NATIVE_OPERATOR_SET_LOCK -ErrorAction SilentlyContinue
          cargo build --release --locked -p ferrum-cli --bin ferrum
          $cpu = Join-Path $env:RUNNER_TEMP 'windows-cpu-inputs'
          New-Item -ItemType Directory $cpu | Out-Null
          Copy-Item 'target/release/ferrum.exe' (Join-Path $cpu 'ferrum.exe')

      - name: Build release metadata and portable packaging tools
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked -p ferrum-bench-core --example release_candidate
          & './target/release/examples/release_candidate.exe' verify --workspace . --version $env:VERSION --candidate-sha $env:RC_SHA --candidate-tag $env:RC_TAG --staging-label $env:STAGING_LABEL --workflow-run-id $env:GITHUB_RUN_ID --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT
          cargo build --release --locked -p ferrum-devtools --bin release_delivery
      - name: Select the stable launcher
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # This binary has no CUDA features. Clear only this step's environment;
          # GITHUB_ENV still supplies the validated lock to the CUDA core step.
          Remove-Item Env:FERRUM_NATIVE_OPERATOR_SET_LOCK -ErrorAction SilentlyContinue
          $assets = Join-Path $env:RUNNER_TEMP 'windows-assets'
          New-Item -ItemType Directory $assets | Out-Null
          $launcher = Join-Path $assets 'ferrum-windows-launcher-v1.exe'
          if ($env:WINDOWS_LAUNCHER_URL) {
            curl.exe --fail --location --proto '=https' --retry 3 --output $launcher $env:WINDOWS_LAUNCHER_URL
            if ((Get-FileHash $launcher -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:WINDOWS_LAUNCHER_SHA256) { throw 'Stable launcher hash mismatch' }
            $origin = @{ mode = 'released'; url = $env:WINDOWS_LAUNCHER_URL; sha256 = $env:WINDOWS_LAUNCHER_SHA256 }
          } else {
            # Only the stable root launcher embeds its CRT. CUDA/native operators
            # retain the existing /MD contract and app-local runtime payload.
            cargo +1.91.0 rustc --release --locked -p ferrum-cli --bin ferrum-launcher -- -C target-feature=+crt-static
            Copy-Item 'target/release/ferrum-launcher.exe' $launcher
            $origin = @{ mode = 'first_issuance'; source_commit = $env:RC_SHA; sha256 = (Get-FileHash $launcher -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $dumpbin = Join-Path (Split-Path $env:CC) 'dumpbin.exe'
          $dependencies = & $dumpbin /nologo /dependents $launcher | Out-String
          $dependencies | Set-Content (Join-Path $assets 'launcher.dependencies.txt') -Encoding utf8NoBOM
          $dlls = @([regex]::Matches($dependencies, '(?im)^\s+([a-z0-9_.-]+\.dll)\s*$') |
            ForEach-Object { $_.Groups[1].Value.ToLowerInvariant() } | Sort-Object -Unique)
          if ($dlls.Count -eq 0) { throw 'The launcher PE dependency inventory is empty' }
          if (@($dlls | Where-Object { $_ -match '^(vcruntime|msvcp|msvcr|concrt|vcomp)[0-9][a-z0-9_]*\.dll$' }).Count -ne 0) {
            throw 'The stable root launcher must not require app-local VC runtime DLLs'
          }
          $origin.dependencies = $dlls
          $origin | ConvertTo-Json | Set-Content (Join-Path $assets 'launcher-origin.json') -Encoding utf8NoBOM
          "WINDOWS_LAUNCHER_PATH=$launcher" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the release Windows CUDA binary exactly once
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path $env:FERRUM_NATIVE_OPERATOR_SET_LOCK -PathType Leaf)) { throw 'The native operator set is missing' }
          # Keep this after every other Cargo build: a CPU/default build must never replace this EXE.
          cargo build --release --locked -p ferrum-cli --bin ferrum --features cuda,vllm-moe-marlin,vllm-paged-attn-v2
          & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-elf 'target/release/ferrum.exe'
          & "$env:CUDA_PATH/bin/cuobjdump.exe" --list-ptx 'target/release/ferrum.exe'
      - name: Install the pinned Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          curl.exe --fail --location --proto '=https' --retry 3 --output $installer 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno installer hash mismatch' }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'Pyrsys B.V.') { throw 'Inno publisher signature mismatch' }
          $root = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3'
          $log = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          $process = Start-Process $installer -Wait -PassThru -ArgumentList @('/PORTABLE=1', '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/TASKS=""', ('/DIR="{0}"' -f $root), ('/LOG="{0}"' -f $log))
          if ($process.ExitCode -ne 0) { throw "Inno installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $root 'ISCC.exe'
          if (-not (Test-Path $compiler -PathType Leaf)) { throw 'The pinned Inno installation did not produce ISCC.exe' }
          # ISCC has no usable PE version resource. Verify its real compiler banner
          # during the required successful compilation below, not via /? (exit 1).
          "ISCC=$compiler" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pack the exact release EXE and redistributable runtime bytes
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP 'windows-assets'
          $inputs = Join-Path $env:RUNNER_TEMP 'windows-runtime-inputs'
          New-Item -ItemType Directory $inputs | Out-Null
          # Preserve the original CUDA license from the pinned component archive.
          $cudart = Join-Path $inputs 'cudart.zip'
          curl.exe --fail --location --proto '=https' --retry 3 --output $cudart 'https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.4.127-archive.zip'
          if ((Get-FileHash $cudart -Algorithm SHA256).Hash -ne '6a1c32e68ee1a95ca17334691ff9ad1ffe7f352c24a083d55e4c96b8063b2bcb') { throw 'CUDA license archive hash mismatch' }
          tar.exe -xf $cudart -C $inputs 'cuda_cudart-windows-x86_64-12.4.127-archive/LICENSE'
          $cudaLicense = Join-Path $inputs 'cuda_cudart-windows-x86_64-12.4.127-archive/LICENSE'
          if ((Get-FileHash $cudaLicense -Algorithm SHA256).Hash -ne 'e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07') { throw 'CUDA license hash mismatch' }
          $vcLicense = Join-Path $inputs 'Microsoft-VC-Runtime-2015-2022-License.docx'
          curl.exe --fail --location --proto '=https' --retry 3 --output $vcLicense 'https://visualstudio.microsoft.com/wp-content/uploads/2021/09/Visual-C-Runtime-2015-2022-License-1.docx'
          if ((Get-FileHash $vcLicense -Algorithm SHA256).Hash -ne 'f1e3d56ceb2ad68aae0711b910375009e651ac5530fa0760f0dea6e81e54fae1') { throw 'VC runtime license hash mismatch' }
          # Use release redistributables from VS, never System32 or debug_nonredist.
          # The runtime may be newer than the selected compiler; record its actual bytes.
          $redistVersion = Get-ChildItem "$env:FERRUM_VS_ROOT/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^14\.[0-9]+\.[0-9]+$' -and [version]$_.Name -ge [version]'14.38.0' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $redistVersion) { throw 'A compatible VS release CRT redistributable directory is required' }
          $crt = Join-Path $redistVersion.FullName 'x64/Microsoft.VC143.CRT'
          $files = [Collections.Generic.List[object]]::new()
          $sources = [ordered]@{}
          function Add-PayloadFile([string]$Name, [string]$Role, [string]$Source, $License) {
            $file = Get-Item -LiteralPath $Source
            if ($file.PSIsContainer) { throw "Payload input is not a file: $Source" }
            $sources[$Name] = $file.FullName
            $files.Add([ordered]@{ path = $Name; role = $Role; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size_bytes = $file.Length; license = $License })
          }
          Add-PayloadFile 'ferrum.exe' 'binary' 'target/release/ferrum.exe' 'licenses/Ferrum.txt'
          $cudaHashes = [ordered]@{
            'cudart64_12.dll' = 'd28e42265da7462162a54da6b7a99ea4fa2caf8139d862bb500db875d0b32dfc'
            'cublas64_12.dll' = 'e40202fe4223c1cd2d2dce7beec59e1ed61c7801bd827309183be9b50e358f4c'
            'cublasLt64_12.dll' = '2a896460bef60ed57ef32b0875812f355a6984e671d638bb632f5e8c1d7a831f'
          }
          foreach ($name in $cudaHashes.Keys) {
            $path = Join-Path $env:CUDA_PATH "bin/$name"
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $cudaHashes[$name]) { throw "CUDA runtime version/hash mismatch: $name" }
            Add-PayloadFile $name 'cuda_runtime' $path 'licenses/CUDA.txt'
          }
          foreach ($name in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            Add-PayloadFile $name 'msvc_runtime' (Join-Path $crt $name) 'licenses/Microsoft-VC-Runtime-2015-2022-License.docx'
          }
          Add-PayloadFile 'licenses/Ferrum.txt' 'license' 'LICENSE' $null
          Add-PayloadFile 'licenses/ggml.txt' 'license' 'crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml' $null
          Add-PayloadFile 'licenses/CUDA.txt' 'license' $cudaLicense $null
          Add-PayloadFile 'licenses/Microsoft-VC-Runtime-2015-2022-License.docx' 'license' $vcLicense $null
          Add-PayloadFile 'licenses/Apache-2.0.txt' 'license' 'native-operators/licenses/Apache-2.0.txt' $null
          $spec = [ordered]@{
            manifest = [ordered]@{
              schema_version = 1
              build = @{ version = $env:VERSION; source_commit = $env:RC_SHA; build_id = "github-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" }
              backend = 'cuda'; target_triple = 'x86_64-pc-windows-msvc'; cuda_compute_capability = '89'
              cargo_features = @('cuda', 'vllm-moe-marlin', 'vllm-paged-attn-v2'); files = @($files.ToArray())
            }
            sources = $sources
          }
          $specPath = Join-Path $inputs 'portable-spec.json'
          $spec | ConvertTo-Json -Depth 20 | Set-Content $specPath -Encoding utf8NoBOM
          $archive = Join-Path $assets 'ferrum-windows-x86_64-cuda-sm89.zip'
          $receipt = "$archive.receipt.json"
          & './target/release/release_delivery.exe' portable pack --spec $specPath --archive $archive --receipt $receipt
          $payload = Join-Path $env:RUNNER_TEMP 'windows-payload'
          $inspectionArgs = @('--archive', $archive, '--receipt', $receipt, '--extract-dir', $payload,
            '--output', (Join-Path $assets 'portable.staging-inspection.json'))
          # The core imports the system NVIDIA driver. Match Linux staging's
          # deferred smoke policy when this build host has no driver; never bundle
          # a driver or label byte-only inspection as --version/--help execution.
          $driverPresent = Test-Path (Join-Path $env:SystemRoot 'System32/nvcuda.dll') -PathType Leaf
          if (-not $driverPresent) {
            $inspectionArgs += '--extract-only'
            Write-Host 'No system NVIDIA driver: executable startup checks are deferred; archive bytes are verified.'
          }
          & './target/release/release_delivery.exe' portable inspect @inspectionArgs
          "WINDOWS_PAYLOAD=$payload" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $provenance = [ordered]@{
            schema_version = 1; version = $env:VERSION; candidate_sha = $env:RC_SHA; candidate_tag = $env:RC_TAG
            staging_label = $env:STAGING_LABEL; workflow_run_id = [uint64]$env:GITHUB_RUN_ID; workflow_run_attempt = [uint64]$env:GITHUB_RUN_ATTEMPT
            scope = $(if ($driverPresent) { 'staged_bytes_and_startup' } else { 'staged_bytes_only' })
            cuda_toolkit = '12.4.1'; crt_directory = $crt
            native_operator_set_sha256 = (Get-FileHash $env:FERRUM_NATIVE_OPERATOR_SET_LOCK -Algorithm SHA256).Hash.ToLowerInvariant()
            binary_sha256 = $files[0].sha256
            manifest_sha256 = (Get-FileHash (Join-Path $payload 'ferrum-portable.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            launcher_sha256 = (Get-FileHash $env:WINDOWS_LAUNCHER_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            iscc_sha256 = (Get-FileHash $env:ISCC -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $provenance | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $assets 'windows-staging.json') -Encoding utf8NoBOM
          # Keep actual ordinary/delay import text for the native runtime-closure audit.
          $dumpbin = Join-Path (Split-Path $env:CC) 'dumpbin.exe'
          foreach ($entry in $sources.GetEnumerator()) {
            if ($entry.Key -eq 'ferrum.exe' -or $entry.Key.EndsWith('.dll')) {
              & $dumpbin /nologo /headers /imports $entry.Value | Set-Content (Join-Path $assets ($entry.Key + '.pe.txt')) -Encoding utf8NoBOM
            }
          }
          & $dumpbin /nologo /headers /imports $env:WINDOWS_LAUNCHER_PATH | Set-Content (Join-Path $assets 'launcher.pe.txt') -Encoding utf8NoBOM
      - name: Wrap the verified payload in the versioned current-user installer
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP 'windows-assets'
          & $env:ISCC "/DPayloadDir=$env:WINDOWS_PAYLOAD" "/DLauncherPath=$env:WINDOWS_LAUNCHER_PATH" "/DAppVersion=$env:VERSION" "/O$assets" 'packaging/windows/ferrum.iss' | Tee-Object -FilePath (Join-Path $assets 'iscc-build.log')
          if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed: $LASTEXITCODE" }
          $compilerLog = Get-Content (Join-Path $assets 'iscc-build.log') -Raw
          if ($compilerLog -cnotmatch '(?m)^Compiler engine version: Inno Setup (6\.7\.3)\r?$') { throw 'ISCC compiler banner/version mismatch' }
          $compilerVersion = $Matches[1]
          $provenancePath = Join-Path $assets 'windows-staging.json'
          $provenance = Get-Content $provenancePath -Raw | ConvertFrom-Json -AsHashtable
          $provenance.iscc_version = $compilerVersion
          $setup = Join-Path $assets "ferrum-$env:VERSION-windows-x86_64-cuda-sm89-setup.exe"
          if (-not (Test-Path $setup -PathType Leaf)) { throw 'ISCC did not produce the versioned installer' }
          foreach ($entry in @(@('archive', 'ferrum-windows-x86_64-cuda-sm89.zip'), @('setup', (Split-Path $setup -Leaf)), @('launcher', 'ferrum-windows-launcher-v1.exe'))) {
            $file = Get-Item -LiteralPath (Join-Path $assets $entry[1])
            $provenance[$entry[0]] = @{ name = $file.Name; size_bytes = $file.Length; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $provenance | ConvertTo-Json -Depth 10 | Set-Content $provenancePath -Encoding utf8NoBOM
          foreach ($file in Get-ChildItem $assets -File | Where-Object { $_.Extension -in @('.exe', '.zip') }) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content ($file.FullName + '.sha256') -Encoding ascii
          }
      - name: Package and execute the Windows CPU installer payload
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $assets = Join-Path $env:RUNNER_TEMP 'windows-assets/cpu'
          New-Item -ItemType Directory $assets | Out-Null
          $binary = Join-Path $env:RUNNER_TEMP 'windows-cpu-inputs/ferrum.exe'
          $spec = Get-Content (Join-Path $env:RUNNER_TEMP 'windows-runtime-inputs/portable-spec.json') -Raw | ConvertFrom-Json -AsHashtable
          $spec.manifest.backend = 'cpu'
          $spec.manifest.cuda_compute_capability = ''
          $spec.manifest.cargo_features = @()
          $spec.manifest.files = @($spec.manifest.files | Where-Object { $_.role -ne 'cuda_runtime' -and $_.path -ne 'licenses/CUDA.txt' })
          $binaryFile = $spec.manifest.files | Where-Object path -EQ 'ferrum.exe'
          $binaryFile.sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $binaryFile.size_bytes = (Get-Item $binary).Length
          $spec.sources['ferrum.exe'] = $binary
          foreach ($name in @($spec.sources.Keys)) {
            if ($name -notin $spec.manifest.files.path) { $spec.sources.Remove($name) }
          }
          $specPath = Join-Path $env:RUNNER_TEMP 'windows-cpu-inputs/portable-spec.json'
          $spec | ConvertTo-Json -Depth 20 | Set-Content $specPath -Encoding utf8NoBOM
          $archive = Join-Path $assets 'ferrum-windows-x86_64-cpu.zip'
          & './target/release/release_delivery.exe' portable pack --spec $specPath --archive $archive --receipt "$archive.receipt.json"
          $payload = Join-Path $env:RUNNER_TEMP 'windows-cpu-payload'
          & './target/release/release_delivery.exe' portable inspect --archive $archive --receipt "$archive.receipt.json" --extract-dir $payload --output (Join-Path $assets 'portable.staging-inspection.json')
          $dumpbin = Join-Path (Split-Path $env:CC) 'dumpbin.exe'
          foreach ($entry in $spec.sources.GetEnumerator()) {
            if ($entry.Key -eq 'ferrum.exe' -or $entry.Key.EndsWith('.dll')) {
              $imports = & $dumpbin /nologo /headers /imports $entry.Value | Out-String
              $imports | Set-Content (Join-Path $assets ($entry.Key + '.pe.txt')) -Encoding utf8NoBOM
              if ($imports -match '(?im)^\s*(nvcuda|cudart[^\s]*|cublas[^\s]*|nvrtc[^\s]*|cudnn[^\s]*)\.dll\s*$') { throw "CPU payload imports an NVIDIA runtime: $($entry.Key)" }
            }
          }
          Copy-Item $env:WINDOWS_LAUNCHER_PATH (Join-Path $assets 'ferrum-windows-launcher-v1.exe')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-assets/launcher-origin.json') (Join-Path $assets 'launcher-origin.json')
          & $env:ISCC '/DBackend=cpu' "/DPayloadDir=$payload" "/DLauncherPath=$env:WINDOWS_LAUNCHER_PATH" "/DAppVersion=$env:VERSION" "/O$assets" 'packaging/windows/ferrum.iss' | Tee-Object -FilePath (Join-Path $assets 'iscc-build.log')
          if ($LASTEXITCODE -ne 0) { throw "CPU ISCC compilation failed: $LASTEXITCODE" }
          $provenance = [ordered]@{
            schema_version = 1; version = $env:VERSION; candidate_sha = $env:RC_SHA; candidate_tag = $env:RC_TAG
            staging_label = $env:STAGING_LABEL; workflow_run_id = [uint64]$env:GITHUB_RUN_ID; workflow_run_attempt = [uint64]$env:GITHUB_RUN_ATTEMPT
            scope = 'staged_bytes_and_startup'
            binary_sha256 = $binaryFile.sha256
            manifest_sha256 = (Get-FileHash (Join-Path $payload 'ferrum-portable.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            launcher_sha256 = (Get-FileHash $env:WINDOWS_LAUNCHER_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            iscc_sha256 = (Get-FileHash $env:ISCC -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          foreach ($entry in @(@('archive', 'ferrum-windows-x86_64-cpu.zip'), @('setup', "ferrum-$env:VERSION-windows-x86_64-cpu-setup.exe"), @('launcher', 'ferrum-windows-launcher-v1.exe'))) {
            $file = Get-Item -LiteralPath (Join-Path $assets $entry[1])
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $provenance[$entry[0]] = @{ name = $file.Name; size_bytes = $file.Length; sha256 = $hash }
            "$hash  $($file.Name)" | Set-Content ($file.FullName + '.sha256') -Encoding ascii
          }
          $provenance | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $assets 'windows-staging.json') -Encoding utf8NoBOM

      - name: Upload Windows staged release assets
        id: windows_assets
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-windows-x86_64-cuda-sm89-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          path: ${{ runner.temp }}/windows-assets
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows staging build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-windows-build-evidence-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          path: |
            ${{ runner.temp }}/ferrum-windows-native/build
            ${{ runner.temp }}/ferrum-windows-native/operator-set
            ${{ runner.temp }}/windows-runtime-inputs/portable-spec.json
            ${{ runner.temp }}/windows-assets/*.json
            ${{ runner.temp }}/windows-assets/*.pe.txt
            ${{ runner.temp }}/windows-assets/launcher.dependencies.txt
            ${{ runner.temp }}/windows-assets/iscc-build.log
            ${{ runner.temp }}/inno-install.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save Windows staging build caches
        if: ${{ always() && steps.windows_cache.outputs.cache-primary-key != '' && steps.windows_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.windows_cache.outputs.cache-primary-key }}
