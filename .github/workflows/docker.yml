name: Docker distribution is disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported-distribution-notice:
    name: Confirm Docker distribution remains disabled
    runs-on: ubuntu-22.04
    steps:
      - name: Record unsupported distribution policy
        run: |
          echo "Ferrum v0.8.0 does not publish or promise an officially maintained Docker distribution."
          echo "Use the staged CPU, Metal, or CUDA tarball product paths instead."
