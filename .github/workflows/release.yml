name: Stage CPU and Metal release assets

on:
  workflow_call:
    inputs:
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        type: boolean
    outputs:
      linux_asset_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.linux-x86_64.outputs.asset_id }}
      linux_runner_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.linux-x86_64.outputs.runner_id }}
      metal_asset_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.macos-aarch64.outputs.asset_id }}
      metal_runner_id:
        description: Immutable uploaded artifact ID
        value: ${{ jobs.macos-aarch64.outputs.runner_id }}
      metal_controller_id:
        description: Immutable uploaded release controller artifact ID
        value: ${{ jobs.macos-aarch64.outputs.controller_id }}
  workflow_dispatch:
    inputs:
      version:
        description: Formal workspace and binary version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      release_candidate_sha:
        description: Exact release-candidate commit to build
        required: true
        type: string
      release_candidate_tag:
        description: Annotated RC tag whose peeled commit is release_candidate_sha
        required: true
        type: string
      staging_label:
        description: Immutable artifact label; this does not create a tag or release
        required: true
        type: string
      publish_release:
        description: Safety lock; production staging requires false
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version }}
  RC_SHA: ${{ inputs.release_candidate_sha }}
  RC_TAG: ${{ inputs.release_candidate_tag }}
  STAGING_LABEL: ${{ inputs.staging_label }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}

jobs:
  linux-x86_64:
    outputs:
      asset_id: ${{ steps.asset_id.outputs.artifact-id }}
      runner_id: ${{ steps.runner_id.outputs.artifact-id }}
    name: Stage Linux x86_64 CPU
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Validate immutable staging inputs
        run: |
          if [[ "$PUBLISH_RELEASE" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "$RC_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "release_candidate_sha must be a full lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a formal MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          tag_prefix="v${VERSION}-rc."
          rc_number="${RC_TAG#"$tag_prefix"}"
          if [[ "$RC_TAG" != "$tag_prefix"* ]] || ! [[ "$rc_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v${VERSION}-rc.N" >&2
            exit 1
          fi
          if ! [[ "$STAGING_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify release candidate provenance
        run: |
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          tag_ref="refs/tags/$RC_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{}")" = "$RC_SHA"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential file

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: stage-rust1.91.0-linux-x86_64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stage-rust1.91.0-linux-x86_64-

      - name: Build release metadata tool once
        run: cargo build --release --locked -p ferrum-bench-core --example release_candidate

      - name: Verify all workspace release versions
        run: |
          ./target/release/examples/release_candidate verify \
            --workspace . --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build release CPU binary and regression runner once
        run: cargo build --release --locked -p ferrum-cli -p ferrum-devtools --bin ferrum --bin model_regression

      - name: Strip and audit binary
        shell: bash
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-linux-x86_64.dependencies.txt
          ldd target/release/ferrum | tee -a ferrum-linux-x86_64.dependencies.txt

      - name: Package staged CPU asset and adjacent manifests
        shell: bash
        run: |
          asset="ferrum-linux-x86_64.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cat LICENSE crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml > dist/LICENSE
          cp README.md dist/README.md
          tar -C dist -czf "$asset" ferrum LICENSE README.md
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend cpu --target-triple x86_64-unknown-linux-gnu \
            --asset "$asset" --binary target/release/ferrum \
            --dependencies ferrum-linux-x86_64.dependencies.txt

      - name: Smoke test staged CPU binary
        shell: bash
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-linux-x86_64.tar.gz
          version_output="$(./smoke/ferrum --version)"
          printf '%s\n' "$version_output"
          test "$version_output" = "ferrum $VERSION"
          ./smoke/ferrum --help >/dev/null

      - name: Package Linux regression runner
        run: |
          tar -C target/release -czf model-regression-linux-x86_64.tar.gz model_regression
          sha256sum model-regression-linux-x86_64.tar.gz > model-regression-linux-x86_64.tar.gz.sha256
          sha256sum target/release/model_regression > model-regression-linux-x86_64.binary.sha256

      - name: Upload Linux regression runner
        id: runner_id
        uses: actions/upload-artifact@v4
        with:
          name: model-regression-linux-x86_64-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            model-regression-linux-x86_64.tar.gz
            model-regression-linux-x86_64.tar.gz.sha256
            model-regression-linux-x86_64.binary.sha256

      - name: Upload staged CPU asset
        id: asset_id
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-linux-x86_64.tar.gz
            ferrum-linux-x86_64.tar.gz.sha256
            ferrum-linux-x86_64.tar.gz.binary.sha256
            ferrum-linux-x86_64.tar.gz.version.json
            ferrum-linux-x86_64.tar.gz.dependency.json
            ferrum-linux-x86_64.tar.gz.abi.json
            ferrum-linux-x86_64.dependencies.txt

  macos-aarch64:
    outputs:
      asset_id: ${{ steps.asset_id.outputs.artifact-id }}
      runner_id: ${{ steps.runner_id.outputs.artifact-id }}
      controller_id: ${{ steps.controller_id.outputs.artifact-id }}
    name: Stage macOS aarch64 CPU and Metal
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Validate immutable staging inputs
        run: |
          if [[ "$PUBLISH_RELEASE" != "false" ]]; then
            echo "publish_release must remain false; this workflow only stages bytes" >&2
            exit 1
          fi
          if ! [[ "$RC_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "release_candidate_sha must be a full lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be a formal MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          tag_prefix="v${VERSION}-rc."
          rc_number="${RC_TAG#"$tag_prefix"}"
          if [[ "$RC_TAG" != "$tag_prefix"* ]] || ! [[ "$rc_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "release_candidate_tag must match v${VERSION}-rc.N" >&2
            exit 1
          fi
          if ! [[ "$STAGING_LABEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid staging_label" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate_sha }}
          fetch-depth: 0

      - name: Verify release candidate provenance
        run: |
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          tag_ref="refs/tags/$RC_TAG"
          test "$(git cat-file -t "$tag_ref")" = tag
          test "$(git rev-parse "${tag_ref}^{}")" = "$RC_SHA"

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: stage-rust1.91.0-macos-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            stage-rust1.91.0-macos-aarch64-

      - name: Build CPU-feature release metadata tool, controller and regression runner once
        run: cargo build --release --locked -p ferrum-bench-core -p ferrum-devtools --example release_candidate --bin release_delivery --bin model_regression

      - name: Verify all workspace release versions
        run: |
          ./target/release/examples/release_candidate verify \
            --workspace . --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Build, package and execute the macOS CPU program
        run: |
          cargo build --release --locked -p ferrum-cli --bin ferrum
          strip target/release/ferrum
          file target/release/ferrum > ferrum-macos-aarch64-cpu.dependencies.txt
          otool -L target/release/ferrum >> ferrum-macos-aarch64-cpu.dependencies.txt
          mkdir -p dist-cpu
          cp target/release/ferrum dist-cpu/ferrum
          cat LICENSE crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml > dist-cpu/LICENSE
          cp README.md dist-cpu/README.md
          asset=ferrum-macos-aarch64-cpu.tar.gz
          tar -C dist-cpu -czf "$asset" ferrum LICENSE README.md
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend cpu --target-triple aarch64-apple-darwin \
            --asset "$asset" --binary dist-cpu/ferrum \
            --dependencies ferrum-macos-aarch64-cpu.dependencies.txt
          ./target/release/release_delivery inspect --abi "$asset.abi.json" \
            --version "$VERSION" --candidate-sha "$RC_SHA" \
            --extract-dir "$RUNNER_TEMP/macos-cpu-startup" \
            --output "$RUNNER_TEMP/installation-macos-cpu.json"

      - name: Upload macOS CPU installation evidence
        uses: actions/upload-artifact@v4
        with:
          name: installation-macos-cpu
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/installation-macos-cpu.json

      - name: Build release Metal binary once
        run: cargo build --release --locked -p ferrum-cli --bin ferrum --features metal

      - name: Strip and audit binary
        shell: bash
        run: |
          strip target/release/ferrum
          file target/release/ferrum | tee ferrum-macos-aarch64.dependencies.txt
          otool -L target/release/ferrum | tee -a ferrum-macos-aarch64.dependencies.txt

      - name: Package staged Metal asset and adjacent manifests
        shell: bash
        run: |
          asset="ferrum-macos-aarch64.tar.gz"
          mkdir -p dist
          cp target/release/ferrum dist/ferrum
          cat LICENSE crates/ferrum-kernels/src/gguf_blocks/LICENSE.ggml > dist/LICENSE
          cp README.md dist/README.md
          tar -C dist -czf "$asset" ferrum LICENSE README.md
          ./target/release/examples/release_candidate manifest \
            --version "$VERSION" \
            --candidate-sha "$RC_SHA" --candidate-tag "$RC_TAG" \
            --staging-label "$STAGING_LABEL" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend metal --target-triple aarch64-apple-darwin \
            --asset "$asset" --binary target/release/ferrum \
            --dependencies ferrum-macos-aarch64.dependencies.txt \
            --cargo-features metal

      - name: Smoke test staged Metal binary
        shell: bash
        run: |
          mkdir -p smoke
          tar -C smoke -xzf ferrum-macos-aarch64.tar.gz
          version_output="$(./smoke/ferrum --version)"
          printf '%s\n' "$version_output"
          test "$version_output" = "ferrum $VERSION"
          ./smoke/ferrum --help >/dev/null

      - name: Package Metal regression runner
        run: |
          tar -C target/release -czf model-regression-macos-aarch64.tar.gz model_regression
          shasum -a 256 model-regression-macos-aarch64.tar.gz > model-regression-macos-aarch64.tar.gz.sha256
          shasum -a 256 target/release/model_regression > model-regression-macos-aarch64.binary.sha256

      - name: Package macOS release controller
        run: |
          tar -C target/release -czf release-delivery-macos-aarch64.tar.gz release_delivery
          shasum -a 256 release-delivery-macos-aarch64.tar.gz > release-delivery-macos-aarch64.tar.gz.sha256
          (cd target/release && shasum -a 256 release_delivery) > release-delivery-macos-aarch64.binary.sha256

      - name: Upload macOS release controller
        id: controller_id
        uses: actions/upload-artifact@v4
        with:
          name: release-delivery-macos-aarch64-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release-delivery-macos-aarch64.tar.gz
            release-delivery-macos-aarch64.tar.gz.sha256
            release-delivery-macos-aarch64.binary.sha256

      - name: Upload Metal regression runner
        id: runner_id
        uses: actions/upload-artifact@v4
        with:
          name: model-regression-macos-aarch64-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            model-regression-macos-aarch64.tar.gz
            model-regression-macos-aarch64.tar.gz.sha256
            model-regression-macos-aarch64.binary.sha256

      - name: Upload staged macOS CPU and Metal assets
        id: asset_id
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-macos-aarch64-${{ inputs.staging_label }}-${{ inputs.release_candidate_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ferrum-macos-aarch64.tar.gz
            ferrum-macos-aarch64.tar.gz.sha256
            ferrum-macos-aarch64.tar.gz.binary.sha256
            ferrum-macos-aarch64.tar.gz.version.json
            ferrum-macos-aarch64.tar.gz.dependency.json
            ferrum-macos-aarch64.tar.gz.abi.json
            ferrum-macos-aarch64.dependencies.txt
            ferrum-macos-aarch64-cpu.tar.gz
            ferrum-macos-aarch64-cpu.tar.gz.sha256
            ferrum-macos-aarch64-cpu.tar.gz.binary.sha256
            ferrum-macos-aarch64-cpu.tar.gz.version.json
            ferrum-macos-aarch64-cpu.tar.gz.dependency.json
            ferrum-macos-aarch64-cpu.tar.gz.abi.json
            ferrum-macos-aarch64-cpu.dependencies.txt
