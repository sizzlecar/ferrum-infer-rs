[package]
name = "ferrum-execution"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Product execution protocol and model-program driver for Ferrum"
readme = "../../README.md"

[dependencies]
ferrum-types = { workspace = true }
ferrum-interfaces = { workspace = true }
ferrum-runtime = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
pin-project-lite = "0.2"
thiserror = { workspace = true }
half = { workspace = true }
sha2 = "0.10"
tracing = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true, optional = true }

# Preserve accelerated checkpoint hashing where the original driver enabled it.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "macos", target_os = "linux")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[features]
default = []
test-support = ["dep:futures", "ferrum-runtime/test-support"]

[dev-dependencies]
futures = { workspace = true }
ferrum-runtime = { workspace = true, features = ["test-support"] }
tempfile = "3.8"
