[package]
name = "ferrum-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Language model architectures for Ferrum inference"
readme = "../../README.md"

[[example]]
name = "w3_qwen35_s1_dump"
required-features = ["test-support"]

[dependencies]
# Core dependencies - New architecture
ferrum-types = { workspace = true }
ferrum-interfaces = { workspace = true }
ferrum-runtime = { workspace = true }
ferrum-execution = { workspace = true }
ferrum-bench-core = { workspace = true }

# Optional runtime dependency for loading weights

# Async
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
pin-project-lite = "0.2"
parking_lot = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

# Tokenization (framework-agnostic)
tokenizers = { workspace = true }

# ML Framework - Candle
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
safetensors = { workspace = true }
memmap2 = "0.9"

# Unified compute kernels (CUDA/Metal/CPU).
ferrum-kernels = { workspace = true }
ferrum-quantization = { workspace = true }
half = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Quantization
bytemuck = { version = "1.23", features = ["derive"] }

# Utils
uuid = { workspace = true }
chrono = { workspace = true }
rand = "0.8"
toml = { workspace = true }
once_cell = "1.19"
dirs = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
hf-hub = { workspace = true }
indicatif = "0.17"
pathdiff = "0.2"
futures-util = "0.3"

# AArch64 acceleration is opt-in in sha2 0.10 and detects CPU support at runtime.
# Limit assembly integration to macOS/Linux; other targets retain portable hashing.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "macos", target_os = "linux")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
ferrum-testkit = { workspace = true }
float8 = { workspace = true }

[features]
default = []
# Enable runtime integration for weight loading
# Enable CUDA FlashAttention-2 and fused custom kernels
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
metal = ["ferrum-kernels/metal"]
cuda = ["ferrum-kernels/cuda"]
cuda-indexed-causal-attention = ["cuda", "ferrum-kernels/cuda-indexed-causal-attention"]
cuda-causal-gqa2 = ["cuda-indexed-causal-attention", "ferrum-kernels/cuda-causal-gqa2"]
cuda-q4-shared-weight-decode = ["cuda", "ferrum-kernels/cuda-q4-shared-weight-decode"]
cuda-q5-shared-weight-decode = ["cuda", "ferrum-kernels/cuda-q5-shared-weight-decode"]
cuda-upstream-linear = ["cuda", "ferrum-kernels/cuda-upstream-linear"] # Explicit locked upstream projection artifact.
cuda-upstream-extra-linear = ["cuda-upstream-linear", "ferrum-kernels/cuda-upstream-extra-linear"] # Independent locked extra-format artifact.
cuda-upstream-q6-f32-linear = ["cuda-upstream-extra-linear", "ferrum-kernels/cuda-upstream-q6-f32-linear"] # Independent locked Q6 F32 head artifact.
cuda-q6-f16-linear = ["cuda-upstream-q6-f32-linear", "ferrum-kernels/cuda-q6-f16-linear"]
candle-cuda-compat = [
    "cuda",
    "candle-core/cuda",
    "candle-nn/cuda",
    "ferrum-kernels/candle-cuda-compat",
]
marlin = ["cuda"]  # kept for backward compat, cuda already enables marlin
tensor-parallel = ["cuda"]  # backward compat alias
# Enable integration tests
integration-tests = []
# Enable built-in model registry
registry = []
# Deterministic tiny-model construction for downstream full-stack tests.
# Never enabled in release; turned on by ferrum-engine dev-dependencies.
test-support = []
