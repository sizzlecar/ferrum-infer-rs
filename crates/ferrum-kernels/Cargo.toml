[package]
name = "ferrum-kernels"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Unified compute kernels (CUDA/Metal/CPU) and model runner for Ferrum inference"
readme = "../../README.md"

[dependencies]
ferrum-runtime = { workspace = true }
ferrum-types = { workspace = true }
ferrum-interfaces = { workspace = true }
ferrum-native-ops = { workspace = true }
# Trace writer for FERRUM_TRACE_OUT chrome-trace JSON (Phase 1.5).
candle-core = { workspace = true }
half = { workspace = true }
float8 = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
sha2 = "0.10"
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "cublas", "f16", "nvrtc", "cuda-version-from-build-system", "dynamic-linking"], optional = true }
metal = { version = "0.31", optional = true }
libc = "0.2"

[dev-dependencies]
libloading = "0.8.9"

[target.'cfg(not(target_os = "windows"))'.dependencies]
# NCCL is unavailable on native Windows. Keep the existing CUDA feature
# set on other targets while Windows uses the single-device backend.
cudarc = { version = "0.19", default-features = false, features = ["nccl"], optional = true }

[build-dependencies]
bindgen_cuda = "0.1.6"
ferrum-native-ops = { workspace = true }
ferrum-types = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[features]
default = []
cuda = ["dep:cudarc", "marlin", "native-op-artifact"]
# Full production capability set; requires a matching native operator-set lock.
cuda-production = [
    "cuda-upstream-q6-f32-linear",
    "vllm-moe-marlin",
    "vllm-paged-attn-v2",
    "cuda-indexed-causal-attention",
    "cuda-q4-shared-weight-decode",
    "cuda-q5-shared-weight-decode",
    "cuda-causal-gqa2",
    "cuda-q6-f16-linear",
]
candle-cuda-compat = ["cuda", "candle-core/cuda"]
metal = ["dep:metal"]  # Metal backend (macOS).
marlin = []  # Marlin INT4xFP16 native artifact (auto-enabled by cuda).
vllm-marlin = ["cuda"]  # vLLM GPTQ-Marlin native artifact (Phase 12).
vllm-moe-marlin = ["cuda", "vllm-marlin"]  # vLLM Marlin MoE artifact (Stage
                        # 14). It also requires the dense Marlin repack export.
vllm-paged-attn-v2 = ["cuda"]  # vLLM paged-attention-v2 native artifact.
                        # Pairs with the core PTX kernel that writes its K/V
                        # layout. Runtime selection remains a typed product
                        # policy; source compilation is external to Cargo.
cuda-indexed-causal-attention = ["vllm-paged-attn-v2"] # Opt-in additive indexed native ABI.
cuda-causal-gqa2 = ["cuda-indexed-causal-attention"] # Additive production paired-query-head native export.
cuda-causal-gqa2-tests = ["cuda-indexed-causal-attention"] # Test-only separately built GQA2 native export.
fa2-source = ["cuda"]  # Backward-compatible obsolete alias. It no longer
                        # compiles vendored FlashAttention/CUTLASS source;
                        # FA2 must come from a Ferrum native operator artifact.
native-op-artifact = []  # Internal build-graph marker, enabled by `cuda`.
                        # CUDA native units fail closed when the explicit
                        # artifact-set lock is absent or partial; product builds
                        # never compile third-party CUDA/C++.
cuda-upstream-linear = ["cuda"] # Optional locked MMQ/MMVQ artifact; no default routing.
cuda-q4-shared-weight-decode = ["cuda-upstream-linear"] # Additive opt-in Q4 MMVQ M8 dot export.
cuda-q5-shared-weight-decode = ["cuda-upstream-linear"] # Independent opt-in Q5 MMVQ M8 dot export.
cuda-upstream-extra-linear = ["cuda-upstream-linear"] # Independent locked extra-format artifact.
cuda-upstream-q6-f32-linear = ["cuda-upstream-extra-linear"] # Independent locked Q6 F32 head artifact.
cuda-q6-f16-linear = ["cuda-upstream-q6-f32-linear"] # Explicit production Q6 F16 ABI2 exports; old F32-only locks remain compatible.
cuda-q6-f16-adapter-tests = ["cuda-upstream-q6-f32-linear"] # Test-only F16 ABI2 adapter in a separately qualified Q6 artifact.
tensor-parallel = ["cuda"]  # Kept as alias for backward compatibility.
# Use triton-rs-compiled PTX in place of hand-written .cu kernels.
# Requires `cuda` (we still launch via cudarc) and pre-generated PTX files
# under `triton_ptx/`, produced from triton-rs on Linux+CUDA.
triton-kernels = ["cuda", "candle-cuda-compat"]

[[example]]
name = "runtime_vnext_cuda_catalog"
path = "examples/runtime_vnext_cuda_catalog.rs"
required-features = ["cuda"]

[[example]]
name = "runtime_vnext_cuda_catalog_input"
path = "examples/runtime_vnext_cuda_catalog_input.rs"
required-features = ["cuda"]
