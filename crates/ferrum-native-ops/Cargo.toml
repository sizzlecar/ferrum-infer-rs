[package]
name = "ferrum-native-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native operator ABI and artifact resolver for Ferrum"

[features]
# Explicit native ABI conformance only. The caller supplies a source-builder
# archive through the standard linker search path; default builds stay CPU-only.
cuda-upstream-linear-tests = []
# Test-only dot export supplied by the independent shared-weight-decode archive.
cuda-upstream-shared-weight-decode-tests = ["cuda-upstream-linear-tests"]
# IQ4 shared-dot test symbol supplied only by the independent IQ4 experiment TU.
cuda-upstream-iq4-shared-weight-decode-tests = ["cuda-upstream-shared-weight-decode-tests"]
cuda-upstream-small-shared-weight-decode-tests = ["cuda-upstream-shared-weight-decode-tests"]
# Test-only F16 input pack exports; production pack and dot routes stay unchanged.
cuda-upstream-direct-f16-pack-tests = ["cuda-upstream-shared-weight-decode-tests"]
# Test-only full-output-tile MMQ dot supplied by the independent experiment TU.
cuda-upstream-full-tile-stream-k-tests = ["cuda-upstream-shared-weight-decode-tests"]
cuda-upstream-mmvq-pdl-tests = ["cuda-upstream-shared-weight-decode-tests"]
# Independent TEST TU; original split-MMQ plan and arithmetic are unchanged.
cuda-upstream-mmq-pdl-tests = ["cuda-upstream-linear-tests"]

[dependencies]
ferrum-types = { workspace = true }
libc = "0.2"
object = { version = "=0.37.3", default-features = false, features = ["read_core", "archive", "coff", "unaligned", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
half = { workspace = true }
