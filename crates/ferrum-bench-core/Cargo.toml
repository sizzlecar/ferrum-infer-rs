[package]
name = "ferrum-bench-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Canonical bench schema, metric aggregation, variance, and env_hash contracts for ferrum bench commands."

[dependencies]
ferrum-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
sha2 = "0.10"

# Structured release preparation keeps comments and dependency constraints.
toml_edit = "0.22.27"
semver = "1.0"
# Parse production/test item boundaries for change-based validation scope.
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"

[dev-dependencies]
half = { workspace = true }
tempfile = "3"
serde_yaml = "0.9"
clap = { workspace = true, features = ["derive"] }
