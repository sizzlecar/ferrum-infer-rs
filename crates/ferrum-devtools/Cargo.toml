[package]
name = "ferrum-devtools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Internal Ferrum release delivery and contract-check tools."

[[bin]]
name = "release_delivery"
path = "src/bin/release_delivery.rs"

[[bin]]
name = "contract_checks"
path = "src/bin/contract_checks.rs"

[[bin]]
name = "model_regression"
path = "src/bin/model_regression.rs"

[[bin]]
name = "agent_regression"
path = "src/bin/agent_regression.rs"

[dependencies]
anyhow = { workspace = true }
ferrum-bench-core = { workspace = true }
ferrum-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
semver = "1.0"
reqwest = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true, features = ["derive"] }
libc = "0.2"
rand = { workspace = true }
tempfile = "3"
chrono = { workspace = true }
axum = "0.7"
futures = { workspace = true }
tokio-stream = { workspace = true }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
